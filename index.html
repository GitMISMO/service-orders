  /* Everybody at one company whose screen is worth looking at: the order signer
     first, then everyone who logs time.  ⚠ The screen type is DERIVED from who
     they are rather than chosen separately — the signer gets the signer's
     screen and everybody else gets the rate-free one, which is the rule rather
     than a setting somebody could get wrong during a training session. */
  function viewAsPeople(C) {
    var F = C.F, out = [];
    var signer = F.signers && F.signers.order;
    if (signer) {
      out.push({ key: 'signer', name: signer.name, title: signer.title,
                 role: 'signer', what: 'the signer \u2014 everything they see' });
    }
    (F.people || []).forEach(function (pr) {
      if (!active(pr, H.parse(H.weekFor(F.fiscalYear || 'FY 2027', new Date())))) return;
      if (signer && pr.name === signer.name) return;    // already above
      if (!logsTime(F, pr) && !pr.timeManager && !pr.fullAccess) return;
      /* \u26a0 EVERY non-signer used to be hard-coded as a facilitator \u2014 hours only,
         no money \u2014 with no way for a second person at a company to see what the
         signer sees. A manager who is not the authorised signer therefore read
         as hours-only however their account was set, because this is a property
         of the PERSON RECORD and not of their access.
         `fullAccess: true` on the person is what says otherwise. */
      /* ⚠ Asked of the RULE, never guessed here — the label has to describe the
         screen this person actually gets. */
      if (roleFor(F, pr) === 'signer') {
        out.push({ key: pr.slug, name: pr.name, title: pr.title || '',
                   role: 'signer',
                   what: 'sees everything the signer sees' });
        return;
      }
      var n = ordersForPerson(F, pr, F.fiscalYear);
      out.push({ key: pr.slug, name: pr.name, role: 'facilitator',
                 what: n.all.length
                   ? 'logs ' + n.own.length + ' of their own' +
                     (n.cover.length ? ', can cover ' + n.cover.length + ' more' : '') +
                     ' \u2014 hours only, no money'
                   : 'time manager \u2014 hours only, no money' });
    });
    return out;
  }

    var rec = null;

    };

  /* ---- downloading the signed copies --------------------------------------
     One at a time, or several as one PDF with a page break between them.  The
     documents are already on the page, hidden; printing copies the chosen ones
     into the print host, so nothing is fetched and nothing can be stale. */
  function wireSigned(C, F) {
    var all = document.getElementById('sg-all');
    var go = document.getElementById('sg-go');
    var cnt = document.getElementById('sg-c');
    var host = document.getElementById('signhost');
    if (!host) return;

    function ticked() {
      return $$('#view .sgtick:checked').map(function (b) { return b.dataset.id; });
    }
    function paint() {
      var n = ticked().length;
      if (go) go.disabled = !n;
      if (cnt) cnt.textContent = n ? n + ' ticked' : 'Nothing ticked yet';
      if (all) {
        var boxes = $$('#view .sgtick');
        all.checked = boxes.length > 0 && n === boxes.length;
        all.indeterminate = n > 0 && n < boxes.length;
      }
    }
    $$('#view .sgtick').forEach(function (b) { b.addEventListener('change', paint); });
    if (all) all.addEventListener('change', function () {
      $$('#view .sgtick').forEach(function (b) { b.checked = all.checked; });
      paint();
    });
    paint();

    function printThese(ids, title) {
      var ph = document.getElementById('printhost');
      if (!ph) return;
      ph.innerHTML = '';
      ids.forEach(function (id, i) {
        var src = host.querySelector('.signdoc[data-doc="' + id + '"]');
        if (!src) return;
        var w = document.createElement('div');
        /* ⚠ One order per page. Without the break they run together and a
           two-page order ends up sharing a sheet with the next one. */
        if (i) w.className = 'pagebreak';
        w.innerHTML = src.innerHTML;
        ph.appendChild(w);
      });
      var t = document.title;
      document.title = title || (F.company + ' \u2014 Signed Service Orders');
      document.body.classList.add('printing');
      var done = function () {
        document.body.classList.remove('printing');
        ph.innerHTML = ''; document.title = t;
        window.removeEventListener('afterprint', done);
      };
      window.addEventListener('afterprint', done);
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { window.print(); setTimeout(done, 1200); });
      });
    }

    $$('#view .sgone').forEach(function (b) {
      b.addEventListener('click', function () {
        var o = orderById(F, b.dataset.id);
        printThese([b.dataset.id], o ? o.subject : null);
      });
    });
    if (go) go.addEventListener('click', function () {
      var ids = ticked();
      if (!ids.length) return;
      printThese(ids, F.company + ' \u2014 ' + ids.length + ' Signed Service Order' +
        (ids.length === 1 ? '' : 's'));
    });
  }

  /* what the nudge outbox is holding, and whether anything has gone out */
  function outboxLine(outbox) {
    var waiting = (outbox || []).filter(function (n) { return !n.sent; });
    var gone = (outbox || []).length - waiting.length;
    if (!outbox || !outbox.length) {
      return '<div class="note ok"><b>The nudge outbox is empty.</b> ' +
        '<code>notify/&lt;company&gt;.json</code> changes only when an order stops, so whatever is ' +
        'watching it has had nothing to send. See <b>NOTIFY.md</b> in the build package.</div>';
    }
    return '<div class="note' + (waiting.length ? '' : ' ok') + '"><b>' +
      (waiting.length
        ? waiting.length + ' ' + (waiting.length === 1 ? 'nudge is' : 'nudges are') + ' waiting to go out.'
        : 'Every nudge has gone out.') +
      '</b> ' + (gone ? gone + ' already sent. ' : '') +
      'They are queued in <code>notify/&lt;company&gt;.json</code> — one line per stopped order. ' +
      '<b>Until that file is wired to send mail, this list is the only place they appear.</b> ' +
      'See <b>NOTIFY.md</b>.</div>';
  }

  function fld(label, v, mono) {
    return '<div class="f"><label>' + esc(label) + '</label><div class="v' +
      (mono ? ' num' : '') + '">' + esc(v == null || v === '' ? '—' : v) + '</div></div>';
  }
  /* ⚠ What the signature will look like, before it can be used.
     Jonna, 29 September: put the signature boxes on the drafts, greyed out, so
     everyone can be shown during training exactly what signing looks like —
     without any possibility of signing something that has not been sent yet.
     The controls are disabled in the markup AND the order is not in To Review,
     so there is nothing to submit them to. */
  function signaturePreview(F, st) {
    if (st.sig) return '';
    if (st.key === 'sent' || st.key === 'changed') return '';   // the real one is live
    var why = st.key === 'draft'
      ? 'This order has not been released yet. ' + esc(F.vpProduct.name) + ' decides first.'
      : st.key === 'vp' ? 'Released, but MISMO has not sent it yet.'
      : st.key === 'vphold' ? 'Held by ' + esc(F.vpProduct.name) + '. It stops here until that is resolved.'
      : st.key === 'preshold' ? 'Held by ' + esc(F.mismoSigner.name) + '.'
      : st.key === 'acknowledged' ? 'Already accepted \u2014 it is with ' +
          esc(F.mismoSigner.name) + ' now.'
      : 'Not open for signing.';
    return '<div class="sigprev" aria-hidden="false">' +
      '<div class="sigprev-h">How You Will Accept This</div>' +
      '<div class="onebar">' +
      '<div class="f"><label>Type Your Name to Accept</label>' +
      '<input type="text" disabled placeholder="' + esc(F.signers.order.name) + '"></div>' +
      '<div class="f"><label>Title</label>' +
      '<input type="text" disabled value="' + esc(F.signers.order.title) + '"></div>' +
      '<button class="gobtn" type="button" disabled>Accept This Order</button>' +
      '</div>' +
      '<p class="fineprint"><b>Greyed out on purpose.</b> ' + why +
      ' When it reaches <b>To Review</b>, these come alive and this is exactly what you will see. ' +
      'Accepting records your name, the date and time, and the order word for word as it stood.</p>' +
      '</div>';
  }

  function signedBlock(st) {
    if (!st.sig) return '';
    var s = st.sig;
    var h = '<div class="signed"><b>' + esc(s.decision) + '</b> by ' + esc(s.signerName || '—') +
      (s.signerTitle ? ', ' + esc(s.signerTitle) : '') + ' on ' + esc(stamp(s.signedOn)) +
      '<span class="what">What was accepted: ' + esc(s.contentAccepted || '') + '</span></div>';

  function wireReview(C, st, toReview) {

    var titleEl = document.getElementById('acktitle');

      return Array.prototype.slice.call(document.querySelectorAll('.qtick:checked'))
        .map(function (b) { return b.dataset.id; });
    }
    /* What the ticked subset comes to, live.  A company accepts in batches, so
       the figure that matters while they are ticking is what THEY are about to
       commit to — not the total of everything waiting. */
    var byId = {};
    (toReview || []).forEach(function (o) { byId[o.id] = o; });

    function paint() {
      var ids = ticked(), n = ids.length, named = (nameEl.value || '').trim().length >= 2;
      go.disabled = !(n && named);

      var t = feeTotal(ids.map(function (id) { return byId[id]; }).filter(Boolean));
      qc.innerHTML = n + ' ticked — ' + feeWords(t) +
        (named ? ', ready to accept' : '. Type your name to accept them');
    }
    document.querySelectorAll('.qtick').forEach(function (b) { b.addEventListener('change', paint); });
    if (all) all.addEventListener('change', function () {
      document.querySelectorAll('.qtick').forEach(function (b) { b.checked = all.checked; });
      paint();
    });
    nameEl.addEventListener('input', paint);
    paint();

    go.addEventListener('click', function () {
      var ids = ticked();
      /* ⚠ This was called `who`, which shadowed the who() accessor — and its own
         initialiser then called the shadow, so every acceptance threw before it
         wrote anything.  Named for what it is instead. */
      var signedBy = { signerName: nameEl.value.trim(), signerTitle: titleEl.value.trim(),
                       signerEmail: who().email };

  /* =========================================================================
   * Jonna — the status board, sending, and the executed-document archive
   * ======================================================================= */
  /* =========================================================================
   * Revising a stopped order
   * =========================================================================
   * An order comes back — the VP held it, the President held it, or the
   * contracting company asked a question.  Before this existed there was
   * nothing to do about it: the reason was recorded and the order sat there.
   *
   * Three things make this work and they are worth stating:
   *
   *  1. SEPARATE FIELDS, not one box.  Each binding term is its own input,
   *     pre-filled with what the order says now, so revising is editing a
   *     figure rather than retyping a document.
   *  2. ONLY WHAT CHANGED IS WRITTEN.  Fields left alone are not recorded, so
   *     the revision reads as "the rate went from 150 to 140", not as a second
   *     copy of the order.
   *  3. IT GOES BACK TO THE VP BY ITSELF.  His queue is every order reading
   *     Draft, and a revision answers the stop that was holding it elsewhere.
   *     Nothing is routed; the status is derived.
   */
  var FEETYPES = [
    { v: 'hourly',    label: 'Hourly rate, up to a maximum fee' },
    { v: 'perReview', label: 'Paid per review — a fee schedule, no hourly rate' }
  ];

  var REVFIELDS = [

  /* One typed block of text to the list shape the generated orders use.
     Blank lines are dropped, so a stray newline does not become an empty
     bullet on a signed document. */
  function asList(v) {
    if (Array.isArray(v)) return v;
    if (v == null) return [];
    return String(v).split('\n').map(function (x) { return x.trim(); })
      .filter(function (x) { return x !== ''; });
  }

  function revValue(o, f) {
    var v = o[f.k];
    if (v == null) return '';
    if (Array.isArray(v)) return v.join('\n');
    return String(v);
  }

  function reviseBlock(n) {
    /* ⚠ The prefix keeps two revise forms for the SAME order apart — one in
       Needs You, one in Revise an Order. Without it both sets of inputs answer
       to the same selector and the save reads whichever the browser hands back
       first, which is not necessarily the one being typed into. */
    var o = n.order, p = (n.pfx || 'rv') + n.idx;
    var hist = (o.revisionHistory || []).length
      ? '<p class="fineprint">' + (o.revisionHistory || []).map(function (rv, i) {
          return 'Revision ' + (i + 1) + ' — ' + esc(rv.revisedBy || '') + ', ' +
            esc(stamp(rv.revisedOn)) + ': ' + esc(rv.note || '');
        }).join('<br>') + '</p>'
      : '';
    var fields = REVFIELDS.map(function (f) {
      var v = revValue(o, f);
      var input;
      if (f.type === 'pick') {
        /* An order the generator produced carries no feeType. It is read from
           `source` instead, exactly as the document reads it, so the box opens
           showing what the order actually IS rather than defaulting to hourly
           and inviting somebody to save that over a per-review order. */
        var cur = v || (o.source === 'certification' ? 'perReview' : 'hourly');
        input = '<select class="revf" data-p="' + p + '" data-k="' + esc(f.k) + '">' +
          f.opts.map(function (opt) {
            return '<option value="' + esc(opt.v) + '"' +
              (opt.v === cur ? ' selected' : '') + '>' + esc(opt.label) + '</option>';
          }).join('') + '</select>';
      } else if (f.type === 'area') {
        input = '<textarea class="revf" rows="3" data-p="' + p + '" data-k="' + esc(f.k) + '">' +
          esc(v) + '</textarea>';
      } else {
        input = '<input type="text" class="revf" data-p="' + p + '" data-k="' + esc(f.k) +
          '" value="' + esc(v) + '">';
      }
      return '<div class="f' + (f.type === 'area' ? ' wide' : '') + '"><label>' +
        esc(f.label) + '</label>' + input + '</div>';
    }).join('');

    return '<h4 class="subh">Revise This Order</h4>' +
      '<p class="lede">Change only what is wrong. Anything you leave alone is not recorded. ' +
      '<b>Changing a binding term — the rate, the hours, the maximum fee, the dates, Services, ' +
      'Deliverables, what MISMO provides or the agreed modifications — sends it back to ' +
      esc(((n.C.F.vpProduct) || {}).name || 'the VP') + ' for a fresh decision</b>, because the terms ' +
      'he decided on are not the terms any more. Changing only the title does not.</p>' +
      hist +
      '<div class="revgrid">' + fields + '</div>' +
      '<div class="onebar"><div class="f"><label>What Changed, and Why</label>' +
      '<input type="text" class="revwhy" data-p="' + p + '" ' +
      'placeholder="Goes on the record beside the hold and travels with the order"></div>' +
      '<button class="gobtn rev-go" type="button" data-p="' + p + '" data-slug="' + esc(n.C.slug) +
      '" data-id="' + esc(o.id) + '">Save the Revision</button></div>' +
      '<p class="fineprint">⚠ <b>A reason is required</b> — it is what ' +
      esc(((n.C.F.vpProduct) || {}).name || 'the VP') + ' reads when the order reaches him again. ' +
      'The hold and its reason stay on the record; the revision sits beside them. ' +
      '<b>Nothing is overwritten and nothing is deleted.</b></p>';
  }

  function adminView() {
    busy('Reading every company…');
    Promise.all([
      loadAll(ME.slugs),
      Promise.all(ME.slugs.map(function (s) {
        return R.read(keyFor(s), 'notify/' + s + '.json')
          .then(function (r) { return r.data.notices || []; })
          .catch(function () { return []; });
      }))
    ]).then(function (both) {
      var list = both[0];
      var outbox = [].concat.apply([], both[1]);
      var tally = { draft: 0, vp: 0, vphold: 0, sent: 0, question: 0, acknowledged: 0, changed: 0,
        preshold: 0, executed: 0 };
      list.forEach(function (C) {
        C.st = {};
        C.F.orders.forEach(function (o) {
          var s = statusOf(o, C.sigs); C.st[o.id] = s; tally[s.key] = (tally[s.key] || 0) + 1;
        });
      });
      var LABEL = { draft: 'Draft', vp: 'Released to Send', vphold: 'Held by the VP', sent: 'Sent',
        question: 'Question Raised', acknowledged: 'Acknowledged', changed: 'Changed Since Acknowledged',
        preshold: 'Held by the President', executed: 'Executed' };

      /* ---- the Status Board, in the Website Migration HQ shape -------------
         ⚠ Eight equal white boxes gave every status the same weight, so the one
         that needed Jonna looked exactly like the six that did not.  The HQ
         shape says where the whole thing STANDS first, in a sentence, then
         four figures worth acting on, then a card per company. */
      var totalOrders = list.reduce(function (a, C) { return a + C.F.orders.length; }, 0);
      var totalLetters = list.reduce(function (a, C) { return a + C.F.letters.length; }, 0);
      var needsCount = (tally.question || 0) + (tally.changed || 0) + (tally.vphold || 0) +
        (tally.preshold || 0);
      var moving = (tally.sent || 0) + (tally.acknowledged || 0);
      var boardValue = list.reduce(function (a, C) {
        return a + C.F.orders.reduce(function (b, o) { return b + (o.maximumFee || 0); }, 0);
      }, 0);

      /* One line saying where it all is.  It changes as the year moves, so it is
         built from the tallies rather than written once. */
      var standing;
      if (tally.executed === totalOrders && totalOrders) {
        standing = '<em>Every order is executed.</em> The fiscal year is fully papered.';
      } else if (!tally.vp && !tally.sent && !tally.acknowledged && !tally.executed) {
        standing = '<em>' + totalOrders + ' orders</em> are drafted and <em>none has been released</em> yet.';
      } else {
        var bits = [];
        if (tally.vp) bits.push('<em>' + tally.vp + '</em> ready for you to send');
        if (tally.sent) bits.push('<em>' + tally.sent + '</em> with the companies');
        if (tally.acknowledged) bits.push('<em>' + tally.acknowledged + '</em> accepted and waiting on ' +
          esc((list[0].F.mismoSigner || {}).name || 'the President'));
        if (tally.executed) bits.push('<em>' + tally.executed + '</em> executed');
        standing = bits.length ? bits.join(' · ') + '.' : '<em>Nothing is moving yet.</em>';
      }
      if (needsCount) {
        standing += ' <em class="hl-late">' + needsCount + '</em> ' +
          (needsCount === 1 ? 'has stopped and needs' : 'have stopped and need') + ' you.';
      }

      var board =
        '<div class="vhead"><div class="grow"><h1>Where Everything Has Got To</h1>' +
        '<p>Every FY 2027 service order across all five contracting companies, and what is ' +
        'waiting on whom.</p></div></div>' +

        '<div class="headline">' +
        '<div class="hl-date">Fiscal Year 2027 · 1 October 2026 to 30 September 2027</div>' +
        '<p class="hl-say">' + standing + '</p>' +
        '<div class="tiles">' +
          '<div class="tile"><b>' + totalOrders + '</b><span>Service Orders</span>' +
            '<small>' + totalLetters + ' agreements as well</small></div>' +
          '<div class="tile"><b>' + money0(boardValue) + '</b><span>Maximum Fee</span>' +
            '<small>certification work is paid per review</small></div>' +
          '<div class="tile' + (tally.vp ? ' warn' : '') + '"><b>' + (tally.vp || 0) + '</b>' +
            '<span>Ready for You to Send</span>' +
            '<small>' + (tally.draft || 0) + ' still with ' +
            esc(((list[0].F.vpProduct) || {}).name || 'the VP') + '</small></div>' +
          '<div class="tile' + (needsCount ? ' warn' : '') + '"><b>' + needsCount + '</b>' +
            '<span>Stopped, Needing You</span>' +
            '<small>' + (tally.question || 0) + ' questions · ' +
            ((tally.vphold || 0) + (tally.preshold || 0)) + ' held · ' +
            (tally.changed || 0) + ' changed</small></div>' +
        '</div></div>' +

        '<div class="sect-t">Company by Company</div><div class="cards">' +
        list.map(function (C) {
          var c = function (k) {
            return C.F.orders.filter(function (o) { return C.st[o.id].key === k; }).length;
          };
          var mine = c('question') + c('changed') + c('vphold') + c('preshold');
          var n = C.F.orders.length;
          var done = c('executed');
          /* What this company is actually waiting on, said as a sentence rather
             than left for somebody to work out from six columns. */
          var next;
          if (mine) {

      var reviseAny = (function () {

      var sendBody = '<p class="lede">An order can be sent once ' + esc(list[0].F.vpProduct.name) +

      var archive = '<p class="lede">Each MSA extension letter, ready to download and send to ' +

            var host = 'ltr-' + C.slug + '-' + String(l.msaFlavour).toLowerCase().replace(/[^a-z0-9]+/g, '');

            if (ex) {

      whoEl.innerHTML = esc(ME.name) + ' <i>·</i> ' + esc(ME.title);

      loadAllHours(list).then(function (by) {

      function drawAdmin(approveBody, waiting, by) {

      function wireAdminControls(root) {
      /* ---- saving a company's details ------------------------------------ */
      (root || document).querySelectorAll('.cd-go').forEach(function (b) {
        if (b.dataset.wired) return; b.dataset.wired = '1';

          var C = list.filter(function (x) { return x.slug === slug; })[0];
          if (!C) return;
          var F = C.F;

          function val(prefix, k) {

            return el ? String(el.value == null ? '' : el.value).trim() : '';
          }

          var d = { letters: {}, people: {} };

          /* The order signer. Only the fields that differ are recorded, so a

          var s = (F.signers || {}).order || {}, sg = {};
          if (val(p, 'sname') !== (s.name || '')) sg.name = val(p, 'sname');

          (F.letters || []).forEach(function (l, li) {

            var was = l.address || [];
            var now = [0, 1, 2, 3].map(function (i) { return val(lp, 'addr' + i); })

            /* ⚠ Compared as text, so re-saving an untouched address records

               printed as a gap in a legal letter. */
            if (now.join('\n') !== was.join('\n')) one.address = now;
            if (val(lp, 'sal') !== (l.salutation || '')) one.salutation = val(lp, 'sal');
            var ls = l.signer || {}, lsg = {};
            if (val(lp, 'lname') !== (ls.name || '')) lsg.name = val(lp, 'lname');
            if (val(lp, 'ltitle') !== (ls.title || '')) lsg.title = val(lp, 'ltitle');
            if (val(lp, 'lemail') !== (ls.email || '')) lsg.email = val(lp, 'lemail');
            if (Object.keys(lsg).length) one.signer = lsg;
            if (Object.keys(one).length) d.letters[l.msaFlavour] = one;
          });

          /* company-wide cover switch */
          var coverNow = val(p, 'coverall') === 'yes';
          if (coverNow !== !!F.coverAll) d.coverAll = coverNow;

          d.orders = {};
          (F.orders || []).forEach(function (o, oi) {

            if (!Object.keys(next.details.signer).length) delete next.details.signer;

            });
            Object.keys(d.orders || {}).forEach(function (k) {
              next.details.orders[k] = Object.assign({}, next.details.orders[k] || {}, d.orders[k]);
            });
            if (!Object.keys(next.details.orders).length) delete next.details.orders;

            subject: vals.subject,
            msaFlavour: vals.msaFlavour || ((C.F.letters || [])[0] || {}).msaFlavour || '',
            hourlyRate: vals.hourlyRate === '' ? null : Number(vals.hourlyRate.replace(/[^0-9.\-]/g, '')),
            estimatedHours: vals.estimatedHours === '' ? null : Number(vals.estimatedHours.replace(/[^0-9.\-]/g, '')),
            maximumFee: vals.maximumFee === '' ? null : Number(vals.maximumFee.replace(/[^0-9.\-]/g, '')),
            startDate: vals.startDate, endDate: vals.endDate,
            description: vals.description,
            /* ⚠ LISTS, not text. The generated orders hold these two as lists
               and the document renders them as bullets. Storing a typed block
               of text here is what broke every view the first time. One line
               per bullet. */
            services: asList(vals.services),
            deliverables: asList(vals.deliverables),
            deliverySchedule: vals.deliverySchedule,
            paymentSchedule: vals.paymentSchedule,
            tasksFromMismo: vals.tasksFromMismo, modifications: vals.modifications,
            /* ⚠ No forecast line and no budget check — Jonna's decision,
               1 Oct 2026, to be revisited when the financial system is up. */
            forecastLine: null,
            raisedBy: who().name, raisedOn: new Date().toISOString(), raisedWhy: why
          };
          ['hourlyRate', 'estimatedHours', 'maximumFee'].forEach(function (k) {
            if (order[k] != null && !isFinite(order[k])) order[k] = null;
          });

          b.disabled = true; b.textContent = 'Raising…';
          R.update(keyFor(slug), 'revisions/' + slug + '.json', function (cur) {
            var next = JSON.parse(JSON.stringify(cur || {}));
            next.company = next.company || slug;
            next.additions = (next.additions || []).concat([order]);
            return next;
          }, 'new order: ' + order.subject, { revisions: [] })
            .then(function () {
              toast('Raised — it is with ' +
                (((C.F.vpProduct) || {}).name || 'the VP') + ' for a decision', 'good');
              adminView();
            })
            .catch(function (e) {
              b.disabled = false; b.textContent = 'Raise This Order';
              failed(e);
            });
        });
      });

      /* ---- saving a revision ------------------------------------------- */
      (root || document).querySelectorAll('.rev-go').forEach(function (b) {
        if (b.dataset.wired) return; b.dataset.wired = '1';
        b.addEventListener('click', function () {
          var p = b.dataset.p, slug = b.dataset.slug, id = b.dataset.id;
          var C = list.filter(function (x) { return x.slug === slug; })[0];
          if (!C) return;
          var o = C.F.orders.filter(function (x) { return x.id === id; })[0];
          if (!o) return;

          var whyEl = document.querySelector('.revwhy[data-p="' + p + '"]');
          var why = whyEl ? String(whyEl.value || '').trim() : '';
          /* ⚠ Refused without a reason, the same way a hold is.  A revision with
             no note tells the VP that the order changed and nothing about why,
             which is the thing he most needs when it lands back on him. */
          if (!why) {
            toast('Say what changed and why first');
            if (whyEl) { whyEl.focus(); }
            return;
          }

          /* Only genuinely different values are recorded.  A field typed back to
             what it already said is not a change. */
          var changes = {}, before = {};
          document.querySelectorAll('.revf[data-p="' + p + '"]').forEach(function (el) {
            var k = el.dataset.k;
            var f = REVFIELDS.filter(function (x) { return x.k === k; })[0] || { k: k, type: 'text' };
            var typed = String(el.value == null ? '' : el.value).trim();
            var now = revValue(o, f).trim();
            /* The picker opens showing what the order already is, worked out
               from `source` when the field itself is empty. Compare against
               that same value, or every save would record a feeType "change"
               nobody made and send the order back to the VP for it. */
            if (f.type === 'pick' && !now) now = (o.source === 'certification' ? 'perReview' : 'hourly');
            if (typed === now) return;
            before[k] = o[k] == null ? null : o[k];
            if (f.type === 'money' || f.type === 'num') {
              var num = typed === '' ? null : Number(typed.replace(/[^0-9.\-]/g, ''));
              if (typed !== '' && !isFinite(num)) { changes[k] = typed; return; }
              changes[k] = num;
            } else if (Array.isArray(o[k])) {
              changes[k] = typed === '' ? [] : typed.split('\n');
            } else {
              changes[k] = typed;
            }
          });

          if (!Object.keys(changes).length) {
            toast('Nothing was changed');
            return;
          }

          var binding = touchesBinding(changes);
          var record = {
            orderId: o.id,
            order: o.subject,
            rev: (o.rev || 0) + 1,
            changes: changes,
            before: before,
            binding: binding,
            note: why,
            answering: { status: (C.st[o.id] || {}).label || '', said: ((C.st[o.id] || {}).sig || {}).note ||
                         ((C.st[o.id] || {}).sig || {}).question || '' },
            revisedBy: who().name,
            revisedOn: new Date().toISOString()
          };

          b.disabled = true; b.textContent = 'Saving…';
          addRevision(slug, record)
            .then(function () {
              /* The nudge is the VP's, not Jonna's — it is him the order is
                 going back to.  A revision that changes nothing binding stays
                 where it is, so nobody is nudged about it. */
              if (!binding) return null;
              return notify(slug, {
                kind: 'revised', orderId: o.id, order: o.subject, company: C.F.company,
                who: who().name, said: why, raisedOn: record.revisedOn,
                forAttentionOf: ((C.F.vpProduct) || {}).email || 'jkearns@mismo.org',
                sent: false, sentOn: null
              });
            })
            .then(function () {
              toast(binding
                ? 'Revised — back with ' + (((C.F.vpProduct) || {}).name || 'the VP') + ' for a decision'
                : 'Revised — nothing binding changed, so it stays where it is', 'good');
              adminView();
            })
            .catch(function (e) {
              b.disabled = false; b.textContent = 'Save the Revision';
              failed(e);
            });
        });
      });

      (root || document).querySelectorAll('.sendco').forEach(function (b) {
        if (b.dataset.wired) return; b.dataset.wired = '1';
        b.addEventListener('click', function () {
          var C = list.filter(function (x) { return x.slug === b.dataset.slug; })[0];
          var when = new Date().toISOString();
          b.disabled = true; b.textContent = 'Sending…';
          /* ⚠ NOT orders/<slug>.json. That file is read-only to this page now —
             deliberately, so a contracting company cannot rewrite its own rate —
             and the relay scopes by project, not by person, so it is read-only
             to MISMO as well. Writing the send date here keeps the generator's
             file untouched and keeps this button working. */
          R.update(keyFor(C.slug), 'revisions/' + C.slug + '.json', function (cur) {
            var next = JSON.parse(JSON.stringify(cur || {}));
            next.company = next.company || C.slug;
            next.sent = next.sent || {};
            C.F.orders.forEach(function (o) {
              if (C.st[o.id] && C.st[o.id].key === 'vp' && !next.sent[o.id]) next.sent[o.id] = when;
            });
            return next;
          }, 'sent orders to ' + C.F.company, { revisions: [] })
            .then(function () { toast('Sent to ' + C.F.signers.order.name, 'good'); adminView(); })
            .catch(function (e) { b.disabled = false; failed(e); });
        });
      });
      (root || document).querySelectorAll('.exec-go').forEach(function (b) {
        if (b.dataset.wired) return; b.dataset.wired = '1';
        b.addEventListener('click', function () {
          var slug = b.dataset.slug, flav = b.dataset.flav;
          var f = document.querySelector('.exec-file[data-slug="' + slug + '"][data-flav="' + flav + '"]');
          var env = document.querySelector('.exec-env[data-flav="' + flav + '"]');
          if (!f || !f.files || !f.files[0]) { toast('Choose the executed PDF first'); return; }
          var file = f.files[0];
          b.disabled = true; b.textContent = 'Filing…';
          var fr = new FileReader();
          fr.onload = function () {
            var b64 = String(fr.result).split(',')[1];
            var path = 'agreements/' + slug + '/' + flav.toLowerCase() + '-fy2027.pdf';
            /* ⚠ Was R.write('orders', …) — a function the relay module does not
               have, against the old single-project alias.  It would have thrown
               the first time an executed MSA was filed.  A PDF goes through as
               base64 or every byte that is not valid UTF-8 is mangled, and that
               only shows when somebody opens the file. */
            R.commit(keyFor(slug), [R.binaryFile(path, b64)], 'executed ' + flav + ' MSA')
              .then(function () {
                /* ⚠ The fallback is not optional. The FIRST executed agreement
                   filed for a company writes this file into existence, and
                   without a fallback `cur` arrives undefined and the copy
                   throws — so filing would have failed for every company until
                   somebody had already filed for it, which never happens. */
                return R.update(keyFor(slug), 'agreements/' + slug + '.json', function (cur) {
                  var next = JSON.parse(JSON.stringify(cur || { agreements: [] }));
                  next.agreements = (next.agreements || []).filter(function (a) {
                    return a.msaFlavour !== flav;
                  }).concat([{
                    msaFlavour: flav, executedOn: new Date().toISOString().slice(0, 10),
                    envelopeId: (env && env.value.trim()) || '', file: path,
                    filedBy: ME.name, filedOn: new Date().toISOString()
                  }]);
                  return next;
                }, 'filed executed ' + flav + ' MSA', { agreements: [] });
              })
              .then(function () { toast('Filed — ' + flav + ' is now in their My Agreements', 'good'); adminView(); })
              .catch(function (e) { b.disabled = false; b.textContent = 'File It'; failed(e); });
          };
          fr.readAsDataURL(file);
        });
      });
      }   /* wireAdminControls */
      }   /* drawAdmin */
    }).catch(closed);
  }

  /* =========================================================================
   * Failure, and the closed door
   * ======================================================================= */
  function failed(e) {
    /* ⚠ First, before anything else: a write refused because she is viewing as
       somebody else is not a failure and must never read like one.  Pressing
       the button is the point of a training session. */
    if (e && e.readOnly) {
      toast('Nothing saves while you are viewing as ' +
            ((VIEWAS && VIEWAS.company) || 'somebody else') + '.', 'warn');
      return;
    }
    /* ⚠ A refused PATH is not a refused PERSON, and must never sign anybody out.
       The relay answers 403 for both "your session is over" and "this page is
       not allowed to touch that folder", and treating them alike turned a
       missing line of configuration into an apparent lockout — twice, with the
       typing lost both times because the page reloaded. Say which folder, keep
       them signed in, keep what they typed on screen. */
    if (e && e.status === 403 &&
        (e.code === 'PATH_NOT_WRITABLE' || e.code === 'PATH_NOT_READABLE')) {
      var p = (e.body && e.body.path) || 'that folder';
      toast('This page is not allowed to save to ' + p +
            ' — nothing was lost. The relay’s project settings need that path.', 'warn');
      return;
    }
    if (e && e.closed) { closed(e); return; }
    if (e && e.status === 409) { toast('Somebody else saved at the same moment — try again', 'warn'); return; }
    toast('That did not save. Nothing has changed.', 'warn');
  }
  function closed(e) {
    if (e && e.readOnly) { failed(e); return; }
    if (e && e.status === 409) { toast('Somebody else saved first — reloading'); return; }
    if (e && e.needsLogin) { signInView(); return; }
    /* A session that has run out, or been withdrawn, is not an error the person
       can do anything about except sign in again — so say that, and show the
       form rather than a dead end. */
    if (e && e.closed) {
      R.signOut();
      signInView('<b>Your session has ended.</b> Sessions last four hours. ' +
        'Sign in again to carry on \u2014 nothing you saved has been lost.');
      return;
    }
    /* Anything else is this page going wrong, not the person. Say so plainly and
       keep them signed in \u2014 signing them out here would hide the fault and
       waste their time on a password they never got wrong. */
    if (window.console && console.error) console.error('service orders:', e);
    var code = (e && e.code) || '';
    /* Two failures are worth naming, because the fix is somebody else's and
       saying which one saves a round of guessing. */
    if (code === 'UNKNOWN_PROJECT') {
      shut('The Relay Does Not Know About These Yet',
        'You are signed in and your account is fine. The relay answered <b>UNKNOWN_PROJECT</b>, ' +
        'which means the service order projects are not reachable to it yet.' +
        (e.project ? '<br><br>The key it refused was <b>' + esc(e.project) + '</b>.' : '') +
        '<br><br>Two things have to be true, and one of them is not: the five entries are in ' +
        '<b>projects.json</b>, and the six repositories are on the <b>relay token</b>. ' +
        'The second one is Perry\u2019s.' +
        '<br><br>Nothing is wrong with your setup, and nothing has been changed or sent.');
      return;
    }
    if (e && e.missing) {
      shut('A File Is Missing',
        'You are signed in and your account is fine, but a file this page needs is not in the ' +
        'repository yet.' +
        (e.message ? '<br><br><span class="fineprint">' + esc(e.message) + '</span>' : '') +
        '<br><br>This usually means the upload in step 4 has not been done for one company. ' +
        'Nothing has been changed and nothing has been sent.');
      return;
    }
    shut('Something Went Wrong at Our End',
      'You are signed in and your account is fine \u2014 this page failed to build your view. ' +
      'Nothing has been changed and nothing has been sent.' +
      (e && e.message ? '<br><br><span class="fineprint">' + esc(e.message) +
        (e.project ? ' \u2014 ' + esc(e.project) : '') + '</span>' : '') +
      '<br><br><b>Email Jonna Critchley at jcritchley@mismo.org</b> and quote that line.' +
      '<br><span class="fineprint">Build ' + esc(BUILD) + '</span>');
  }

  /* =========================================================================
   * Boot — read the key out of the fragment, ask the relay who this is,
   * and show that person their own view.  No role is remembered.
   * ======================================================================= */
  /* ---- signing in --------------------------------------------------------
     Email and password, which the relay checks.  Nothing about who somebody is
     is decided here: the relay hands back an access map and the page draws what
     that map allows.  Passwords are never stored, never logged and never put
     anywhere but the one request that checks them. */
  function signInView(note) {
    /* Signed out there is nothing to navigate to, so the rail and its search box
       go away entirely rather than sitting there empty. The masthead stays,
       because the one thing this screen must do is say whose tool it is. */
    document.body.classList.add('signedout');
    whoEl.textContent = '';
    say(
      '<div class="signwrap"><div class="signcard">' +
        '<div class="signmark">' +
          '<svg class="wordmark" role="img" aria-label="MISMO" viewBox="0 0 708 108"><use href="#mismo-logo"/></svg>' +
        '</div>' +
        '<h2>Service Orders and Agreements</h2>' +
        '<p class="signsub">Your FY 2027 service orders, your Master Services Agreement extensions, ' +
        'and the hours logged against each one.</p>' +
        '<div id="si-note" class="signnote">' + (note ? '<div class="note warn">' + note + '</div>' : '') + '</div>' +
        '<div class="signfields">' +
          '<div class="f"><label for="si-email">Email</label>' +
            '<input type="email" id="si-email" autocomplete="username" spellcheck="false" ' +
            'autocapitalize="off" placeholder="you@yourcompany.com"></div>' +
          '<div class="f"><label for="si-pass">Password</label>' +
            '<input type="password" id="si-pass" autocomplete="current-password" ' +
            'placeholder="paste the password you were sent"></div>' +
        '</div>' +
        '<button class="signgo" type="button" id="si-go">Sign In</button>' +
        '<p class="signfine">Your session lasts four hours and ends when you close this tab.<br>' +
        'No password? Email <a href="mailto:jcritchley@mismo.org">Jonna Critchley</a>.</p>' +
        '<p class="signfine buildline">Build ' + esc(BUILD) + '</p>' +
      '</div></div>');

    var emailEl = document.getElementById('si-email');
    var passEl  = document.getElementById('si-pass');
    var goEl    = document.getElementById('si-go');
    var noteEl  = document.getElementById('si-note');
    if (emailEl) emailEl.focus();

    function warn(html) {
      if (noteEl) noteEl.innerHTML = '<div class="note warn">' + html + '</div>';
      goEl.disabled = false;
      goEl.textContent = 'Sign In';
    }
    function go() {
      var email = (emailEl.value || '').trim();
      var pass  = passEl.value || '';
      if (!email || !pass) {
        warn('<b>Both are needed.</b> Type the email your account was set up with and the ' +
             'password you were sent.');
        (email ? passEl : emailEl).focus();
        return;
      }
      goEl.disabled = true;
      goEl.textContent = 'Checking…';
      if (noteEl) noteEl.innerHTML = '';
      R.loginAny(email, pass).then(function () {
        document.body.classList.remove('signedout');
        start();
      }).catch(function (e) {
        if (e && e.noServiceOrders) {
          warn('<b>Your password is fine.</b> This account is recognised, but it has no service ' +
               'orders on it yet \u2014 service orders are a separate permission from MISMO\u2019s ' +
               'other tools. <b>Email Jonna Critchley</b> at ' +
               '<a href="mailto:jcritchley@mismo.org">jcritchley@mismo.org</a> and she can add it.');
          return;
        }
        if (e && e.code === 'UNKNOWN_PROJECT') {
          warn('<b>This is not your password.</b> The relay does not yet have the service order ' +
               'projects set up, so there is nothing to sign in to. Nothing you can do will fix ' +
               'this from here \u2014 tell Jonna the relay answered <b>UNKNOWN_PROJECT</b>' +
               (e.project ? ' for <b>' + esc(e.project) + '</b>' : '') + '.');
          return;
        }
        if (e && e.closed) {
          warn('<b>That email and password were not recognised.</b> Check the address is the one ' +
               'MISMO set up, and that the password was pasted whole — they are long on purpose. ' +
               'Nothing is locked; you can try again.');
          passEl.value = ''; passEl.focus();
          return;
        }
        warn('<b>The sign-in service did not answer.</b> This is not your password. ' +
             'Try again in a moment, and tell Jonna if it keeps happening.' +
             (e && e.message ? '<br><span class="signerr">' + esc(e.message) + '</span>' : ''));
      });
    }
    goEl.addEventListener('click', go);
    [emailEl, passEl].forEach(function (el) {
      el.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') go(); });
    });
  }

  /* Signed in, recognised, but this account carries no service-orders key.  The
     commonest cause by far is an account that already existed for another tool
     on resources.mismo.org and has simply not been given one here yet \u2014 so
     say that, and name what it does carry, rather than leaving somebody
     wondering whether they typed their password wrong. */
  function noKeys(me) {
    var other = (me && me.otherKeys) || [];
    shut('Your Account Is Not Set Up for This Yet',
      'You are signed in as <b>' + esc(me.email || '') + '</b> and your password is fine. ' +
      'The account just has no service orders against it yet.' +
      (other.length
        ? '<br><br>It does reach ' + (other.length === 1 ? 'one other MISMO tool' :
            other.length + ' other MISMO tools') + ': <b>' + esc(other.join(', ')) + '</b>. ' +
          'Service orders are a separate permission and have to be added to it.'
        : '') +
      '<br><br><b>Email Jonna Critchley at jcritchley@mismo.org</b> and she can add it.');
  }

  function start() {
    R.boot();
    if (!R.signedIn()) { signInView(); return; }
    document.body.classList.remove('signedout');
    busy('Reading your documents…');
    R.whoami().then(function (me) {
      ME = me;
      if (me.kind === 'contractor') return contractorView();
      if (me.kind === 'president') return presidentView();
      if (me.kind === 'vp-product') return vpView();
      if (me.kind === 'admin') return adminView();
      noKeys(me);
    }).catch(closed);
  }

  /* print / save as PDF — the platform has no build step, so the browser's own
     print dialog over a print stylesheet is what makes the PDF */
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-print]');
    if (!b) return;
    e.preventDefault(); e.stopPropagation();
    var src = document.getElementById(b.dataset.print);
    if (!src) return;
    var host = document.getElementById('printhost');
    host.innerHTML = src.innerHTML;
    var t = document.title;
    document.title = b.dataset.title || t;
    document.body.classList.add('printing');
    var done = function () {
      document.body.classList.remove('printing');
      host.innerHTML = ''; document.title = t;
      window.removeEventListener('afterprint', done);
    };
    window.addEventListener('afterprint', done);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { try { window.print(); } catch (err) { done(); } });
    });
  }, true);

  window.MISMO_PORTAL = { start: start, refresh: function () { start(); } };
  if (!window.MISMO_PORTAL_MANUAL) start();
})();
</script>
<script>(function(){"use strict";
const KEY='hq.rail.off';
function set(off,remember){
  document.body.classList.toggle('railmini',!!off);
  const h=document.getElementById('rail-hide');
  if(h){h.setAttribute('aria-expanded',off?'false':'true');
    h.setAttribute('aria-label',off?'Open the menu':'Narrow the menu');
    h.title=(off?'Open the menu':'Narrow the menu')+' (backslash)';}
  if(off) close();
  if(remember!==false){try{localStorage.setItem(KEY,off?'1':'0');}catch(e){}}
  setTimeout(()=>{window.dispatchEvent(new Event('resize'));},230);
}
function toggle(){set(!document.body.classList.contains('railmini'));}
document.addEventListener('keydown',e=>{
  const t=e.target,typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
  if(e.key==='\\'&&!typing&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();toggle();}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();set(false);
    setTimeout(()=>{const q=document.getElementById('rail-q');if(q){q.focus();q.select();}},230);}
});
const HITS=()=>document.getElementById('rail-hits');
let picked=-1,rows=[];
const norm=x=>String(x||'').replace(/\s+/g,' ').trim().toLowerCase();
function gather(q){
  const t=norm(q); if(t.length<2) return [];
  let out=[]; try{ out=(window.__search?window.__search(t):[]); }catch(e){ out=[]; }
  const score=n=>{const s=norm(n);return s===t?3:s.indexOf(t)===0?2:s.indexOf(t)>=0?1:0;};
  out.forEach(h=>h.s=score(h.name));
  const ORDER=['Service Orders','MSA Letters','Signers'];
  const best={}; out.forEach(h=>{best[h.group]=Math.max(best[h.group]||0,h.s);});
  out.sort((a,b)=>(best[b.group]-best[a.group])||(ORDER.indexOf(a.group)-ORDER.indexOf(b.group))||(b.s-a.s)||String(a.name).localeCompare(String(b.name)));
  return out.slice(0,60);
}
function draw(list){
  const box=HITS(); if(!box) return;
  box.textContent=''; rows=[]; picked=-1;
  if(!list.length){const n=document.createElement('div');n.className='rh-none';n.textContent='Nothing matches.';box.appendChild(n);box.hidden=false;return;}
  let g=null;
  list.slice(0,24).forEach(h=>{
    if(h.group!==g){g=h.group;const hd=document.createElement('div');hd.className='rh-g';hd.textContent=g;box.appendChild(hd);}
    const b=document.createElement('button');b.type='button';b.className='rh';
    const nm=document.createElement('b');nm.textContent=h.name;b.appendChild(nm);
    if(h.where){const w=document.createElement('i');w.textContent=h.where;b.appendChild(w);}
    b.addEventListener('click',()=>{close();h.go();});
    rows.push(b);box.appendChild(b);
  });
  box.hidden=false;
}
function close(){const b=HITS();if(b){b.hidden=true;b.textContent='';}rows=[];picked=-1;}
function mark(){rows.forEach((r,i)=>r.classList.toggle('on',i===picked));
  if(rows[picked])try{rows[picked].scrollIntoView({block:'nearest'});}catch(e){}}
function wireFind(){
  const q=document.getElementById('rail-q'),x=document.getElementById('rail-qx');
  if(!q)return; let tmr=null;
  const run=()=>{const v=q.value;if(x)x.hidden=!v;if(norm(v).length<2){close();return;}draw(gather(v));};
  q.addEventListener('input',()=>{clearTimeout(tmr);tmr=setTimeout(run,150);});
  q.addEventListener('focus',()=>{if(norm(q.value).length>=2)run();});
  q.addEventListener('keydown',e=>{
    if(e.key==='Escape'){close();q.blur();return;}
    if(!rows.length)return;
    if(e.key==='ArrowDown'){e.preventDefault();picked=(picked+1)%rows.length;mark();}
    else if(e.key==='ArrowUp'){e.preventDefault();picked=(picked-1+rows.length)%rows.length;mark();}
    else if(e.key==='Enter'){e.preventDefault();(rows[picked]||rows[0]).click();}
  });
  if(x)x.addEventListener('click',()=>{q.value='';x.hidden=true;close();q.focus();});
  document.addEventListener('click',e=>{if(!e.target.closest('.railfind'))close();});
}
function start(){
  let off=null;
  try{const v=localStorage.getItem(KEY);if(v!==null)off=(v==='1');}catch(e){}
  if(off===null)off=window.matchMedia('(max-width:900px)').matches;
  set(off,false);
  const h=document.getElementById('rail-hide');if(h)h.addEventListener('click',toggle);
  const sc=document.getElementById('rail-scrim');if(sc)sc.addEventListener('click',()=>set(true));
  const qb=document.getElementById('rail-qb');
  if(qb)qb.addEventListener('click',()=>{set(false);setTimeout(()=>{const q=document.getElementById('rail-q');if(q)q.focus();},230);});
  document.querySelectorAll('.hq nav button[data-hq]').forEach(b=>{
    b.addEventListener('click',()=>{if(window.matchMedia('(max-width:900px)').matches)set(true);});});
  wireFind();
}
start();
(function theme(){
  var btn=document.getElementById("theme-btn"); if(!btn)return;
  function cur(){var t=document.documentElement.getAttribute("data-theme");if(t)return t;
    return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}
  function paint(){const dark=cur()==="dark";const lab=document.getElementById("theme-lab");
    if(lab)lab.textContent=dark?"Light Mode":"Dark Mode";
    btn.title="Switch to "+(dark?"light":"dark")+" mode";}
  btn.addEventListener("click",function(){
    document.documentElement.setAttribute("data-theme",cur()==="dark"?"light":"dark");
    paint();try{localStorage.setItem("mismo.portal.theme",cur());}catch(e){}
    window.dispatchEvent(new Event("resize"));});
  try{var saved=localStorage.getItem("mismo.portal.theme");if(saved)document.documentElement.setAttribute("data-theme",saved);}catch(e){}
  paint();
})();
(function season(){ if(new Date().getMonth()===11) document.documentElement.setAttribute("data-season","december"); })();
})();
</script>
