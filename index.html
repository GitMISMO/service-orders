<script>window.RELAY={"base": "https://rgvdi67cg27o5kcmiytcqbqnrm0hmztx.lambda-url.us-east-1.on.aws", "projects": ["so-phoenix", "so-actualize", "so-trex", "so-falcon", "so-trudigital"], "slugs": {"so-phoenix": "phoenixteam", "so-actualize": "actualize", "so-trex": "trex", "so-falcon": "falcon", "so-trudigital": "trudigital"}, "note": "base is the relay's Lambda function URL. projects is every key this page may sign in against, tried in turn; the token is not project-bound, so the first that works covers them all. slugs maps a project key to the filename its data uses. All three are configuration: a sixth company is a change HERE and nowhere else."};</script>
<script>/* MISMO Service Orders — the relay module.
 *
 * Every credential and every relay call in this tool goes through this file and
 * nowhere else.  Nothing else in the page builds a request, holds a token, or
 * decides what somebody may see.
 *
 * REWRITTEN 27 September 2026 against the relay's own source — GitMISMO/
 * initiative-hub, _dev/aws/index.mjs, 1,242 lines, sha256 39df37c9….  The
 * session-12 version was written to a guessed contract and is kept beside this
 * one as relay.js.session12 until the first live call succeeds.
 *
 * Four things changed from that guess, and they are the whole of the rewrite:
 *
 *   was                                    is
 *   ---------------------------------      ------------------------------------
 *   base /relay                            the Lambda function URL
 *   X-Facilitator-Key on every request     POST /{project}/auth/login, then
 *                                          Authorization: Bearer <token>
 *   PUT /{repo}/file/{path}                POST /{project}/commit with
 *                                          { message, parentSha, files: [...] }
 *   parentSha is the blob sha              parentSha is the COMMIT sha, and a
 *                                          read hands back a BLOB sha.  They are
 *                                          different things and cannot be
 *                                          swapped — see head() below.
 *
 * Rules this file exists to keep:
 *   1. The relay decides what comes back.  The page never filters.
 *   2. The session is the shared resources.mismo.org sign-in (session.js), the same
 *      one every tool uses, so signing in here or anywhere else is one sign-in.
 *      Until 28 September 2026 this page kept its own token in sessionStorage and
 *      had its own sign-in form; every tool now uses one sign-in and one refusal
 *      screen, decided that day.  The token lasts four hours, as everywhere.
 *      Every tool on resources.mismo.org shares one origin, so storage is only
 *      ever cleared one named key at a time — never wholesale.
 *   3. Nothing about who somebody is is inferred.  The access map comes from the
 *      relay at sign-in and is re-read from it, never widened here.
 *   4. Every save carries a parentSha wherever one can be had, so a save that
 *      would overwrite somebody else's is refused rather than silently applied.
 */
(function (global) {
  'use strict';

  var CFG = global.RELAY || {};
  var BASE = String(CFG.base || '').replace(/\/+$/, '');

  var NS = 'resources:service-orders:';
  var TOKEN = 'session';

  /* ---- storage, namespaced, never cleared wholesale ---------------------- */
  function sput(name, value) { try { sessionStorage.setItem(NS + name, value); } catch (e) {} }
  function sget(name) { try { return sessionStorage.getItem(NS + name); } catch (e) { return null; } }
  function sdrop(name) { try { sessionStorage.removeItem(NS + name); } catch (e) {} }

  /* ---- the session ------------------------------------------------------- */
  /* What the relay hands back at sign-in: token, name, email, access, expiresAt.
     The token is NOT project-bound — signing in once covers every key the person
     has — so the access map is what says which projects they may ask about.
     It is read from the shared sign-in, which already treats an expired session as
     none, so an expired one shows the sign-in rather than a wall of failed requests. */
  function RS() { return global.ResourcesSession || null; }
  function session() { var rs = RS(); return rs ? rs.current() : null; }
  function signedIn() { return !!session(); }
  function signOut() { var rs = RS(); if (rs) rs.signOut(); HEAD = {}; }

  /* Signing in is the shared window (session.js); this page no longer posts a
     password itself.  POST /{project}/auth/login is global, so any key works. */

  /* ---- requests ---------------------------------------------------------- */
  function enc(s) { return encodeURIComponent(String(s)); }
  function encPath(p) { return String(p).split('/').map(encodeURIComponent).join('/'); }

  function fail(status, body) {
    var code = (body && body.error) || '';
    var e = new Error((body && body.message) || code || ('relay ' + status));
    e.status = status;
    e.code = code;
    e.body = body || null;
    /* Fail closed: these mean "not you, not here, not any more" and the page
       should say so rather than retry or show an empty screen as if it were
       an empty folder. */
    e.closed = status === 401 || status === 403;
    e.missing = status === 404 || code === 'NOT_FOUND';
    e.conflict = status === 409 || code === 'CONFLICT';
    return e;
  }

  /* Record which project key a failure was against.  Set once and never
     overwritten, so the FIRST key that failed is the one reported. */
  function tag(e, project) {
    if (e && project && !e.project) e.project = project;
    return e;
  }

  function readBody(r) {
    return r.json().catch(function () { return {}; })
      .then(function (j) { return { ok: r.ok, status: r.status, body: j }; });
  }

  /* A save made after the four-hour session has run out asks the person to sign in
     through the shared window ("Sign in to finish saving", email filled in) and then
     sends the SAME request, so the change is not lost.  Reads are never prompted for.
     Cancelling gives NOT_SAVED, which the page reports as not saved. */
  function askToFinish() {
    var rs = RS();
    if (!rs) return Promise.reject(fail(401, { error: 'NO_SESSION', message: 'Sign in again.' }));
    return rs.signIn({ reason: 'expired' }).then(null, function () {
      throw fail(401, { error: 'NOT_SAVED', message: 'Not saved. Sign in to save it.' });
    });
  }

  function send(method, path, body, retried) {
    var s = session();
    var write = method !== 'GET';
    if (!s) {
      if (write && !retried) return askToFinish().then(function () { return send(method, path, body, true); });
      return Promise.reject(fail(401, { error: 'NO_SESSION', message: 'Sign in again.' }));
    }
    var opts = { method: method, headers: { 'Authorization': 'Bearer ' + s.token } };
    if (body) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    /* Every path is /{project}/..., so the project is recoverable here.  Naming
       it on the error is what lets the page say WHICH key the relay refused
       instead of a bare code somebody then has to guess at. */
    var proj = decodeURIComponent(String(path).split('/')[1] || '');
    return fetch(BASE + path, opts).then(readBody).then(function (r) {
      if (r.status === 401 && write && !retried) {
        return askToFinish().then(function () { return send(method, path, body, true); });
      }
      if (r.status === 401) throw tag(fail(401, r.body), proj);
      if (!r.ok) throw tag(fail(r.status, r.body), proj);
      return r.body;
    });
  }

  /* ---- reading ----------------------------------------------------------- */
  /* GET /{project}/file/{path} -> { path, size, sha, content }, content base64.
     The sha is the BLOB sha.  It identifies the bytes and is useful for telling
     whether a file changed; it is NOT what /commit wants for parentSha. */
  function read(project, path) {
    return send('GET', '/' + enc(project) + '/file/' + encPath(path), null)
      .then(function (r) {
        return { sha: r.sha, size: r.size, data: JSON.parse(fromB64(r.content)) };
      });
  }

  /* Read a file that may not exist yet, without turning a 404 into an error. */
  function readOr(project, path, fallback) {
    return read(project, path).catch(function (e) {
      if (e.missing) return { sha: null, size: 0, data: fallback, absent: true };
      throw e;
    });
  }

  function fromB64(b64) {
    var bin = atob(String(b64).replace(/\s/g, ''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    /* TextDecoder, not escape/unescape: company names and the order wording carry
       em-dashes and curly quotes, and a byte-wise read mangles every one of them. */
    return new TextDecoder('utf-8').decode(bytes);
  }

  /* ---- the commit sha, and how to get one -------------------------------- */
  /* No route returns the branch head.  But /commit checks parentSha against the
     head BEFORE it creates a single blob, so a commit sent with a knowingly stale
     parentSha is refused with 409 { error:'CONFLICT', head } and writes nothing.
     That is a clean, side-effect-free way to learn the head once per project per
     session, and it is why no write here has to go out unlocked. */
  var HEAD = {};
  var STALE = '0000000000000000000000000000000000000000';

  function head(project) {
    if (HEAD[project]) return Promise.resolve(HEAD[project]);
    return send('POST', '/' + enc(project) + '/commit', {
      message: 'head probe',
      parentSha: STALE,
      files: [{ path: 'notify/.head-probe', content: '{}' }]
    }).then(function () {
      /* Only reachable if the head really is forty zeros, which it never is.
         If it somehow committed, the sha it returns is the new head. */
      return null;
    }).catch(function (e) {
      /* The person was asked to sign in to finish a save and cancelled: stop here, or
         the save itself would ask them a second time. */
      if (e && e.code === 'NOT_SAVED') throw e;
      if (e.conflict && e.body && e.body.head) { HEAD[project] = e.body.head; return e.body.head; }
      /* The probe is refused for a reason of its own — no write access, say.
         Fall back to an unlocked write rather than blocking the person. */
      return null;
    });
  }

  /* ---- writing ----------------------------------------------------------- */
  /* POST /{project}/commit { message, parentSha, files:[{path, content, encoding}] }
     -> { commit, savedBy }.  One to fifty files, one commit, all or nothing:
     a single disallowed path rejects the whole thing before anything is written. */
  function commit(project, files, message) {
    if (!files || !files.length) return Promise.reject(fail(400, { error: 'BAD_CONTENT' }));
    if (files.length > 50) return Promise.reject(fail(400, { error: 'TOO_MANY_FILES' }));
    return head(project).then(function (parent) {
      var body = { message: message || 'Service orders update', files: files };
      if (parent) body.parentSha = parent;
      return send('POST', '/' + enc(project) + '/commit', body);
    }).then(function (r) {
      HEAD[project] = r.commit;          // our own commit is the new head
      return r;
    }).catch(function (e) {
      if (e.conflict) {
        /* Somebody saved first.  Take the head the relay just told us — or forget
           what we thought it was, if it did not — so the caller's retry re-reads
           and applies the same change to the copy that is actually there. */
        if (e.body && e.body.head) { HEAD[project] = e.body.head; } else { delete HEAD[project]; }
      }
      throw e;
    });
  }

  function jsonFile(path, data) {
    return { path: path, content: JSON.stringify(data, null, 1) };
  }

  /* A PDF or any other binary goes through untouched.  Treating it as text would
     mangle every byte that is not valid UTF-8, and it would only show when
     somebody tried to open the file. */
  function binaryFile(path, base64) {
    return { path: path, content: String(base64).replace(/\s/g, ''), encoding: 'base64' };
  }

  /* Read, change, save — and if somebody saved in between, read the copy that is
     actually there, apply the same change to IT, and save again.  The change
     function is handed a fresh copy every time, so a merge is never guessed at. */
  function update(project, path, change, message, fallback, tries) {
    tries = tries == null ? 3 : tries;
    /* A read-then-save starts with a read, and reads never ask for a sign-in. So a save
       begun after the session has run out asks here first, then carries on. */
    if (!session()) {
      return askToFinish().then(function () { return update(project, path, change, message, fallback, tries); });
    }
    return readOr(project, path, fallback).then(function (cur) {
      var next = change(cur.data);
      return commit(project, [jsonFile(path, next)], message);
    }).catch(function (e) {
      if (e.conflict && tries > 1) return update(project, path, change, message, fallback, tries - 1);
      throw e;
    });
  }

  /* ---- who the signed-in person is --------------------------------------
     The old relay had a /whoami.  This one does not, so the answer is worked
     out from the access map the sign-in returns — which comes FROM the relay
     and is never widened here.

       one key, staff   a contracting company
       every key, admin Jonna
       every key, staff the VP or the President — told apart by reading the
                        names off a company's own orders file, which is in a
                        private repository and needs the sign-in to read.

     Nothing about a person is inferred from their email address by this page. */
  /* ⚠ ONLY the keys this page is configured for.
     An account is one account across every tool on resources.mismo.org, so the
     access map a sign-in returns also carries summit-hq, glossary and anything
     else that person has.  Treating one of those as a service-orders project
     asks the wrong repository for an orders file and the relay rightly answers
     UNKNOWN_PROJECT.  The page's own project list is the filter. */
  function keysOf(sess) {
    var acc = (sess && sess.access) || {};
    var mine = CFG.projects || [];
    if (!mine.length) return Object.keys(acc);
    return mine.filter(function (k) { return Object.prototype.hasOwnProperty.call(acc, k); });
  }
  /* Everything else the account can reach — never used to decide anything, only
     to explain a "you have no service orders" screen without guessing. */
  function otherKeys(sess) {
    var acc = (sess && sess.access) || {};
    var mine = CFG.projects || [];
    return Object.keys(acc).filter(function (k) { return mine.indexOf(k) < 0; });
  }
  function whoami() {
    var sess = session();
    if (!sess) {
      var e = new Error('Not signed in');
      e.needsLogin = true;
      return Promise.reject(e);
    }
    var keys = keysOf(sess);
    var slugs = CFG.slugs || {};
    var me = { name: sess.name || sess.email, email: sess.email, access: sess.access || {},
               keys: keys, otherKeys: otherKeys(sess) };

    /* Every slug the person may reach, in the order the keys are configured, so
       a view that spans companies always gets them in the same order. */
    me.slugs = keys.map(function (k) { return slugs[k] || k.replace(/^so-/, ''); });
    me.slug = me.slugs[0];
    me.project = keys[0];
    me.title = '';

    if (!keys.length) { me.kind = 'none'; return Promise.resolve(me); }

    if (keys.length === 1) {
      me.kind = 'contractor';
      return Promise.resolve(me);
    }

    /* Several keys: read one company's file to pick up the MISMO names and
       titles.  The titles print on approvals, so they come from the data rather
       than being typed into this page.  One extra read, once, at sign-in. */
    return read(me.project, 'orders/' + me.slug + '.json').then(function (r) {
      var F = r.data || {};
      var vp = F.vpProduct || {}, pres = F.mismoSigner || {};
      var mine = String(sess.email || '').toLowerCase();
      if (mine && mine === String(vp.email || '').toLowerCase()) {
        me.kind = 'vp-product';
        me.name = me.name || vp.name; me.title = vp.title || '';
      } else if (mine && mine === String(pres.email || '').toLowerCase()) {
        me.kind = 'president';
        me.name = me.name || pres.name; me.title = pres.title || '';
      } else {
        me.kind = 'admin';
        me.title = 'Director of Programs & Operations';
      }
      return me;
    }).catch(function () {
      /* The name-matching read failed. The access map is still trustworthy, so
         fall back on it rather than refusing to show anything. */
      me.kind = keys.some(function (k) { return (sess.access || {})[k] === 'admin'; })
        ? 'admin' : 'president';
      return me;
    });
  }

  /* Kept so the page has one call to make at start-up.  It also drops the token this
     page used to keep in its own tab storage before it used the shared sign-in, so no
     second, stale session lingers. */
  function boot() { sdrop(TOKEN); return session(); }

  global.MISMO_RELAY = {
    base: BASE,
    boot: boot, whoami: whoami,
    signOut: signOut, signedIn: signedIn, session: session,
    read: read, readOr: readOr,
    commit: commit, update: update,
    jsonFile: jsonFile, binaryFile: binaryFile,
    limits: { filesPerCommit: 50, bodyBytes: 1000000 },
    store: { put: sput, get: sget, drop: sdrop, prefix: NS }
  };
})(window);
</script>
<script>/* MISMO Service Orders and Agreements — the platform page.
 *
 * This file holds NO data.  Everything on screen arrives from the relay, which
 * decides what this person may see before it sends anything.  There is no
 * filtering here: a contracting company is not shown its own orders because the
 * page hid the others, it is shown them because the relay refused the rest.
 *
 * Every credential and every request goes through relay.js.
 */
(function () {
  'use strict';
  var R = window.MISMO_RELAY;
  var $ = function (s) { return document.querySelector(s); };

  /* ---------- small helpers ---------------------------------------------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
    });
  }
  function money(v) {
    return v == null ? '—' : '$' + Number(v).toLocaleString('en-US',
      { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function money0(v) {
    return '$' + Number(v || 0).toLocaleString('en-US', { maximumFractionDigits: 0 });
  }
  /* ---------- fee totals (decision 31) -------------------------------------
     An order with no maximum fee is NEVER summed as zero.  Falcon's
     certification orders are paid per review and carry no maximum, so a total
     that just added them up would read $0 and look broken.  The count of them
     travels with the figure and is always said out loud. */
  function feeTotal(orders) {
    var sum = 0, counted = 0, noMax = 0;
    (orders || []).forEach(function (o) {
      if (o.maximumFee == null) { noMax++; return; }
      sum += Number(o.maximumFee) || 0; counted++;
    });
    return { sum: sum, counted: counted, noMax: noMax, all: (orders || []).length };
  }
  function feeWords(t) {

  /* ---------- the status model ------------------------------------------
     Draft → Released to Send → Sent → Acknowledged → Approved → Executed.
     "Released to Send" is what the status is CALLED on screen. The Signature
     record's step stays "VP Product Decision", which is blueprint 4.8's own
     wording and is not ours to change.
     Nothing here is stored that can be worked out: the status is read off the
     signatures plus the one thing the signatures cannot know, the date Jonna
     sent it.  Approved and Executed are the same instant for a service order —
     once the President approves, both signatures are in and it is executed.  */
  var ORDER_OF = { draft: 0, vp: 1, sent: 2, acknowledged: 3, executed: 4 };
  function statusOf(o, sigs) {
    var mine = (sigs || []).filter(function (s) { return s.orderId === o.id; });
    function last(step, decision) {
      var hit = null;
      mine.forEach(function (s) {
        if (s.step === step && (!decision || s.decision === decision)) hit = s;
      });
      return hit;
    }
    var pres = last('MISMO Signer', 'Approved');
    var ack = last('Consultant', 'Accepted');
    var held = last('Consultant', 'Question');
    var vp = last('VP Product Decision');

    if (pres) return { key: 'executed', label: 'Executed', tone: 'good', sig: pres, ack: ack };
    if (ack) {
      /* Decision 33.  Only the BINDING terms bring an order back: rate, hours,
         maximum fee, fee type, dates, Services, Deliverables, the MSA it is
         written under, the parties, what MISMO provides, agreed modifications
         and the standing text.  contentHash is the hash of exactly those. */
      if (ack.contentHash !== o.contentHash) {
        return { key: 'changed', label: 'Changed Since Acknowledged', tone: 'warn', sig: ack };
      }
      /* Something outside the binding terms moved — a retitle, a category, a
         template name.  It is shown on the order and nobody is asked again. */
      var amended = !!(ack.recordHash && o.recordHash && ack.recordHash !== o.recordHash);
      return { key: 'acknowledged', label: 'Acknowledged', tone: 'good', sig: ack, amended: amended };
    }
    if (held && (!vp || true)) {
      if (o.sentOn) return { key: 'question', label: 'Question Raised', tone: 'warn', sig: held };
    }
    if (o.sentOn) return { key: 'sent', label: 'Sent', tone: '' };
    if (vp && vp.decision === 'Approved to Send') {
      return { key: 'vp', label: 'Released to Send', tone: '', sig: vp };
    }
    if (vp && vp.decision === 'Held') return { key: 'vphold', label: 'Held by the VP', tone: 'warn', sig: vp };
    return { key: 'draft', label: 'Draft', tone: '' };

  var SLUG_TO_KEY = (function () {

     the same records to the fresh copy, and saves again.                    */
  function addSignatures(slug, records, note) {
    return R.update(keyFor(slug), 'signatures/' + slug + '.json', function (cur) {

     hold, or an order that changed after it was accepted.  The signatures file
     changes on every one of the 57 acceptances, so watching that would be
     noise; watching this is not.

     This is not storing something that can be worked out.  WHAT happened is
     derivable from the signatures; whether it has been SENT is not, and that
     is what `sent` is for.  See NOTIFY.md for what Perry wires to it. */
  function notify(slug, notice) {

  function snapshotOf(o) {

    Object.keys(o).forEach(function (k) {

          '<div class="rows">' + toReview.map(function (o) { return reviewRow(F, o, st[o.id]); }).join('') + '</div>';
      }

      /* ---- My Service Orders -------------------------------------------- */
      /* Decision 31 — the fiscal-year picker.  FY 2027 is the first year the
         system holds, so today there is nothing to choose between and the page
         says so plainly instead of showing a dropdown with one entry in it.
         The moment a second year is generated this becomes a chooser and the
         total follows it. */
      var years = {};
      F.orders.forEach(function (o) { years[o.fiscalYear || F.fiscalYear] = 1; });
      var yearList = Object.keys(years).sort();
      /* Default to the year the file is FOR, not the last one in the list.
         FY 2028 orders can exist long before FY 2028 starts, and a company
         opening the page should land on the year it is working in. */
      var pickedYear = ISS_YEAR
        || (years[F.fiscalYear] ? F.fiscalYear : null)
        || yearList[0] || F.fiscalYear;
      var yearOrders = yearList.length > 1
        ? F.orders.filter(function (o) { return (o.fiscalYear || F.fiscalYear) === pickedYear; })
        : F.orders;
      var yearTotal = feeTotal(yearOrders);
      var all = '<p class="lede">Every service order MISMO has raised for you this fiscal year, ' +
        'with its status, rate, hours and maximum fee. Open one to read it in full.</p>' +
        '<div class="tot"><span class="tot-l">' +
          (yearList.length > 1
            ? 'Fiscal Year</span><span class="tot-v"><select id="fy-pick" aria-label="Which fiscal year">' +
              yearList.map(function (y) {
                return '<option' + (y === pickedYear ? ' selected' : '') + '>' + esc(y) + '</option>';
              }).join('') + '</select> ' + feeWords(yearTotal)
            : 'This Fiscal Year, ' + esc(pickedYear || '') + '</span><span class="tot-v">' + feeWords(yearTotal)) +
        '</span></div>' +
        '<p class="fineprint">Every order raised for you' +
        (yearList.length > 1 ? ' in ' + esc(pickedYear) : ' this fiscal year') +
        ', whatever its status. An order added later in the year lands in this figure too. ' +
        'MISMO\u2019s fiscal year runs 1 October to 30 September.</p>' +
        '<div class="rows">' + yearOrders.map(function (o) {
          return '<div class="row"><div class="row-h">' +
            '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>' +
            '<span class="rt">' + esc(o.subject) + '</span>' + pill(st[o.id]) +
            '<span class="rs num">' + (o.maximumFee != null ? money(o.maximumFee) : 'Per review') + '</span>' +
            '</div><div class="row-b">' +
            '<div class="fields">' +
            fld('Status', st[o.id].label) +
            fld('Hourly Rate', o.hourlyRate ? money(o.hourlyRate) : 'Paid per review', 1) +
            fld('Estimated Hours', o.estimatedHours || '—', 1) +
            fld('Maximum Fee', o.maximumFee != null ? money(o.maximumFee) : 'No maximum — paid per review', 1) +
            fld('Runs', o.startDate + ' to ' + o.endDate) +
            fld('Master Services Agreement', o.msaFlavour) +
            '</div>' + signedBlock(st[o.id]) +
            '<div class="dochost" id="d-' + esc(o.id) + '">' + P.orderDoc(F, o) + '</div>' +
            (st[o.id].key === 'executed' ? P.printBtn('d-' + o.id, o.subject) : '') +
            '</div></div>';
        }).join('') + '</div>';

      /* ---- My Agreements ------------------------------------------------- */
      var agreements = R.read(keyFor(ME.slug), 'agreements/' + ME.slug + '.json')
        .then(function (a) { return a.data.agreements || []; })
        .catch(function () { return []; });

      agreements.then(function (exec) {
        var byFlavour = {};
        exec.forEach(function (e) { byFlavour[e.msaFlavour] = e; });
        var ag = '<p class="lede">Your Master Services Agreement extensions. MISMO sends each one ' +
          'through DocuSign; once it is executed the signed copy appears here and stays.</p>' +
          '<div class="rows">' + F.letters.map(function (l) {
            var e = byFlavour[l.msaFlavour];
            return '<div class="row"><div class="row-h">' +
              '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>' +
              '<span class="rt">' + esc(l.msaFlavour) + ' Master Services Agreement</span>' +
              (e ? '<span class="pill good">Executed</span>' : '<span class="pill">Awaiting Signature</span>') +
              '<span class="rs">Extends to ' + esc(l.extendTo) + '</span>' +
              '</div><div class="row-b"><div class="fields">' +
              fld('Agreement Signed', l.msaEffectiveDate) +
              fld('Expires Without This Letter', l.extendFrom) +
              fld('This Letter Extends It To', l.extendTo) +
              fld('Signed for ' + l.company + ' by', l.signer.name + ' — ' + l.signer.title) +
              fld('Signed for MISMO by', F.mismoSigner.name + ' — ' + F.mismoSigner.title) +
              (e ? fld('Executed On', e.executedOn) + fld('DocuSign Envelope', e.envelopeId) : '') +
              '</div>' +
              (e ? '<p class="fineprint">The executed copy, with its Certificate of Completion, is ' +
                'the record. <a class="dl" href="' + esc(e.href || '#') + '">Download the signed PDF</a></p>' : '') +
              '<div class="dochost" id="l-' + esc(l.id) + '">' + P.letterDoc(F, l) + '</div>' +
              P.printBtn('l-' + l.id, l.company + ' — ' + l.msaFlavour + ' MSA Extension') +
              '</div></div>';
          }).join('') + '</div>';

        whoEl.innerHTML = esc(ME.name) + ' <i>·</i> ' + esc(F.company);
        say(
          sect('To Review', toReview.length, review) +
          sect('My Service Orders', yearOrders.length, all) +
          sect('My Agreements', F.letters.length, ag) +
          sect('Help', null, helpFor('contractor', F))
        );
        wireReview(C, st, toReview);
        var fyEl = document.getElementById('fy-pick');
        if (fyEl) fyEl.addEventListener('change', function () {
          ISS_YEAR = fyEl.value; contractorView();
        });
      });
    }).catch(closed);
  }

  /* what the nudge outbox is holding, and whether anything has gone out */
  function outboxLine(outbox) {
    var waiting = (outbox || []).filter(function (n) { return !n.sent; });
    var gone = (outbox || []).length - waiting.length;
    if (!outbox || !outbox.length) {
      return '<div class="note ok"><b>The nudge outbox is empty.</b> ' +
        '<code>notify/&lt;company&gt;.json</code> changes only when an order stops, so whatever is ' +
        'watching it has had nothing to send. See <b>NOTIFY.md</b> in the build package.</div>';
    }
    return '<div class="note' + (waiting.length ? '' : ' ok') + '"><b>' +
      (waiting.length
        ? waiting.length + ' ' + (waiting.length === 1 ? 'nudge is' : 'nudges are') + ' waiting to go out.'
        : 'Every nudge has gone out.') +
      '</b> ' + (gone ? gone + ' already sent. ' : '') +
      'They are queued in <code>notify/&lt;company&gt;.json</code> — one line per stopped order. ' +
      '<b>Until that file is wired to send mail, this list is the only place they appear.</b> ' +
      'See <b>NOTIFY.md</b>.</div>';
  }

  function fld(label, v, mono) {
    return '<div class="f"><label>' + esc(label) + '</label><div class="v' +
      (mono ? ' num' : '') + '">' + esc(v == null || v === '' ? '—' : v) + '</div></div>';
  }
  function signedBlock(st) {
    if (!st.sig) return '';
    var s = st.sig;
    var h = '<div class="signed"><b>' + esc(s.decision) + '</b> by ' + esc(s.signerName || '—') +
      (s.signerTitle ? ', ' + esc(s.signerTitle) : '') + ' on ' + esc(stamp(s.signedOn)) +
      '<span class="what">What was accepted: ' + esc(s.contentAccepted || '') + '</span></div>';
    if (st.key === 'changed') {
      h += '<div class="note warn"><b>A binding term has changed since this was accepted.</b> ' +
        'Something that decides the deal moved — the rate, the hours, the maximum fee, the dates, ' +
        'the Services, the Deliverables, the agreement it is written under or what MISMO provides. ' +
        'The acceptance on record is for the earlier terms, so it is not treated as accepted. ' +
        'MISMO has to send it again, or raise a Modification.</div>';
    } else if (st.amended) {
      /* Decision 33 (c).  Shown, never silent — and never a reason to re-ask. */
      h += '<div class="note"><b>Amended after acceptance.</b> Something outside the binding terms ' +
        'was changed — a title, a description or a template name. <b>Nothing that decides the deal ' +
        'moved</b>, so this is still accepted and nobody has been asked again. The order as it was ' +
        'accepted is kept with the signature.</div>';
    }
    return h;
  }
  function reviewRow(F, o, st) {

  function wireReview(C, st, toReview) {
    var all = document.getElementById('qall');
    var go = document.getElementById('qgo');
    var nameEl = document.getElementById('ackname');
    var titleEl = document.getElementById('acktitle');
    var qc = document.getElementById('qc');
    if (!go) return;

    function ticked() {
      return Array.prototype.slice.call(document.querySelectorAll('.qtick:checked'))
        .map(function (b) { return b.dataset.id; });
    }
    /* What the ticked subset comes to, live.  A company accepts in batches, so
       the figure that matters while they are ticking is what THEY are about to
       commit to — not the total of everything waiting. */
    var byId = {};
    (toReview || []).forEach(function (o) { byId[o.id] = o; });

    function paint() {
      var ids = ticked(), n = ids.length, named = (nameEl.value || '').trim().length >= 2;
      go.disabled = !(n && named);
      if (!n) { qc.innerHTML = 'Nothing ticked yet'; return; }
      var t = feeTotal(ids.map(function (id) { return byId[id]; }).filter(Boolean));
      qc.innerHTML = n + ' ticked — ' + feeWords(t) +
        (named ? ', ready to accept' : '. Type your name to accept them');
    }
    document.querySelectorAll('.qtick').forEach(function (b) { b.addEventListener('change', paint); });
    if (all) all.addEventListener('change', function () {
      document.querySelectorAll('.qtick').forEach(function (b) { b.checked = all.checked; });
      paint();
    });
    nameEl.addEventListener('input', paint);
    paint();

    go.addEventListener('click', function () {
      var ids = ticked();
      var who = { signerName: nameEl.value.trim(), signerTitle: titleEl.value.trim(), signerEmail: ME.email };
      var recs = ids.map(function (id) {
        var o = C.F.orders.filter(function (x) { return x.id === id; })[0];
        return signature('Consultant', 'Accepted', o, who);
      });
      go.disabled = true; go.textContent = 'Accepting…';
      addSignatures(ME.slug, recs, 'accepted ' + recs.length + ' orders')
        .then(function () {
          toast(recs.length + (recs.length === 1 ? ' order accepted' : ' orders accepted'), 'good');
          contractorView();
        })
        .catch(function (e) { go.disabled = false; go.textContent = 'Accept the Ticked Orders'; failed(e); });
    });

    document.querySelectorAll('.one-go').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.dataset.id;
        var nm = document.querySelector('.one-name[data-id="' + id + '"]');
        if (!nm || nm.value.trim().length < 2) { nm && nm.focus(); toast('Type your name first'); return; }
        var o = C.F.orders.filter(function (x) { return x.id === id; })[0];
        b.disabled = true;
        addSignatures(ME.slug, [signature('Consultant', 'Accepted', o,
          { signerName: nm.value.trim(), signerTitle: (titleEl && titleEl.value.trim()) || ME.title, signerEmail: ME.email })],
          'accepted ' + o.subject)
          .then(function () { toast('Accepted', 'good'); contractorView(); })
          .catch(function (e) { b.disabled = false; failed(e); });
      });
    });
    document.querySelectorAll('.one-ask').forEach(function (b) {
      b.addEventListener('click', function () {
        var box = document.querySelector('.askbox[data-ask="' + b.dataset.id + '"]');
        if (box) { box.hidden = !box.hidden; var i = box.querySelector('input'); if (i) i.focus(); }
      });
    });
    document.querySelectorAll('.one-send').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.dataset.id;
        var q = document.querySelector('.one-q[data-id="' + id + '"]');
        var o = C.F.orders.filter(function (x) { return x.id === id; })[0];
        if (!q || q.value.trim().length < 2) { if (q) q.focus(); toast('Type the question first'); return; }
        b.disabled = true;
        var asked = q.value.trim();
        addSignatures(ME.slug, [signature('Consultant', 'Question', o,
          { signerName: ME.name, signerEmail: ME.email, question: asked })],
          'question raised on ' + o.subject)
          .then(function () {
            return notify(ME.slug, notice('Question Raised', o, C.F.company, ME.name, asked));
          })
          .then(function () { toast('Sent back to MISMO with your question'); contractorView(); })
          .catch(function (e) { b.disabled = false; failed(e); });
      });
    });
  }

              'Approve These ' + C.waiting.length + ' Orders for ' + esc(C.F.company) + '</button></div>' +

      whoEl.innerHTML = esc(ME.name) + ' <i>·</i> ' + esc(ME.title);
      say(sect('Awaiting Your Approval', total, body, true) +

            return C.F.orders.filter(function (o) { return statusOf(o, C.sigs).key === 'executed'; })
              .map(function (o) {
                var s = statusOf(o, C.sigs);
                return '<tr><td>' + esc(C.F.company) + '</td><td>' + esc(o.subject) + '</td><td>' +

                  '" data-id="' + esc(o.id) + '">Hold This One</button></div></div></div>';
              }).join('') + '</div></div></div>';
          }).join('') + '</div>';

      whoEl.innerHTML = esc(ME.name) + ' <i>·</i> ' + esc(ME.title);
      say(sect('Awaiting Your Decision', total, body, true) +
        sect('Already Decided', list.reduce(function (a, C) {
          return a + C.F.orders.filter(function (o) {
            return ['vp', 'sent', 'acknowledged', 'executed', 'changed', 'question'].indexOf(statusOf(o, C.sigs).key) >= 0;
          }).length;
        }, 0), '<div class="tbl"><table><thead><tr><th>Company</th><th>Service Order</th>' +

        list.map(function (C) {

        sect('Help', null, helpFor('vp-product', list[0] && list[0].F)));

      function decide(C, orders, decision, note) {
        return addSignatures(C.slug, orders.map(function (o) {
          return signature('VP Product Decision', decision, o, {
            signerName: ME.name, signerTitle: ME.title, signerEmail: ME.email,
            via: 'single sign-on', note: note || ''
          });
        }), decision + ' — ' + orders.length + ' orders for ' + C.F.company);

      document.querySelectorAll('.vpbatch').forEach(function (b) {

          decide(C, C.waiting, 'Approved to Send')
            .then(function () { toast('Released for MISMO to send', 'good'); vpView(); })
            .catch(function (e) { b.disabled = false; failed(e); });
        });
      });
      document.querySelectorAll('.vphold').forEach(function (b) {
        b.addEventListener('click', function () {
          var C = waiting.filter(function (x) { return x.slug === b.dataset.slug; })[0];
          var o = C.waiting.filter(function (x) { return x.id === b.dataset.id; })[0];
          var why = document.querySelector('.holdwhy[data-id="' + b.dataset.id + '"]');

      if (va) va.addEventListener('click', function () {

        }, Promise.resolve()).then(function () { toast(total + ' released to send', 'good'); vpView(); })
          .catch(function (e) { va.disabled = false; failed(e); });
      });
    }).catch(closed);
  }

  /* =========================================================================
   * Failure, and the closed door
   * ======================================================================= */
  function failed(e) {
    if (e && e.closed) { closed(e); return; }
    if (e && e.status === 409) { toast('Somebody else saved at the same moment — try again', 'warn'); return; }
    toast('That did not save. Nothing has changed.', 'warn');
  }
  function closed(e) {
    if (e && e.status === 409) { toast('Somebody else saved first — reloading'); return; }
    if (e && e.needsLogin) { signInView(); return; }
    /* A save that needed a sign-in the person then cancelled. Nothing was sent. */
    if (e && e.code === 'NOT_SAVED') { toast('That did not save. Sign in to save it.', 'warn'); return; }
    /* A session that has run out, or been withdrawn: sign in again, through the
       shared window. */
    if (e && e.status === 401) { R.signOut(); signInView(); return; }
    /* 403 is NOT a session problem, and before 28 September 2026 this page signed the
       person out for any 403. With one sign-in across every tool, that would have signed
       them out of everything for a refusal about one file. Only NO_ACCESS is a refusal
       of the person; the rest are about the request. */
    if (e && e.status === 403 && e.code === 'NO_ACCESS') { refuse(); return; }
    if (e && e.code === 'VIEW_ONLY') { toast('Your account can view this but not change it.', 'warn'); return; }
    /* Anything else is this page going wrong, not the person. Say so plainly and
       keep them signed in \u2014 signing them out here would hide the fault and
       waste their time on a password they never got wrong. */
    if (window.console && console.error) console.error('service orders:', e);
    var code = (e && e.code) || '';
    /* Two failures are worth naming, because the fix is somebody else's and
       saying which one saves a round of guessing. */
    if (code === 'UNKNOWN_PROJECT') {
      shut('The Relay Does Not Know About These Yet',
        'You are signed in and your account is fine. The relay answered <b>UNKNOWN_PROJECT</b>, ' +
        'which means the service order projects are not reachable to it yet.' +
        (e.project ? '<br><br>The key it refused was <b>' + esc(e.project) + '</b>.' : '') +
        '<br><br>Two things have to be true, and one of them is not: the five entries are in ' +
        '<b>projects.json</b>, and the six repositories are on the <b>relay token</b>. ' +
        'The second one is Perry\u2019s.' +
        '<br><br>Nothing is wrong with your setup, and nothing has been changed or sent.');
      return;
    }
    if (e && e.missing) {
      shut('A File Is Missing',
        'You are signed in and your account is fine, but a file this page needs is not in the ' +
        'repository yet.' +
        (e.message ? '<br><br><span class="fineprint">' + esc(e.message) + '</span>' : '') +
        '<br><br>This usually means the upload in step 4 has not been done for one company. ' +
        'Nothing has been changed and nothing has been sent.');
      return;
    }
    shut('Something Went Wrong at Our End',
      'You are signed in and your account is fine \u2014 this page failed to build your view. ' +
      'Nothing has been changed and nothing has been sent.' +
      (e && e.message ? '<br><br><span class="fineprint">' + esc(e.message) +
        (e.project ? ' \u2014 ' + esc(e.project) : '') + '</span>' : '') +
      '<br><br><b>Email Jonna Critchley at jcritchley@mismo.org</b> and quote that line.');
  }

  /* =========================================================================
   * Boot — read the key out of the fragment, ask the relay who this is,
   * and show that person their own view.  No role is remembered.
   * ======================================================================= */
  /* ---- signing in --------------------------------------------------------
     Email and password, which the relay checks.  Nothing about who somebody is
     is decided here: the relay hands back an access map and the page draws what
     that map allows.  Passwords are never stored, never logged and never put
     anywhere but the one request that checks them. */
  function signInView() {
    /* Signed out there is nothing to navigate to, so the rail and its search box go
       away, and the masthead stays to say whose tool this is. Signing in itself is the
       shared window every resources.mismo.org tool uses (session.js). This page had its
       own form until 28 September 2026. Cancelling goes back to the home page. */
    document.body.classList.add('signedout');
    whoEl.textContent = '';
    say('');
    var rs = window.ResourcesSession;
    if (!rs) {
      shut('The Sign-In Could Not Load',
        'Reload the page. If it keeps happening, the page is not being opened from resources.mismo.org.');
      return;
    }
    rs.signIn({ gated: true }).then(function () {
      document.body.classList.remove('signedout');
      start();
    }, function () {});
  }

  /* Signed in, recognised, but this account carries no service-orders key.  The
     commonest cause by far is an account that already existed for another tool
     on resources.mismo.org and has simply not been given one here yet \u2014 so
     say that, and name what it does carry, rather than leaving somebody
     wondering whether they typed their password wrong. */
  function noKeys(me) {
    /* The browser's copy of this account's access is taken at sign-in, so a company key
       granted since then is missing from it. Ask the relay about every key once before
       refusing; if any comes back, carry on as that person. */
    var rs = window.ResourcesSession;
    var keys = (window.RELAY || {}).projects || [];
    if (refreshed || !rs) { refuse(); return; }
    refreshed = true;
    busy('Checking your access…');
    rs.refreshAccess(keys).then(function (sess) {
      var acc = (sess && sess.access) || {};
      if (keys.some(function (k) { return acc[k]; })) start(); else refuse();
    }, function (e) {
      shut('The Sign-In Service Did Not Answer',
        'This is not your password or your account. Check your connection and reload the page.' +
        (e && e.message ? '<br><br><span class="fineprint">' + esc(e.message) + '</span>' : ''));
    });
  }
  var refreshed = false;
  /* The standard refusal every tool uses. "Sign in as someone else" in it leads back
     here, and that person gets their own check. */
  function refuse() {
    var rs = window.ResourcesSession;
    if (!rs) return;
    /* Behind the refusal, the same bare page as signed out: no rail to navigate, and no
       "Checking your access…" left on screen. start() puts the rail back. */
    document.body.classList.add('signedout');
    whoEl.textContent = '';
    say('');
    rs.signIn({ reason: 'no-access', toolName: 'Service Orders and Agreements', gated: true })
      .then(function () { refreshed = false; start(); }, function () {});
  }

  function start() {
    R.boot();
    if (!R.signedIn()) { signInView(); return; }
    document.body.classList.remove('signedout');
    busy('Reading your documents…');
    R.whoami().then(function (me) {
      ME = me;
      if (me.kind === 'contractor') return contractorView();
      if (me.kind === 'president') return presidentView();
      if (me.kind === 'vp-product') return vpView();
      if (me.kind === 'admin') return adminView();
      noKeys(me);
    }).catch(closed);
  }

  /* print / save as PDF — the platform has no build step, so the browser's own
     print dialog over a print stylesheet is what makes the PDF */
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-print]');
    if (!b) return;
    e.preventDefault(); e.stopPropagation();
    var src = document.getElementById(b.dataset.print);
    if (!src) return;
    var host = document.getElementById('printhost');
    host.innerHTML = src.innerHTML;
    var t = document.title;
    document.title = b.dataset.title || t;
    document.body.classList.add('printing');
    var done = function () {
      document.body.classList.remove('printing');
      host.innerHTML = ''; document.title = t;
      window.removeEventListener('afterprint', done);
    };
    window.addEventListener('afterprint', done);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { try { window.print(); } catch (err) { done(); } });
    });
  }, true);

  window.MISMO_PORTAL = { start: start, refresh: function () { start(); } };
  if (!window.MISMO_PORTAL_MANUAL) start();
})();
</script>
<script>(function(){"use strict";
const KEY='hq.rail.off';
function set(off,remember){
  document.body.classList.toggle('railmini',!!off);
  const h=document.getElementById('rail-hide');
  if(h){h.setAttribute('aria-expanded',off?'false':'true');
    h.setAttribute('aria-label',off?'Open the menu':'Narrow the menu');
    h.title=(off?'Open the menu':'Narrow the menu')+' (backslash)';}
  if(off) close();
  if(remember!==false){try{localStorage.setItem(KEY,off?'1':'0');}catch(e){}}
  setTimeout(()=>{window.dispatchEvent(new Event('resize'));},230);
}
function toggle(){set(!document.body.classList.contains('railmini'));}
document.addEventListener('keydown',e=>{
  const t=e.target,typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
  if(e.key==='\\'&&!typing&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();toggle();}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();set(false);
    setTimeout(()=>{const q=document.getElementById('rail-q');if(q){q.focus();q.select();}},230);}
});
const HITS=()=>document.getElementById('rail-hits');
let picked=-1,rows=[];
const norm=x=>String(x||'').replace(/\s+/g,' ').trim().toLowerCase();
function gather(q){
  const t=norm(q); if(t.length<2) return [];
  let out=[]; try{ out=(window.__search?window.__search(t):[]); }catch(e){ out=[]; }
  const score=n=>{const s=norm(n);return s===t?3:s.indexOf(t)===0?2:s.indexOf(t)>=0?1:0;};
  out.forEach(h=>h.s=score(h.name));
  const ORDER=['Service Orders','MSA Letters','Signers'];
  const best={}; out.forEach(h=>{best[h.group]=Math.max(best[h.group]||0,h.s);});
  out.sort((a,b)=>(best[b.group]-best[a.group])||(ORDER.indexOf(a.group)-ORDER.indexOf(b.group))||(b.s-a.s)||String(a.name).localeCompare(String(b.name)));
  return out.slice(0,60);
}
function draw(list){
  const box=HITS(); if(!box) return;
  box.textContent=''; rows=[]; picked=-1;
  if(!list.length){const n=document.createElement('div');n.className='rh-none';n.textContent='Nothing matches.';box.appendChild(n);box.hidden=false;return;}
  let g=null;
  list.slice(0,24).forEach(h=>{
    if(h.group!==g){g=h.group;const hd=document.createElement('div');hd.className='rh-g';hd.textContent=g;box.appendChild(hd);}
    const b=document.createElement('button');b.type='button';b.className='rh';
    const nm=document.createElement('b');nm.textContent=h.name;b.appendChild(nm);
    if(h.where){const w=document.createElement('i');w.textContent=h.where;b.appendChild(w);}
    b.addEventListener('click',()=>{close();h.go();});
    rows.push(b);box.appendChild(b);
  });
  box.hidden=false;
}
function close(){const b=HITS();if(b){b.hidden=true;b.textContent='';}rows=[];picked=-1;}
function mark(){rows.forEach((r,i)=>r.classList.toggle('on',i===picked));
  if(rows[picked])try{rows[picked].scrollIntoView({block:'nearest'});}catch(e){}}
function wireFind(){
  const q=document.getElementById('rail-q'),x=document.getElementById('rail-qx');
  if(!q)return; let tmr=null;
  const run=()=>{const v=q.value;if(x)x.hidden=!v;if(norm(v).length<2){close();return;}draw(gather(v));};
  q.addEventListener('input',()=>{clearTimeout(tmr);tmr=setTimeout(run,150);});
  q.addEventListener('focus',()=>{if(norm(q.value).length>=2)run();});
  q.addEventListener('keydown',e=>{
    if(e.key==='Escape'){close();q.blur();return;}
    if(!rows.length)return;
    if(e.key==='ArrowDown'){e.preventDefault();picked=(picked+1)%rows.length;mark();}
    else if(e.key==='ArrowUp'){e.preventDefault();picked=(picked-1+rows.length)%rows.length;mark();}
    else if(e.key==='Enter'){e.preventDefault();(rows[picked]||rows[0]).click();}
  });
  if(x)x.addEventListener('click',()=>{q.value='';x.hidden=true;close();q.focus();});
  document.addEventListener('click',e=>{if(!e.target.closest('.railfind'))close();});
}
function start(){
  let off=null;
  try{const v=localStorage.getItem(KEY);if(v!==null)off=(v==='1');}catch(e){}
  if(off===null)off=window.matchMedia('(max-width:900px)').matches;
  set(off,false);
  const h=document.getElementById('rail-hide');if(h)h.addEventListener('click',toggle);
  const sc=document.getElementById('rail-scrim');if(sc)sc.addEventListener('click',()=>set(true));
  const qb=document.getElementById('rail-qb');
  if(qb)qb.addEventListener('click',()=>{set(false);setTimeout(()=>{const q=document.getElementById('rail-q');if(q)q.focus();},230);});
  document.querySelectorAll('.hq nav button[data-hq]').forEach(b=>{
    b.addEventListener('click',()=>{if(window.matchMedia('(max-width:900px)').matches)set(true);});});
  wireFind();
}
start();
(function theme(){
  var btn=document.getElementById("theme-btn"); if(!btn)return;
  function cur(){var t=document.documentElement.getAttribute("data-theme");if(t)return t;
    return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}
  function paint(){const dark=cur()==="dark";const lab=document.getElementById("theme-lab");
    if(lab)lab.textContent=dark?"Light Mode":"Dark Mode";
    btn.title="Switch to "+(dark?"light":"dark")+" mode";}
  btn.addEventListener("click",function(){
    document.documentElement.setAttribute("data-theme",cur()==="dark"?"light":"dark");
    paint();try{localStorage.setItem("mismo.portal.theme",cur());}catch(e){}
    window.dispatchEvent(new Event("resize"));});
  try{var saved=localStorage.getItem("mismo.portal.theme");if(saved)document.documentElement.setAttribute("data-theme",saved);}catch(e){}
  paint();
})();
(function season(){ if(new Date().getMonth()===11) document.documentElement.setAttribute("data-season","december"); })();
})();
</script>
