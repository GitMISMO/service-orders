<script>/* MISMO Service Orders — the relay module.
 *
 * Every credential and every relay call in this tool goes through this file and
 * nowhere else.  Nothing else in the page builds a request, holds a token, or
 * decides what somebody may see.
 *
 * REWRITTEN 27 September 2026 against the relay's own source — GitMISMO/
 * initiative-hub, _dev/aws/index.mjs, 1,242 lines, sha256 39df37c9….  The
 * session-12 version was written to a guessed contract and is kept beside this
 * one as relay.js.session12 until the first live call succeeds.
 *
 * Four things changed from that guess, and they are the whole of the rewrite:
 *
 *   was                                    is
 *   ---------------------------------      ------------------------------------
 *   base /relay                            the Lambda function URL
 *   X-Facilitator-Key on every request     POST /{project}/auth/login, then
 *                                          Authorization: Bearer <token>
 *   PUT /{repo}/file/{path}                POST /{project}/commit with
 *                                          { message, parentSha, files: [...] }
 *   parentSha is the blob sha              parentSha is the COMMIT sha, and a
 *                                          read hands back a BLOB sha.  They are
 *                                          different things and cannot be
 *                                          swapped — see head() below.
 *
 * Rules this file exists to keep:
 *   1. The relay decides what comes back.  The page never filters.
 *   2. The token lives in sessionStorage, not localStorage: it dies with the tab
 *      rather than sitting on disk for four hours.  Every tool on
 *      resources.mismo.org shares one origin, so storage is only ever cleared
 *      one named key at a time — never wholesale.
 *   3. Nothing about who somebody is is inferred.  The access map comes from the
 *      relay at sign-in and is re-read from it, never widened here.
 *   4. Every save carries a parentSha wherever one can be had, so a save that
 *      would overwrite somebody else's is refused rather than silently applied.
 */
(function (global) {
  'use strict';

  var CFG = global.RELAY || {};
  var BASE = String(CFG.base || '').replace(/\/+$/, '');

  var NS = 'resources:service-orders:';
  var TOKEN = 'session';

  /* ---- storage, namespaced, never cleared wholesale ---------------------- */
  function sput(name, value) { try { sessionStorage.setItem(NS + name, value); } catch (e) {} }
  function sget(name) { try { return sessionStorage.getItem(NS + name); } catch (e) { return null; } }
  function sdrop(name) { try { sessionStorage.removeItem(NS + name); } catch (e) {} }

  /* ---- the session ------------------------------------------------------- */
  /* What the relay hands back at sign-in: token, name, email, access, expiresAt.
     The token is NOT project-bound — signing in once covers every key the person
     has — so the access map is what says which projects they may ask about. */
  function session() {
    var raw = sget(TOKEN);
    if (!raw) return null;
    var s;
    try { s = JSON.parse(raw); } catch (e) { sdrop(TOKEN); return null; }
    if (!s || !s.token) { sdrop(TOKEN); return null; }
    /* A token lasts four hours.  Checking the clock here means an expired session
       shows a sign-in rather than a wall of failed requests. */
    if (s.expiresAt && new Date(s.expiresAt).getTime() <= Date.now()) { sdrop(TOKEN); return null; }
    return s;
  }
  function signedIn() { return !!session(); }
  function signOut() { sdrop(TOKEN); HEAD = {}; }

  function login(project, email, password) {
    return fetch(BASE + '/' + enc(project) + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password })
    }).then(readBody).then(function (r) {
      if (!r.ok) throw tag(fail(r.status, r.body), project);
      sput(TOKEN, JSON.stringify(r.body));
      HEAD = {};
      return r.body;
    });
  }

  /* ---- requests ---------------------------------------------------------- */
  function enc(s) { return encodeURIComponent(String(s)); }
  function encPath(p) { return String(p).split('/').map(encodeURIComponent).join('/'); }

  function fail(status, body) {
    var code = (body && body.error) || '';
    var e = new Error((body && body.message) || code || ('relay ' + status));
    e.status = status;
    e.code = code;
    e.body = body || null;
    /* Fail closed: these mean "not you, not here, not any more" and the page
       should say so rather than retry or show an empty screen as if it were
       an empty folder. */
    e.closed = status === 401 || status === 403;
    e.missing = status === 404 || code === 'NOT_FOUND';
    e.conflict = status === 409 || code === 'CONFLICT';
    return e;
  }

  /* Record which project key a failure was against.  Set once and never
     overwritten, so the FIRST key that failed is the one reported. */
  function tag(e, project) {
    if (e && project && !e.project) e.project = project;
    return e;
  }

  function readBody(r) {
    return r.json().catch(function () { return {}; })
      .then(function (j) { return { ok: r.ok, status: r.status, body: j }; });
  }

  function send(method, path, body) {
    var s = session();
    if (!s) return Promise.reject(fail(401, { error: 'NO_SESSION', message: 'Sign in again.' }));
    var opts = { method: method, headers: { 'Authorization': 'Bearer ' + s.token } };
    if (body) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    /* Every path is /{project}/..., so the project is recoverable here.  Naming
       it on the error is what lets the page say WHICH key the relay refused
       instead of a bare code somebody then has to guess at. */
    var proj = decodeURIComponent(String(path).split('/')[1] || '');
    return fetch(BASE + path, opts).then(readBody).then(function (r) {
      if (r.status === 401) { sdrop(TOKEN); throw tag(fail(401, r.body), proj); }
      if (!r.ok) throw tag(fail(r.status, r.body), proj);
      return r.body;
    });
  }

  /* ---- reading ----------------------------------------------------------- */
  /* GET /{project}/file/{path} -> { path, size, sha, content }, content base64.
     The sha is the BLOB sha.  It identifies the bytes and is useful for telling
     whether a file changed; it is NOT what /commit wants for parentSha. */
  function read(project, path) {
    return send('GET', '/' + enc(project) + '/file/' + encPath(path), null)
      .then(function (r) {
        return { sha: r.sha, size: r.size, data: JSON.parse(fromB64(r.content)) };
      });
  }

  /* The same read, WITHOUT parsing. read() assumes JSON and would throw on the
     first byte of a PDF, so anything that is not JSON — an executed agreement,
     a scanned MSA — has to come back through here as base64. */
  function readRaw(project, path) {
    return send('GET', '/' + enc(project) + '/file/' + encPath(path), null)
      .then(function (r) {
        return { sha: r.sha, size: r.size, base64: String(r.content || '').replace(/\s/g, '') };
      });
  }

  /* Read a file that may not exist yet, without turning a 404 into an error. */
  function readOr(project, path, fallback) {
    return read(project, path).catch(function (e) {
      if (e.missing) return { sha: null, size: 0, data: fallback, absent: true };
      throw e;
    });
  }

  function fromB64(b64) {
    var bin = atob(String(b64).replace(/\s/g, ''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    /* TextDecoder, not escape/unescape: company names and the order wording carry
       em-dashes and curly quotes, and a byte-wise read mangles every one of them. */
    return new TextDecoder('utf-8').decode(bytes);
  }

  /* ---- the commit sha, and how to get one -------------------------------- */
  /* No route returns the branch head.  But /commit checks parentSha against the
     head BEFORE it creates a single blob, so a commit sent with a knowingly stale
     parentSha is refused with 409 { error:'CONFLICT', head } and writes nothing.
     That is a clean, side-effect-free way to learn the head once per project per
     session, and it is why no write here has to go out unlocked. */
  var HEAD = {};
  var STALE = '0000000000000000000000000000000000000000';

  function head(project) {
    if (HEAD[project]) return Promise.resolve(HEAD[project]);
    return send('POST', '/' + enc(project) + '/commit', {
      message: 'head probe',
      parentSha: STALE,
      files: [{ path: 'notify/.head-probe', content: '{}' }]
    }).then(function () {
      /* Only reachable if the head really is forty zeros, which it never is.
         If it somehow committed, the sha it returns is the new head. */
      return null;
    }).catch(function (e) {
      if (e.conflict && e.body && e.body.head) { HEAD[project] = e.body.head; return e.body.head; }
      /* The probe is refused for a reason of its own — no write access, say.
         Fall back to an unlocked write rather than blocking the person. */
      return null;
    });
  }

  /* ---- writing ----------------------------------------------------------- */
  /* POST /{project}/commit { message, parentSha, files:[{path, content, encoding}] }
     -> { commit, savedBy }.  One to fifty files, one commit, all or nothing:
     a single disallowed path rejects the whole thing before anything is written. */
  function commit(project, files, message) {
    if (!files || !files.length) return Promise.reject(fail(400, { error: 'BAD_CONTENT' }));
    if (files.length > 50) return Promise.reject(fail(400, { error: 'TOO_MANY_FILES' }));
    return head(project).then(function (parent) {
      var body = { message: message || 'Service orders update', files: files };
      if (parent) body.parentSha = parent;
      return send('POST', '/' + enc(project) + '/commit', body);
    }).then(function (r) {
      HEAD[project] = r.commit;          // our own commit is the new head
      return r;
    }).catch(function (e) {
      if (e.conflict) {
        /* Somebody saved first.  Take the head the relay just told us — or forget
           what we thought it was, if it did not — so the caller's retry re-reads
           and applies the same change to the copy that is actually there. */
        if (e.body && e.body.head) { HEAD[project] = e.body.head; } else { delete HEAD[project]; }
      }
      throw e;
    });
  }

  function jsonFile(path, data) {
    return { path: path, content: JSON.stringify(data, null, 1) };
  }

  /* A PDF or any other binary goes through untouched.  Treating it as text would
     mangle every byte that is not valid UTF-8, and it would only show when
     somebody tried to open the file. */
  function binaryFile(path, base64) {
    return { path: path, content: String(base64).replace(/\s/g, ''), encoding: 'base64' };
  }

  /* Read, change, save — and if somebody saved in between, read the copy that is
     actually there, apply the same change to IT, and save again.  The change
     function is handed a fresh copy every time, so a merge is never guessed at. */
  function update(project, path, change, message, fallback, tries) {
    tries = tries == null ? 3 : tries;
    return readOr(project, path, fallback).then(function (cur) {
      var next = change(cur.data);
      return commit(project, [jsonFile(path, next)], message);
    }).catch(function (e) {
      if (e.conflict && tries > 1) return update(project, path, change, message, fallback, tries - 1);
      throw e;
    });
  }

  /* ---- signing in without knowing the project first ----------------------
     The relay's sign-in lives at POST /{project}/auth/login, so it wants a
     project name before it will tell you which projects you have.  The token it
     hands back is NOT project-bound, so signing in against any one key the
     person holds covers all of them.  We therefore try the keys in turn and
     keep the first that works.  A contractor succeeds on their own key; MISMO
     staff succeed on the first.  Wrong password fails on every key and is
     reported once, as one failure, not five. */
  function loginAny(email, password) {
    var keys = (CFG.projects || []).slice();
    if (!keys.length) return Promise.reject(fail(0, { message: 'No project keys are configured for this page.' }));
    var lastErr = null, unkErr = null, sawForbidden = false, sawUnknown = false;
    function attempt(i) {
      if (i >= keys.length) {
        /* ⚠ Every key refused, and WHY matters — these three are different
           things and only one of them is the person's fault.

             403 on some key   the password is RIGHT; the relay authenticated
                               them and then said they have no access to that
                               project.  Their account simply has no service
                               orders on it.  Never call this a bad password.
             UNKNOWN_PROJECT   the relay has never heard of these projects.  A
                               setup gap, and nothing the person can do.
             401 everywhere    genuinely not recognised. */
        /* ⚠ UNKNOWN_PROJECT is checked FIRST and on purpose.  A relay that has
           never heard of a project cannot have an opinion about who may reach
           it, so a 403 collected alongside one says nothing about the account.
           Reporting the 403 first tells a perfectly good account that it has no
           service orders, and points the person at an email that fixes
           nothing. */
        if (sawUnknown) throw (unkErr || lastErr);
        if (sawForbidden) {
          var ne = fail(403, { error: 'NO_SERVICE_ORDERS',
            message: 'This account has no service orders on it.' });
          ne.noServiceOrders = true;
          throw ne;
        }
        throw lastErr || fail(401, { error: 'NO_ACCESS',
          message: 'That email and password were not recognised.' });
      }
      return login(keys[i], email, password).catch(function (e) {
        if (e.status === 403) { sawForbidden = true; lastErr = e; return attempt(i + 1); }
        if (e.code === 'UNKNOWN_PROJECT') { sawUnknown = true; unkErr = unkErr || e; lastErr = e; return attempt(i + 1); }
        if (e.closed) { lastErr = e; return attempt(i + 1); }
        throw e;
      });
    }
    return Promise.resolve().then(function () { return attempt(0); });
  }

  /* ---- who the signed-in person is --------------------------------------
     The old relay had a /whoami.  This one does not, so the answer is worked
     out from the access map the sign-in returns — which comes FROM the relay
     and is never widened here.

       one key, staff   a contracting company
       every key, admin Jonna
       every key, staff the VP or the President — told apart by reading the
                        names off a company's own orders file, which is in a
                        private repository and needs the sign-in to read.

     Nothing about a person is inferred from their email address by this page. */
  /* ⚠ ONLY the keys this page is configured for.
     An account is one account across every tool on resources.mismo.org, so the
     access map a sign-in returns also carries summit-hq, glossary and anything
     else that person has.  Treating one of those as a service-orders project
     asks the wrong repository for an orders file and the relay rightly answers
     UNKNOWN_PROJECT.  The page's own project list is the filter. */
  function keysOf(sess) {
    var acc = (sess && sess.access) || {};
    var mine = CFG.projects || [];
    if (!mine.length) return Object.keys(acc);
    return mine.filter(function (k) { return Object.prototype.hasOwnProperty.call(acc, k); });
  }
  /* Everything else the account can reach — never used to decide anything, only
     to explain a "you have no service orders" screen without guessing. */
  function otherKeys(sess) {
    var acc = (sess && sess.access) || {};
    var mine = CFG.projects || [];
    return Object.keys(acc).filter(function (k) { return mine.indexOf(k) < 0; });
  }
  /* ⚠ This module's own copy. The views module below has one too; they share no
     scope, so it has to be declared on both sides rather than reached for. */
  function isLiteKey(k) { return (CFG.lite || []).indexOf(k) >= 0; }

  function whoami() {
    var sess = session();
    if (!sess) {
      var e = new Error('Not signed in');
      e.needsLogin = true;
      return Promise.reject(e);
    }
    var keys = keysOf(sess);
    var slugs = CFG.slugs || {};
    var me = { name: sess.name || sess.email, email: sess.email, access: sess.access || {},
               keys: keys, otherKeys: otherKeys(sess) };

    /* Every COMPANY the person may reach, in the order the keys are configured.
       ⚠ DEDUPED, and that is not tidiness.
       Two keys now point at the same company — the full one and the hours-only
       one — so a contractor holding both appeared here TWICE. Everything below
       counted that as two companies, and "more than one company" is how this
       page recognises MISMO staff: a facilitator left on both rows was handed
       the administrator's screen, with every company's details on it. Companies
       are what the question is about, so companies are what gets counted. */
    var seen = {};
    me.slugs = [];
    keys.forEach(function (k) {
      var sl = slugs[k] || k.replace(/^so-/, '').replace(/-hours$/, '');
      if (seen[sl]) return;
      seen[sl] = 1; me.slugs.push(sl);
    });
    me.slug = me.slugs[0];
    me.project = keys[0];
    me.title = '';

    if (!keys.length) { me.kind = 'none'; return Promise.resolve(me); }

    /* ⚠ Hours-only keys can NEVER make somebody staff, however many they hold.
       Checked before the company count, so a mistake in the admin panel cannot
       promote anyone — the worst it can do is give them a company they should
       not have, on the rate-free screen. */
    var allLite = keys.length > 0 && keys.every(function (k) { return isLiteKey(k); });
    if (allLite) {
      me.kind = 'contractor';
      return Promise.resolve(me);
    }

    /* ONE company — whether they hold one key for it or both — is a
       contracting company, never staff. */
    if (me.slugs.length === 1) {
      me.kind = 'contractor';
      return Promise.resolve(me);
    }

    /* Several keys: read one company's file to pick up the MISMO names and
       titles.  The titles print on approvals, so they come from the data rather
       than being typed into this page.  One extra read, once, at sign-in. */
    return read(me.project, 'orders/' + me.slug + '.json').then(function (r) {
      var F = r.data || {};
      var vp = F.vpProduct || {}, pres = F.mismoSigner || {};
      var mine = String(sess.email || '').toLowerCase();
      if (mine && mine === String(vp.email || '').toLowerCase()) {
        me.kind = 'vp-product';
        me.name = me.name || vp.name; me.title = vp.title || '';
      } else if (mine && mine === String(pres.email || '').toLowerCase()) {
        me.kind = 'president';
        me.name = me.name || pres.name; me.title = pres.title || '';
      } else {
        me.kind = 'admin';
        me.title = 'Director of Programs & Operations';
      }
      return me;
    }).catch(function () {
      /* The name-matching read failed. The access map is still trustworthy, so
         fall back on it rather than refusing to show anything. */
      me.kind = keys.some(function (k) { return (sess.access || {})[k] === 'admin'; })
        ? 'admin' : 'president';
      return me;
    });
  }

  /* Kept so the page has one call to make at start-up.  There is nothing to
     boot any more — the session either exists in this tab or it does not. */
  function boot() { return session(); }

  global.MISMO_RELAY = {
    base: BASE,
    boot: boot, whoami: whoami, loginAny: loginAny,
    login: login, signOut: signOut, signedIn: signedIn, session: session,
    read: read, readOr: readOr, readRaw: readRaw,
    commit: commit, update: update,
    jsonFile: jsonFile, binaryFile: binaryFile,
    limits: { filesPerCommit: 50, bodyBytes: 1000000 },
    store: { put: sput, get: sget, drop: sdrop, prefix: NS }
  };
})(window);
</script>
<script>/* =========================================================================
 * hours.js — everything about a week of time that is ARITHMETIC rather than
 * screen.  Kept apart from the views on purpose: the same week endings, the
 * same weekly pace and the same totals have to come out identical for the
 * person logging, the time manager reconciling and Jonna approving, or the
 * three of them argue over an invoice.
 *
 * ⚠ The governing rule (blueprint, and Jonna's standing instruction):
 *    NOTHING IS STORED THAT CAN BE WORKED OUT.
 * So a stored row carries hours, the notes, the health flag and — only where
 * somebody covered for a colleague — the split.  It does NOT carry the order's
 * name, its weekly pace, a balance or any total.  Every one of those is
 * derived here, from the order itself, every time it is shown.
 * ======================================================================= */
window.H = (function () {
  'use strict';

  /* ---- dates -------------------------------------------------------------
     Dates on this page are the ones MISMO already uses: MM/DD/YY, because that
     is what the service orders, the forecast and the weekly sheet all carry.
     Parsing and printing both go through here so nothing drifts. */
  function parse(mdy) {
    var m = /^(\d{2})\/(\d{2})\/(\d{2})$/.exec(String(mdy || '').trim());
    if (!m) return null;
    return new Date(2000 + (+m[3]), (+m[1]) - 1, +m[2]);
  }
  function print(d) {
    if (!d) return '';
    function two(n) { return (n < 10 ? '0' : '') + n; }
    return two(d.getMonth() + 1) + '/' + two(d.getDate()) + '/' + String(d.getFullYear()).slice(2);
  }
  function addDays(d, n) { var c = new Date(d.getTime()); c.setDate(c.getDate() + n); return c; }
  function sameDay(a, b) {
    return a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth()
      && a.getDate() === b.getDate();
  }
  /* A long date, for the one place a week is announced rather than listed. */
  var MONTHS = ['January','February','March','April','May','June','July',
                'August','September','October','November','December'];
  function longDate(d) { return d ? MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear() : ''; }

  /* ---- the fiscal year ---------------------------------------------------
     MISMO's runs 1 October to 30 September.  "FY 2027" is the year it ENDS in,
     so FY 2027 begins 1 October 2026. */
  function fyBounds(fy) {
    var y = parseInt(String(fy).replace(/\D+/g, ''), 10);
    if (!y) return null;
    return { start: new Date(y - 1, 9, 1), end: new Date(y, 8, 30), year: y };
  }
  function fyOf(d) {
    /* October onward belongs to the NEXT fiscal year. */
    return 'FY ' + (d.getMonth() >= 9 ? d.getFullYear() + 1 : d.getFullYear());
  }

  /* ---- week endings ------------------------------------------------------
     Weeks end on a Friday.  That is all.

     ⚠ An earlier version added the last day of a month as an extra week ending,
     on the reasoning that a week straddling a month end would put two months'
     hours on one invoice line.  Jonna, 29 September: THAT IS NOT HOW IT WORKS.
     A week does straddle — the week ending 10/02/26 has 28, 29 and 30 September
     on the September invoice and 1 and 2 October on the October one — and the
     split is made by DAY inside the week, not by cutting the week in two.
     See monthSplit() below, which is what asks for it. */
  var WE_CACHE = {};
  function weekEndings(fy) {
    if (WE_CACHE[fy]) return WE_CACHE[fy];
    var b = fyBounds(fy);
    if (!b) return [];
    var out = [], d = new Date(b.start.getTime());
    while (d <= b.end) {
      if (d.getDay() === 5) out.push(new Date(d.getTime()));
      d = addDays(d, 1);
    }
    /* The year's last days may fall after the final Friday; they still have to
       belong to a week, so the fiscal year end closes the last one. */
    if (!out.length || !sameDay(out[out.length - 1], b.end)) out.push(new Date(b.end.getTime()));
    WE_CACHE[fy] = out;
    return out;
  }

  /* The first day a week covers: the day after the week before it ended, or
     the first day of the fiscal year for the very first week. */
  function weekStart(fy, ending) {
    var ends = weekEndings(fy), b = fyBounds(fy);
    for (var i = 0; i < ends.length; i++) {
      if (sameDay(ends[i], ending)) return i === 0 ? b.start : addDays(ends[i - 1], 1);
    }
    return null;
  }
  function weekSpan(fy, endingStr) {
    var e = parse(endingStr), s = e && weekStart(fy, e);
    if (!s || !e) return '';
    return longDate(s) + ' to ' + longDate(e);
  }
  /* The week a given day falls in — the first ending on or after it. */
  function weekFor(fy, d) {
    var ends = weekEndings(fy);
    for (var i = 0; i < ends.length; i++) if (ends[i] >= d) return print(ends[i]);
    return ends.length ? print(ends[ends.length - 1]) : '';
  }
  /* Every week ending that has already passed, newest first — the weeks a
     person could have something to show for. */
  function weeksTo(fy, today) {
    var ends = weekEndings(fy), out = [];
    for (var i = 0; i < ends.length; i++) if (ends[i] <= today) out.push(print(ends[i]));
    return out.reverse();
  }

  /* ---- a week that crosses a month end -----------------------------------
     Jonna, 29 September: the week ending 10/02/26 puts 28, 29 and 30 September
     on the September invoice and 1 and 2 October on the October one.

     ⚠ A weekly total cannot say that on its own, and neither can the calendar:
     somebody who worked only the Tuesday has NO October hours, while dividing
     by weekdays would book them 40% into October for work they did not do.
     So on the weeks that straddle — about eleven a year — the person is asked,
     and every other week is untouched.  Guessing here would quietly move real
     cost between two months, which is the thing the monthly reconciliation
     exists to catch. */
  function straddle(fy, ending) {
    var e = parse(ending), s = e && weekStart(fy, e);
    if (!s || !e || s.getMonth() === e.getMonth()) return null;
    /* The last day of the earlier month, and the first of the later one. */
    var cut = new Date(e.getFullYear(), e.getMonth(), 1);
    /* A one-day side reads "31 October to 31 October" otherwise, which is the
       kind of small wrongness that makes people distrust the rest. */
    function span(a, b) {
      return sameDay(a, b) ? longDate(a) : longDate(a) + ' to ' + longDate(b);
    }
    return {
      firstMonth: MONTHS[s.getMonth()],
      lastMonth: MONTHS[e.getMonth()],
      firstDays: span(s, addDays(cut, -1)),
      lastDays: span(cut, e)
    };
  }
  /* What was said about the split, and what is left for the later month. */
  function splitMonths(row, fy, ending) {
    var st = straddle(fy, ending);
    if (!st) return null;
    var total = Number(row && row.hours) || 0;
    var first = Number(row && row.inFirstMonth);
    if (!(first >= 0)) first = null;
    return {
      first: first, last: first == null ? null : Math.round((total - first) * 100) / 100,
      total: total, firstMonth: st.firstMonth, lastMonth: st.lastMonth,
      over: first != null && first > total + 0.001
    };
  }

  /* ---- the weekly pace, derived --------------------------------------------
     ⚠ `Est. Time Per Week` in the Smartsheet sheet carries long decimals
     (5.1666080013736) because it was never typed — it is the order's hours
     spread across the weeks the order runs.  So it is worked out here and
     never stored.  An order with no hours (Falcon's certification work, which
     is paid per review) has no pace and logs no time. */
  function orderWeeks(fy, o) {
    var s = parse(o.startDate), e = parse(o.endDate);
    var ends = weekEndings(fy), n = 0;
    for (var i = 0; i < ends.length; i++) {
      if ((!s || ends[i] >= s) && (!e || ends[i] <= e)) n++;
    }
    return n || ends.length || 1;
  }
  function perWeek(fy, o) {
    var t = Number(o.estimatedHours) || 0;
    if (!t) return 0;
    return t / orderWeeks(fy, o);
  }

  /* ---- reading a stored week ----------------------------------------------
     A file holds { person, slug, fiscalYear, draft, weeks[] }.  A row is keyed
     by ORDER ID, never by name, so renaming an order never orphans time. */
  function emptyFile(person, fy) {
    return { person: person.name, slug: person.slug, email: person.email || null,
             fiscalYear: fy, draft: null, weeks: [] };
  }
  function weekIn(file, ending) {
    var w = (file && file.weeks) || [];
    for (var i = 0; i < w.length; i++) if (w[i].weekEnding === ending) return w[i];
    return null;
  }
  function rowsOf(wk) { return (wk && wk.rows) || {}; }
  function hoursIn(wk) {
    var r = rowsOf(wk), t = 0;
    for (var k in r) if (r.hasOwnProperty(k)) t += Number(r[k].hours) || 0;
    return t;
  }

  /* ---- who the hours were FOR ---------------------------------------------
     Jonna, 29 Sep: a row may name colleagues who did some of the work.  The
     submitter keeps whatever is left.  ⚠ This is the ONLY thing that makes a
     per-person figure trustworthy where several people work the same admin-time
     order and one of them submits it — and it is what
     catches the case the hours agree and the money does not, because a company
     can bill two different rates against the same order.

     ⚠ No rate, and no figure a rate could be worked out from, belongs in this
     file: it is served from a PUBLIC repository and anybody can read it. */
  function splitOf(row, submitter) {
    var total = Number(row.hours) || 0;
    var named = (row['for'] || []).filter(function (f) { return f && f.person && Number(f.hours); });
    var given = named.reduce(function (a, f) { return a + (Number(f.hours) || 0); }, 0);
    var out = named.map(function (f) { return { person: f.person, hours: Number(f.hours) || 0 }; });
    var keeps = Math.round((total - given) * 100) / 100;
    if (keeps > 0 || !out.length) out.unshift({ person: submitter, hours: keeps });
    return out;
  }
  /* More hours given away than were logged is the one thing a split can get
     wrong, and it has to be caught before the week is sent rather than on an
     invoice six weeks later. */
  function splitOver(row) {
    var total = Number(row.hours) || 0;
    var given = (row['for'] || []).reduce(function (a, f) { return a + (Number(f.hours) || 0); }, 0);
    return given > total + 0.001 ? Math.round((given - total) * 100) / 100 : 0;
  }

  /* ---- totals across a company --------------------------------------------
     ⚠ Per the August 2026 reconciliation: an order's used hours is EVERY
     person's logged time against it, not the submitter's.  A contractor who
     sees only their own contribution cannot tell whether the order is close to
     its maximum, and that is how an overrun reaches an invoice. */
  function usedOnOrder(files, orderId, upTo) {
    var t = 0;
    (files || []).forEach(function (f) {
      ((f && f.weeks) || []).forEach(function (wk) {
        if (upTo && wk.weekEnding && parse(wk.weekEnding) > upTo) return;
        var r = rowsOf(wk)[orderId];
        if (r) t += Number(r.hours) || 0;
      });
    });
    return Math.round(t * 100) / 100;
  }
  /* The same, attributed — who the hours were for rather than who sent them. */
  function usedByPerson(files, orderId) {
    var by = {};
    (files || []).forEach(function (f) {
      ((f && f.weeks) || []).forEach(function (wk) {
        var r = rowsOf(wk)[orderId];
        if (!r) return;
        splitOf(r, f.person).forEach(function (s) {
          by[s.person] = Math.round(((by[s.person] || 0) + s.hours) * 100) / 100;
        });
      });
    });
    return by;
  }
  /* Everything in one month, for the time manager reconciling before an
     invoice goes out and for Jonna reconciling after it arrives. */
  function monthOf(ending) { var d = parse(ending); return d ? (d.getMonth() + 1) + '/' + d.getFullYear() : ''; }
  function monthLabel(m) {
    var p = String(m).split('/');
    return p.length === 2 ? MONTHS[(+p[0]) - 1] + ' ' + p[1] : '';
  }
  function monthsIn(files) {
    var seen = {};
    (files || []).forEach(function (f) {
      ((f && f.weeks) || []).forEach(function (wk) { var m = monthOf(wk.weekEnding); if (m) seen[m] = 1; });
    });
    return Object.keys(seen).sort(function (a, b) {
      var A = a.split('/'), B = b.split('/');
      return (+B[1]) - (+A[1]) || (+B[0]) - (+A[0]);
    });
  }
  function monthRows(files, month) {
    /* order id -> { hours, byPerson{} } for one month, from every person. */
    var out = {};
    (files || []).forEach(function (f) {
      ((f && f.weeks) || []).forEach(function (wk) {
        if (monthOf(wk.weekEnding) !== month) return;
        var r = rowsOf(wk);
        for (var id in r) {
          if (!r.hasOwnProperty(id)) continue;
          if (!out[id]) out[id] = { hours: 0, byPerson: {} };
          out[id].hours = Math.round((out[id].hours + (Number(r[id].hours) || 0)) * 100) / 100;
          splitOf(r[id], f.person).forEach(function (s) {
            out[id].byPerson[s.person] =
              Math.round(((out[id].byPerson[s.person] || 0) + s.hours) * 100) / 100;
          });
        }
      });
    });
    return out;
  }

  /* ---- the four states a submitted week can be in -------------------------
     Jonna, 27 Sep: the line is drawn at PAYMENT, not at invoicing.  An unpaid
     invoice can still be credited and reissued; a paid one cannot. */
  var STATES = {
    submitted: { label: 'Submitted', tone: 'warn',
      said: 'Sent to MISMO and not yet approved. It is still yours — you can take it back and correct it.' },
    approved: { label: 'Approved', tone: 'good',
      said: 'Approved by MISMO. Locked, and not yet on an invoice — it can still be returned if something is wrong.' },
    invoiced: { label: 'Invoiced, Awaiting Payment', tone: 'warn',
      said: 'On an invoice that has gone out and has not been paid. It does not reopen on your word — but MISMO can override, because an unpaid invoice can still be credited and reissued.' },
    paid: { label: 'Invoiced and Paid', tone: '',
      said: 'On an invoice that has been paid. This week does not reopen for anyone — a correction goes on the next period.' },
    /* ⚠ A week MISMO has sent back is not a week that never happened.  It
       keeps its place in the record, carries the reason it came back, and is
       editable again — so the person can see what was asked for while they
       correct it, and the earlier submission survives as a version. */
    returned: { label: 'Sent Back to You', tone: 'bad',
      said: 'MISMO has sent this week back for you to correct. The reason is below. Fix it and send it again — what you first submitted is kept.' }
  };
  function stateOf(wk) { return STATES[(wk && wk.state) || 'submitted'] || STATES.submitted; }

  /* ---- the weeks a person still owes -------------------------------------
     ⚠ Jonna, 5 October: a contractor who missed a week had no way back to it.
     My Hours only ever opened the week they were in, so the only thing they
     could do was pile the missing hours onto the current week — which puts
     them on the wrong month's invoice and undoes the month split.

     Decision 40: they may open ANY week whose month has not been invoiced.
     Once a month is invoiced it closes, the same rule as Invoiced and Paid —
     a correction goes on the next period.

     All of this is DERIVED.  Nothing about a missed week is stored: it is the
     absence of a submission, worked out from the weeks that are there. */

  /* A month is closed to this person once any of their weeks in it has gone on
     an invoice.  Per person and per month, because one company's October can
     be invoiced while another's is not. */
  function closedMonths(file) {
    var shut = {};
    ((file && file.weeks) || []).forEach(function (w) {
      if (w.state === 'invoiced' || w.state === 'paid') shut[monthOf(w.weekEnding)] = w.state;
    });
    return shut;
  }

  /* Did somebody else carry this person's hours that week?  A week a colleague
     covered is NOT a week they owe — getting this wrong is what made the
     Smartsheet alert fire every month. */
  function coveredWeeks(files, personName) {
    var cov = {};
    (files || []).forEach(function (f) {
      ((f && f.weeks) || []).forEach(function (w) {
        var rows = rowsOf(w);
        for (var id in rows) {
          if (!rows.hasOwnProperty(id)) continue;
          (rows[id]['for'] || []).forEach(function (s) {
            if (s.person === personName && Number(s.hours)) cov[w.weekEnding] = 1;
          });
        }
      });
    });
    return cov;
  }

  /* Every week ending this person can still open, newest first.
       file   — their own hours file
       files  — everybody's, so a week a colleague covered is not counted
       isOn   — function(date) -> was this person active that week
       today  — passed in so a test can stand somewhere else in the year
     A week MISMO sent back IS owed, so it is listed — but the band labels it
     "Sent back to you" rather than "Not submitted", because the two are not
     the same thing and the person needs to know which it is.  It also keeps
     its own Correct This Week button in My Submitted Time; both routes land
     on the same week. */
  function openWeeks(fy, file, files, isOn, today) {
    var now = today || new Date();
    var sent = {};
    ((file && file.weeks) || []).forEach(function (w) {
      if (w.state !== 'returned') sent[w.weekEnding] = 1;
    });
    var cov = coveredWeeks(files, file && file.person);
    var shut = closedMonths(file);
    var out = [];
    weekEndings(fy).forEach(function (d) {
      if (d > now) return;                          // not reached yet
      var e = print(d);
      if (sent[e] || cov[e]) return;                // submitted, or covered
      if (shut[monthOf(e)]) return;                 // that month is on an invoice
      if (isOn && !isOn(d)) return;                 // before they started, or after they left
      out.push(e);
    });
    return out.reverse();
  }

<script>/* MISMO Service Orders and Agreements — the platform page.
 *
 * This file holds NO data.  Everything on screen arrives from the relay, which
 * decides what this person may see before it sends anything.  There is no
 * filtering here: a contracting company is not shown its own orders because the
 * page hid the others, it is shown them because the relay refused the rest.
 *
 * Every credential and every request goes through relay.js.
 */
(function () {
  'use strict';
  var R = window.MISMO_RELAY;

  /* ⚠ Which upload is actually live.
     This page is one file that is replaced by hand, so "I uploaded it" and
     "the browser is running it" are two different facts — a cached copy looks
     exactly like a fresh one. The stamp is printed on the error screen and on
     the sign-in screen, so a fault report says which build it came from
     instead of costing a round of guessing. Bump it on every upload. */
  var BUILD = '2026-10-07f \u00b7 logs time';

  var $ = function (s, root) { return (root || document).querySelector(s); };
  var $$ = function (s, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(s));
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {

  /* ⚠ What an order's fee says on screen, in ONE place.
     This expression was written out fourteen times, and every copy tested only
     whether a maximum fee was present — so a per-review order carrying a zero
     read "$0.00", which is not a price, it is a wrong one. A per-review order
     has no maximum fee by definition: the fee schedule on the document is the
     commercial term. It says so whatever is stored against it, and a zero on
     any order reads the same way, because no order is worth nothing. */
  function perReviewOrder(o) {
    return !!(o && (o.source === 'certification' || o.feeType === 'perReview'));
  }
  function feeLabel(o, long) {
    var none = long ? 'No maximum — paid per review' : 'Per review';
    if (!o) return none;
    if (perReviewOrder(o)) return none;
    if (o.maximumFee == null || Number(o.maximumFee) === 0) return none;
    return money(o.maximumFee);
  }

  function money(v) {
    return v == null ? '—' : '$' + Number(v).toLocaleString('en-US',

  }

    return '$' + Number(v || 0).toLocaleString('en-US', { maximumFractionDigits: 0 });
  }

     An order with no maximum fee is NEVER summed as zero.  Falcon's
     certification orders are paid per review and carry no maximum, so a total
     that just added them up would read $0 and look broken.  The count of them
     travels with the figure and is always said out loud. */
  function feeTotal(orders) {
    var sum = 0, counted = 0, noMax = 0;
    (orders || []).forEach(function (o) {

  }

    var bits = [];

      t.counted + ' order' + (t.counted === 1 ? '' : 's'));
    if (t.noMax) bits.push((t.counted ? 'and ' : '') + t.noMax + ' order' +

  }
  function pill(st) {

     then a scroll to find. One section is on screen at a time, the rail

       `(a || []).map` threw on it, which took down the whole view for everyone

       no hourly rate or maximum fee to state. Printing "$0.00" on one of these
       is worse than printing nothing — it reads as a priced order worth nothing.
       The generated certification orders say so with source; an order raised in

    var perReview = o.source === 'certification' || o.feeType === 'perReview';
    if (perReview) {
      s('Delivery Schedule', '<p>' + esc(o.deliverySchedule) + '</p>');
      s('Duration of Order', '<p>' + esc(o.startDate) + ' to ' + esc(o.endDate) + '</p>');
      s('Payment Schedule', '<p>' + esc(o.paymentSchedule) + '</p>');
    } else {
      if (has(o.deliverySchedule)) s('Delivery Schedule', '<p>' + esc(o.deliverySchedule) + '</p>');

    h += '<div class="sig"><div><b>' + esc(party) + '</b><span>' + esc(F.signers.order.name) +

      '<div><b>MISMO</b><span>' + esc(F.mismoSigner.name) + '</span><span>' +

/* ---------------------------------------------------------------------------
 * The views.
 * ------------------------------------------------------------------------- */
(function () {
  'use strict';
  var R0 = window.MISMO_RELAY, P = window.MISMO_PORTAL_PARTS;

  /* =========================================================================
   * VIEW AS — Jonna seeing a company's own screen, for training
   *
   * She is platformAdmin with admin on all five project keys, so the page can
   * read any company's real files from her own sign-in.  ⚠ This is not
   * impersonation and borrows nobody's password: it is reading files she
   * already has the right to read and drawing them in the company's layout.
   *
   * ⚠ IT IS READ-ONLY, AND THAT IS THE WHOLE POINT.  Training means pressing
   * the buttons.  If the buttons wrote, a training session would accept live
   * service orders and submit live time — and an acknowledgment recorded while
   * Jonna drove the screen would be worthless while looking genuine.
   *
   * The lock is ONE GUARD AT THE RELAY BOUNDARY, not a disabled attribute per
   * button.  Every write in this file goes through R.update or R.commit, so
   * refusing them here makes the whole mode read-only by construction — a
   * button added later is covered without anybody remembering to.
   * ======================================================================= */
  var VIEWAS = null;          // { slug, company, role, as } or null

  var R = (function () {
    var w = {};

    }

  /* ---- loading ----------------------------------------------------------
     Each contracting company has its own project key and its own private
     repository, so every read and every save names the key for the company it
     concerns.  The map is configuration, baked in at build time; it carries
     nothing confidential, only which folder belongs to which name. */

  var LITE_KEYS = {};
  (CFGP.lite || []).forEach(function (k) { LITE_KEYS[k] = 1; });

     orders-public/, which has no money in it at all. The difference is enforced
     by the RELAY, so a rate is not hidden from a facilitator's screen, it never
     arrives at their browser. Anything the page does on top of that is
     convenience; this is the part that holds. */
  var SLUG_TO_KEY = (function () {

    var m = {}, slugs = CFGP.slugs || {};

    return m;

  /* ⚠ THE HOURS COPY — built by ALLOW-LIST, never by deleting fields.
     A denylist ("strip hourlyRate and maximumFee") is wrong the moment the
     generator adds a field: the new one ships. This names every field that may
     cross, and anything not named here cannot. The order DOCUMENT never
     crosses at all, because the rate is written on it.

      fields.forEach(function (k) { if (src[k] !== undefined) out[k] = src[k]; });

            'orders file whenever company details are saved.'

  /* The key THIS account actually holds for this company. Somebody with both
     (Jonna) gets the full one; somebody with only the hours key gets that, and
     the relay refuses them everything else. */
  function keyFor(slug) {
    var have = (ME && ME.keys) || [];
    var fullK = SLUG_TO_KEY[slug], liteK = SLUG_TO_LITE[slug];
    if (fullK && have.indexOf(fullK) >= 0) return fullK;
    if (liteK && have.indexOf(liteK) >= 0) return liteK;
    return fullK || ('so-' + slug);
  }
  /* Is this person on the hours-only key for this company? */
  function onLiteKey(slug) { return !!LITE_KEYS[keyFor(slug)]; }

  /* ---- revisions --------------------------------------------------------
     The binding terms a person changed after an order was stopped.

     ⚠ They live in their OWN file and never in orders/<slug>.json.  The
     generator rewrites that file from the forecast every time it runs, so a
     revision written there would be silently wiped the next time somebody
     regenerated the set — and nobody would see it go.  Same rule that keeps
     signatures out of it.

     The file is a list, never a replacement: every revision of an order is
     kept, newest last, so what changed and when is on the record permanently.
     Only the newest is applied. */
  var BINDING = ['hourlyRate', 'estimatedHours', 'maximumFee', 'feeType',
    'startDate', 'endDate', 'services', 'deliverables', 'modifications',
    'tasksFromMismo', 'paymentSchedule', 'deliverySchedule', 'description'];

  function touchesBinding(changes) {
    return Object.keys(changes || {}).some(function (k) { return BINDING.indexOf(k) >= 0; });
  }

  /* Applied onto the generated order in memory.  Nothing is written back. */
  function applyRevisions(F, revisions) {
    var byOrder = {};
    (revisions || []).forEach(function (rv) {
      if (!rv || !rv.orderId) return;
      byOrder[rv.orderId] = (byOrder[rv.orderId] || []).concat([rv]);
    });
    (F.orders || []).forEach(function (o) {
      var list = byOrder[o.id] || [];
      o.rev = list.length;                       // 0 = exactly as generated
      if (!list.length) return;
      var latest = list[list.length - 1];
      Object.keys(latest.changes || {}).forEach(function (k) { o[k] = latest.changes[k]; });
      o.revisedOn = latest.revisedOn;
      o.revisedBy = latest.revisedBy;
      o.revisionNote = latest.note;
      o.revisionHistory = list;
      o.revisionBinding = list.some(function (rv) { return touchesBinding(rv.changes); });
    });
    return F;
  }

  /* ---- orders raised in this page, not by the generator -----------------
     A new order has no forecast row behind it — it is work that came up after
     the forecast was built.  It is kept in the same local file as the
     revisions, for one reason worth stating plainly: that path is already
     declared writable, so adding this needs NO relay configuration change.  A
     new path would have needed one, and a path the relay has not been told
     about is refused, which is how the page got taken down once already. */
  function applyAdditions(F, additions) {
    (additions || []).forEach(function (a) {
      if (!a || !a.id) return;
      if ((F.orders || []).some(function (o) { return o.id === a.id; })) return;  // never twice
      /* ⚠ A COPY. The record goes into the order list and everything after this
         writes onto it — the send date, the revisions, the derived rev number.
         Adding the caller's own object would quietly edit the loaded file in
         memory, so a second pass over the same data would see an order that had
         already been changed. */
      F.orders = (F.orders || []).concat([JSON.parse(JSON.stringify(a))]);
    });
    return F;
  }

  /* ---- when an order was sent -------------------------------------------
     ⚠ This USED to be written onto the order itself, in orders/<slug>.json.
     That stopped working the day `orders/` became read-only — and read-only is
     the point: it is what stops a contracting company rewriting its own rate.
     But the relay's permissions are per PROJECT, not per person, so a folder
     closed to them is closed to MISMO too, and pressing "Send These 8" was
     refused.  The date therefore lives here instead, with everything else this
     page writes.  Nothing the page writes goes in the generator's file. */
  function applySent(F, sent) {
    if (!sent) return F;
    (F.orders || []).forEach(function (o) {
      // an older sentOn already on the order wins: it is the original record
      if (!o.sentOn && sent[o.id]) o.sentOn = sent[o.id];
    });
    return F;
  }

  /* Order matters: additions first so a new order can also be revised and
     sent, revisions last so the newest terms are what everything else reads. */
  /* ---- company details edited in the portal -----------------------------
     The signer, each agreement's address and signer, and each person's email
     and standing. ⚠ In the local file like everything else this page writes —
     `orders/<slug>.json` is the generator's and is read-only to the relay, so
     an edit written there is refused, and one written there successfully would
     be erased the next time the orders were regenerated.

     Only the fields a person actually changed are stored. Everything else keeps
     coming from the generated file, so a later regeneration still improves the
     parts nobody has overridden. */
  function applyDetails(F, d) {
    if (!d) return F;
    if (d.signer) {
      F.signers = F.signers || {};
      F.signers.order = Object.assign({}, F.signers.order || {}, d.signer);
    }
    (F.letters || []).forEach(function (l) {
      var o = (d.letters || {})[l.msaFlavour];
      if (!o) return;
      if (o.address && o.address.length) l.address = o.address.slice();
      if (o.salutation) l.salutation = o.salutation;
      if (o.signer) l.signer = Object.assign({}, l.signer || {}, o.signer);
    });
    (F.people || []).forEach(function (p) {
      var o = (d.people || {})[p.slug];
      if (!o) return;
      if (o.email != null) p.email = o.email;
      if (o.fullAccess != null) p.fullAccess = !!o.fullAccess;
      if (o.timeManager != null) p.timeManager = !!o.timeManager;
      /* The orders this person normally logs against. Replaced outright rather
         than merged — a list that could only ever grow would make removing an
         order impossible. */
      if (o.orders) p.orders = o.orders.slice();
      if (o.logsTime != null) p.logsTime = !!o.logsTime;
    });
    /* Everybody at this company may log against every order, because they
       cover for each other. What is NORMALLY theirs stays on the person
       record, so their own lines can still be told apart from the cover. */
    if (d.coverAll != null) F.coverAll = !!d.coverAll;
    /* Who is answerable for an order, switchable at any time. */
    (F.orders || []).forEach(function (o) {
      var ov = (d.orders || {})[o.id];
      if (ov && ov.facilitator != null) o.facilitator = ov.facilitator;
    });
    return F;
  }

  /* ⚠ THE ONE RULE for which service orders a person may log time against.
     Three screens used to work this out from `person.orders` separately — My
     Hours, the list of who owes a week, and which hours files to load. A
     company that covers for each other broke all three differently. It is
     decided here now, and every screen asks.

     `own` is what is normally theirs. `cover` is everything else they are
     allowed to pick up. Both are returned, because the difference is the
     thing a person sorting their own week actually needs to see. */
  function ordersForPerson(F, person, year) {
    var all = (F.orders || []).filter(function (o) {
      return !year || (o.fiscalYear || F.fiscalYear) === year;
    });
    var mine = {};
    ((person && person.orders) || []).forEach(function (id) { mine[id] = 1; });
    var own = all.filter(function (o) { return mine[o.id]; });
    var cover = F.coverAll ? all.filter(function (o) { return !mine[o.id]; }) : [];
    function byName(a, b) {
      return String(a.subject || '').localeCompare(String(b.subject || ''),
        undefined, { sensitivity: 'base', numeric: true });
    }
    own.sort(byName); cover.sort(byName);
    return { own: own, cover: cover, all: own.concat(cover) };
  }
  /* Does this person log time at all?
     ⚠ COVER DOES NOT MAKE SOMEBODY A TIME LOGGER. It widens which orders a
     logger may book against; it does not hand My Hours to the authorised
     signer and the manager above her, who never log a minute. Cover-all was
     doing exactly that, and it put My Hours and My Submitted Time on screens
     that had no use for them.

     The answer is the person's own orders, unless Jonna has said otherwise in
     Company Details — an explicit Yes or No always wins, so somebody who
     covers but has nothing normally theirs can still be given the screen. */
  function logsTime(F, person) {
    if (!person) return false;
    if (person.logsTime != null) return !!person.logsTime;
    return (person.orders || []).length > 0;
  }

  function applyLocal(F, local) {
    local = local || {};
    F = applyAdditions(F, local.additions);
    F = applyDetails(F, local.details);
    F = applySent(F, local.sent);
    return applyRevisions(F, local.revisions);
  }

  /* ---- fetching a filed document --------------------------------------
     ⚠ The agreements live in a PRIVATE repository. There is no URL a browser
     can follow to one — that is the whole point of keeping them there. An
     ordinary <a href> could never have worked, whatever it pointed at.
     The file has to come back through the relay, which checks who is asking,
     and is then handed to the browser as a download it already holds. */
  function fetchAndSave(slug, path, filename) {
    return R.readRaw(keyFor(slug), path).then(function (r) {
      var bin = atob(r.base64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
      var a = document.createElement('a');
      a.href = url;
      a.download = filename || path.split('/').pop();
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      /* Released on the next turn of the loop — revoking it immediately can
         cancel the download in some browsers before it has started. */
      setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
      return r;
    });
  }

  function wireDownloads(root) {
    (root || document).querySelectorAll('.dlfile').forEach(function (b) {
      if (b.dataset.wired) return; b.dataset.wired = '1';
      b.addEventListener('click', function () {
        var was = b.textContent;
        b.disabled = true; b.textContent = 'Fetching…';
        fetchAndSave(b.dataset.slug, b.dataset.path, b.dataset.name)
          .then(function () { b.disabled = false; b.textContent = was; })
          .catch(function (e) {
            b.disabled = false; b.textContent = was;
            if (e && e.missing) {
              toast('That file is recorded but is not in the repository', 'warn');
              return;
            }
            failed(e);
          });
      });
    });
  }

  function loadCompany(slug) {
    /* ⚠ An hours-only key takes a DIFFERENT PATH ENTIRELY, rather than the
       same reads with the money dropped afterwards. It asks for one file that
       has no money in it, and asks for nothing else — so there is no request
       here that the relay would have to refuse, and nothing to leak if a later
       screen forgets to check a role. */
    if (onLiteKey(slug)) return loadCompanyHours(slug);
    return Promise.all([
      R.read(keyFor(slug), 'orders/' + slug + '.json'),
      R.read(keyFor(slug), 'signatures/' + slug + '.json'),
      /* ⚠ An OPTIONAL read, and it must never be able to take the page down.
         `revisions/` has to be declared in the project's writable list before
         the relay will serve it; until it is, the relay answers 403
         PATH_NOT_READABLE, not 404 — and readOr alone only forgives a 404. The
         first build of this made it a plain read, so on a site where the folder
         was not yet declared EVERY view failed to load and the page fell back
         to the sign-in screen, which looked like being locked out.

         403 is safe to treat as "none": the relay refuses that path for writing
         by exactly the same rule, so if it cannot be read, no revision can ever
         have been written to it. Anything else — a 502, a dead network — is
         raised, because a revision that exists and cannot be read would show
         the OLD terms on screen as though nothing had been revised. */
      R.readOr(keyFor(slug), 'revisions/' + slug + '.json', { revisions: [] })
        .catch(function (e) {
          if (e && e.status === 403) {
            if (window.console && console.warn) {
              console.warn('revisions/ is not declared writable for ' + keyFor(slug) +
                ' — revisions are off until it is');
            }
            return { sha: null, data: { revisions: [] }, absent: true, unconfigured: true };
          }
          throw e;
        })
      ,
      /* What has actually been filed. Optional in exactly the same way and for
         exactly the same reasons as the local file above — a company with
         nothing filed yet has no such file, and the page must not care. */
      R.readOr(keyFor(slug), 'agreements/' + slug + '.json', { agreements: [] })
        .catch(function (e) {
          if (e && e.status === 403) return { sha: null, data: { agreements: [] }, absent: true };
          throw e;
        })
    ]).then(function (r) {
      var local = r[2].data || {};
      var revisions = local.revisions || [];
      var F = applyLocal(r[0].data, local);
      var executed = {};
      (((r[3].data) || {}).agreements || []).forEach(function (a) { executed[a.msaFlavour] = a; });
      return { slug: slug, sha: r[0].sha, F: F, local: local, executed: executed,
               sigSha: r[1].sha, sigs: r[1].data.signatures || [], revisions: revisions };
    });
  }

  /* The whole of an hours-only person's world: one file, no money in it.
     ⚠ orders/, revisions/, signatures/ and agreements/ are not requested — not
     requested and refused, NOT REQUESTED. The relay would refuse them anyway;
     this makes the page agree with the relay instead of relying on it. */
  function loadCompanyHours(slug) {
    return R.read(keyFor(slug), 'orders-public/' + slug + '.json').then(function (r) {
      var F = r.data || {};
      F.slug = F.slug || slug;
      F.orders = F.orders || [];
      F.people = F.people || [];
      F.letters = [];
      F.signers = { order: {} };
      return { slug: slug, sha: r.sha, F: F, local: {}, executed: {},
               sigSha: null, sigs: [], revisions: [], hoursOnly: true };
    }).catch(function (e) {
      if (e && (e.status === 404 || e.missing)) {
        var m = new Error('The hours copy for this company has not been published yet. ' +
          'Jonna publishes it from Company Details.');
        m.missing = true;
        throw m;
      }
      throw e;
    });
  }

  /* ---- writing a revision ------------------------------------------------
     Appends one record.  parentSha travels with the save and a 409 re-reads and
     re-applies, exactly as a signature does, so two people revising different
     orders in the same minute do not overwrite each other. */
  function addRevision(slug, record) {
    return R.update(keyFor(slug), 'revisions/' + slug + '.json', function (cur) {
      var next = JSON.parse(JSON.stringify(cur || {}));
      next.company = next.company || slug;
      next.revisions = (next.revisions || []).concat([record]);
      return next;
    }, 'revised ' + record.order, { revisions: [] });
  }
  /* Write the hours copy for one company. ⚠ Built from the file as the page
     has it — revisions and company details already merged — so what a
     facilitator reads is the current truth, minus the money. */
  function publishHoursCopy(slug, F) {
    var body = hoursCopy(F);
    return R.update(keyFor(slug), 'orders-public/' + slug + '.json', function () { return body; },
      'hours copy: ' + (F.company || slug), {});
  }
  function loadAll(slugs) { return Promise.all(slugs.map(loadCompany)); }

  /* ---- writing a signature ---------------------------------------------
     One record per order.  Each carries the id AND the content it accepted, so
     an order edited afterwards shows as changed rather than silently
     re-accepted.  parentSha travels with every save; a 409 re-reads, applies
     the same records to the fresh copy, and saves again.                    */
  function addSignatures(slug, records, note) {
    return R.update(keyFor(slug), 'signatures/' + slug + '.json', function (cur) {
      var next = JSON.parse(JSON.stringify(cur));
      next.signatures = (next.signatures || []).concat(records);
      return next;
    }, note || 'signatures added');
  }
  /* ---- the nudge outbox -------------------------------------------------
     Nothing on this page can send an email.  What it can do is write the
     nudge somewhere small and precise that something else watches:
     notify/<company>.json changes ONLY when an order stops — a question, a
     hold, or an order that changed after it was accepted.  The signatures file
     changes on every one of the 57 acceptances, so watching that would be
     noise; watching this is not.

     This is not storing something that can be worked out.  WHAT happened is
     derivable from the signatures; whether it has been SENT is not, and that
     is what `sent` is for.  See NOTIFY.md for what Perry wires to it. */
  function notify(slug, notice) {
    return R.update(keyFor(slug), 'notify/' + slug + '.json', function (cur) {
      var next = JSON.parse(JSON.stringify(cur || {}));
      next.company = next.company || slug;
      next.notices = (next.notices || []).concat([notice]);
      return next;
    }, 'nudge: ' + notice.kind).catch(function (e) {
      // a nudge that cannot be filed must never lose the thing it is about —
      // the question and the hold are already saved by this point
      console.warn('notice not filed', e && e.status);
    });
  }
  function notice(kind, o, company, who, said) {
    return {
      kind: kind, orderId: o.id, order: o.subject, company: company,
      who: who, said: said, raisedOn: new Date().toISOString(),
      forAttentionOf: 'jcritchley@mismo.org', sent: false, sentOn: null
    };
  }

  /* Decision 33 (b).  The hash says WHETHER something changed; it cannot say
     what was agreed.  So the whole order as it stood on the screen travels with
     the signature, and "what did this company accept" is answered with the
     document rather than with sixteen hex characters. */
  function snapshotOf(o) {
    var copy = {};
    Object.keys(o).forEach(function (k) {
      if (k === 'status' || k === 'monthly') return;   // volatile, and internal
      copy[k] = o[k];
    });
    return copy;
  }

  function signature(step, decision, o, extra) {
    var rec = {
      orderId: o.id,
      step: step,
      decision: decision,
      contentHash: o.contentHash,          // the binding terms
      recordHash: o.recordHash,            // the whole order, for amendment detection
      rev: o.rev || 0,                     // which revision of it was signed for
      contentAccepted: o.contentSummary,   // the one line, for a list
      orderAccepted: snapshotOf(o),        // the evidence
      signedOn: new Date().toISOString()
    };
    Object.keys(extra || {}).forEach(function (k) { rec[k] = extra[k]; });
    return rec;
  }

  /* =========================================================================
   * The contracting company's view
   * ======================================================================= */
  /* ⚠ Decision 26: a facilitator sees HOURS and never money.  Not the rate, not
     the maximum fee, not a total — and not the order document either, because
     the rate is written on it.  The maximum fee is held back for the same
     reason the rate is: fee divided by hours IS the rate. */
  /* ⚠ THE RATE GATE. Read this before changing anything below it.
     This used to be `VIEWAS && VIEWAS.role === 'facilitator'` — which meant
     decision 26 was enforced ONLY while Jonna was driving somebody's screen in
     View As. A real person signing in with their own account has no VIEWAS, so
     the test was false and EVERY contracting-company account was handed the
     signer's screen: rates, maximum fees, the fiscal-year total and the order
     document itself, which has the rate written on it. The training simulation
     obeyed the rule the live screen did not.

     It now fails CLOSED. Money is shown only to somebody positively identified
     as the order signer, or explicitly given fullAccess. An account the people
     list does not recognise, a file that will not load, a signer with no email
     recorded — every one of those reads as a facilitator and sees hours only.
     The cost of the cautious answer is a signer who has to be identified
     properly; the cost of the permissive one is a contractor reading another
     firm's rates. */
  var REALROLE = 'facilitator';       // until the company file proves otherwise

  function roleFor(F, me, slug) {
    /* ⚠ The key wins over the data, always. An hours-only key cannot reach a
       rate whatever any file says, so the screen must not pretend otherwise —
       and a tampered or stale hours copy claiming fullAccess must not promote
       anybody. */
    if (slug && onLiteKey(slug)) return 'facilitator';
    if (F && F.hoursOnly) return 'facilitator';
    if (!F || !me) return 'facilitator';
    var signer = (F.signers || {}).order || {};
    var myEmail = String(me.email || '').toLowerCase().trim();
    var sgEmail = String(signer.email || '').toLowerCase().trim();
    /* Email first: it is the thing the sign-in is actually keyed on. */
    if (myEmail && sgEmail && myEmail === sgEmail) return 'signer';
    /* Name second, and only as a fallback — the signer's email is not always
       recorded, and locking the signer out of accepting their own orders is a
       real cost. Names here come from a curated five-company list, not from
       anything a contractor can type. */
    var myName = String(me.name || '').toLowerCase().trim();
    var sgName = String(signer.name || '').toLowerCase().trim();
    if (myName && sgName && myName === sgName) return 'signer';
    /* Explicitly granted, person by person, in Company Details. */
    var pr = personFor(F, me);
    if (pr && pr.fullAccess) return 'signer';
    return 'facilitator';
  }

  /* ⚠ ONE computation, for the live screen and for View As alike.
     This used to read VIEWAS.role when viewing as somebody — a SECOND opinion,
     worked out by the chooser rather than by the rule. That is precisely how
     the rate leak hid: the training screen obeyed decision 26 and the live
     screen did not, so checking it in View As proved nothing.
     View As now derives the role from the person being viewed, exactly as
     their own sign-in would. If the two could ever differ, View As would be
     worth nothing as a check. */
  function isFac() { return REALROLE !== 'signer'; }

  function contractorView() {
    busy();
    REALROLE = 'facilitator';         // ⚠ reset first: never inherit the last screen's answer
    loadCompany(who().slug).then(function (C) {
      var F = C.F, sigs = C.sigs;
      /* ⚠ Decided ONCE, here, before a single row is built — from who() , which
         is the person being viewed in View As and the signed-in person
         otherwise. Every isFac() call below reads this answer. */
      REALROLE = C.hoursOnly ? 'facilitator' : roleFor(F, who(), C.slug);
      var st = {};
      F.orders.forEach(function (o) { st[o.id] = statusOf(o, sigs); });
      /* Alphabetical, like every other list of orders. ⚠ Sorted ONCE, here, so
         the bulk-accept list, the tick count and the rows underneath are all in
         the same order — sorting them separately would have the sixth tick box
         accept a different order from the sixth row. */
      var toReview = F.orders.slice().sort(function (a, b) {
        return String(a.subject || '').localeCompare(String(b.subject || ''),
          undefined, { sensitivity: 'base', numeric: true });
      }).filter(function (o) {
        return st[o.id].key === 'sent' || st[o.id].key === 'changed';
      });

      /* ---- To Review ---------------------------------------------------- */
      var review;
      if (!toReview.length) {
        review = '<p class="empty">Nothing is waiting for you. Everything MISMO has sent has been ' +
          'dealt with — <b>My Service Orders</b> below has all of them with their status.</p>';
      } else {
        var toReviewTotal = feeTotal(toReview);
        review =
          '<p class="lede">Read each one, tick the ones you accept, and accept them together. ' +
          'Set aside anything you have a question about — it is never swept up by the button.</p>' +
          '<div class="tot"><span class="tot-l">Waiting for You</span>' +
          '<span class="tot-v">' + feeWords(toReviewTotal) + '</span></div>' +
          '<div class="tbl"><table><thead><tr>' +
          '<th class="tick"><input type="checkbox" id="qall" aria-label="Tick every order"></th>' +
          '<th>Service Order</th><th class="n hide-narrow">Rate</th>' +
          '<th class="n hide-narrow">Hours</th>' +
          '<th class="n">Maximum Fee</th><th class="hide-narrow">Status</th></tr></thead><tbody>' +
          toReview.map(function (o) {
            return '<tr><td class="tick"><input type="checkbox" class="qtick" data-id="' + esc(o.id) + '"></td>' +
              '<td>' + esc(o.subject) + '</td>' +
              '<td class="n hide-narrow">' + (o.hourlyRate ? money(o.hourlyRate) : '—') + '</td>' +
              '<td class="n hide-narrow">' + (o.estimatedHours || '—') + '</td>' +
              '<td class="n">' + (feeLabel(o)) + '</td>' +
              '<td class="hide-narrow">' + pill(st[o.id]) + '</td></tr>';
          }).join('') + '</tbody></table></div>' +
          '<div class="ackbar">' +
          '<div class="f"><label for="ackname">Type Your Name to Accept</label>' +
          '<input id="ackname" type="text" autocomplete="off" placeholder="' + esc(F.signers.order.name) + '"></div>' +
          '<div class="f"><label for="acktitle">Title</label>' +
          '<input id="acktitle" type="text" value="' + esc(F.signers.order.title) + '"></div>' +
          '<button class="gobtn" type="button" id="qgo" disabled>Accept the Ticked Orders</button>' +
          '<span class="qc" id="qc">Nothing ticked yet</span></div>' +
          '<p class="fineprint">Accepting records your name, the date and time, and exactly what you ' +
          'accepted. Once an order is accepted it is locked — a change after that is a Modification, ' +
          'not an edit.</p>' +
          '<h3 class="subh">Read Them Here</h3>' +
          '<div class="rows">' + toReview.map(function (o) { return reviewRow(F, o, st[o.id]); }).join('') + '</div>';
      }

      /* ---- My Service Orders -------------------------------------------- */
      /* Decision 31 — the fiscal-year picker.  FY 2027 is the first year the
         system holds, so today there is nothing to choose between and the page
         says so plainly instead of showing a dropdown with one entry in it.
         The moment a second year is generated this becomes a chooser and the
         total follows it. */
      var years = {};
      F.orders.forEach(function (o) { years[o.fiscalYear || F.fiscalYear] = 1; });
      var yearList = Object.keys(years).sort();
      /* Default to the year the file is FOR, not the last one in the list.
         FY 2028 orders can exist long before FY 2028 starts, and a company
         opening the page should land on the year it is working in. */
      var pickedYear = ISS_YEAR
        || (years[F.fiscalYear] ? F.fiscalYear : null)
        || yearList[0] || F.fiscalYear;
      var yearOrders = yearList.length > 1
        ? F.orders.filter(function (o) { return (o.fiscalYear || F.fiscalYear) === pickedYear; })
        : F.orders;
      var yearTotal = feeTotal(yearOrders);

      /* ---- the facilitator's rate-free list (decision 26) ----------------
         ⚠ Built as its OWN markup rather than the signer's list with the money
         columns hidden.  A hidden column is a style; this is a screen that
         never has the figure in it at all — which is the difference between a
         rule and a hope, because the leak would be a character, not a layout. */
      function facListHtml() { return '<p class="lede">Every service order you can log time against this fiscal year, ' +
        'and how much of each one is left.</p>' +
        '<div class="tot"><span class="tot-l">This Fiscal Year, ' + esc(pickedYear || '') + '</span>' +
        '<span class="tot-v">' + facHours(yearOrders, HRS.files) + '</span></div>' +
        '<p class="fineprint">Every order you may work on this fiscal year. One added later in the ' +
        'year lands in these figures too. MISMO\u2019s fiscal year runs 1 October to 30 September.</p>' +
        '<div class="tbl"><table><thead><tr><th>Service Order</th>' +
        '<th class="n">Allotted</th><th class="n">Used</th><th class="n">Remaining</th>' +
        '<th style="width:150px">Of the Order</th></tr></thead><tbody>' +
        yearOrders.map(function (o) {
          var tot = Number(o.estimatedHours) || 0;
          var used = H.usedOnOrder(HRS.files || [], o.id);
          var pct = tot ? Math.min(100, 100 * used / tot) : 0;
          var cls = pct > 90 ? 'over' : pct > 70 ? 'hot' : '';
          return '<tr><td>' + esc(o.subject) + '</td>' +
            '<td class="n">' + (tot ? hrs(tot) : '\u2014') + '</td>' +
            '<td class="n">' + hrs(used) + '</td>' +
            '<td class="n">' + (tot ? hrs(tot - used) : '\u2014') + '</td>' +
            '<td><div class="meterwrap"><span class="meter"><i class="' + cls +
            '" style="width:' + pct.toFixed(0) + '%"></i></span>' +
            '<span class="fineprint">' + pct.toFixed(0) + '%</span></div></td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<div class="note"><b>No money on this screen, and no way to work it out.</b> A facilitator ' +
        'sees hours only \u2014 no rate, no maximum fee, and no order to open, because the order itself ' +
        'carries the rate. <b>The maximum fee is held back for the same reason:</b> fee divided by ' +
        'hours is the rate.</div>' +
        '<p class="fineprint"><b>The bar is the whole order, not one person\u2019s share.</b> When ' +
        'several people cover the same order, each of them needs to see how much of it is left \u2014 ' +
        'that is what stops an overrun turning up on an invoice.</p>'; }

      /* ---- the signed copies -------------------------------------------
         ⚠ Only executed orders appear here, and only on a SIGNER's screen.  A
         facilitator's list is built separately and carries no document at all,
         because the order itself has the rate written on it (decision 26).
         An order that is not executed has no signed copy to download \u2014 saying
         "download" before both signatures exist would be offering a document
         that does not yet mean anything. */
      /* ⚠ A FUNCTION, so it is never run for a facilitator.
         This block was built unconditionally and then not shown — which meant
         P.orderDoc ran for everybody, and the order document is the one thing
         decision 26 holds back hardest, because the rate is written on it. On
         an hours-only sign-in it also threw outright: the rate-free file has no
         MISMO signer on it, because a facilitator never needs one.
         Not showing something is a layout. Not building it is the rule. */
      function signerOrdersHtml() {
      var executed = yearOrders.filter(function (o) { return st[o.id].key === 'executed'; });
      var signedBlockHtml = '';
      if (executed.length) {
        signedBlockHtml =
          '<div class="signedbox">' +
          '<h4 class="subh">Your Signed Service Orders</h4>' +

      return signedBlockHtml +
        '<p class="lede">Every service order MISMO has raised for you this fiscal year, ' +

        '<div class="tot"><span class="tot-l">' +
          (yearList.length > 1
            ? 'Fiscal Year</span><span class="tot-v"><select id="fy-pick" aria-label="Which fiscal year">' +

            : 'This Fiscal Year, ' + esc(pickedYear || '') + '</span><span class="tot-v">' + feeWords(yearTotal)) +
        '</span></div>' +
        /* \u26a0 The line that used to sit here said the same thing as the lede
           three lines above it \u2014 "every order raised for you this fiscal year"
           twice, around a figure that already carries the label. It is gone.
           The fiscal-year dates live on the band's own label. */
        '<div class="hqrows">' + yearOrders.slice().sort(function (a, b) {
          /* Alphabetical, the same as everywhere else an order is listed. */
          return String(a.subject || '').localeCompare(String(b.subject || ''),
            undefined, { sensitivity: 'base', numeric: true });
        }).map(function (o) {
          var body =
            '<div class="fields">' +
            fld('Status', st[o.id].label) +
            fld('Hourly Rate', o.hourlyRate ? money(o.hourlyRate) : 'Paid per review', 1) +
