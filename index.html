            fld('Maximum Fee', feeLabel(o, 1), 1) +
            fld('Runs', o.startDate + ' to ' + o.endDate) +
            fld('Master Services Agreement', o.msaFlavour) +
            '</div>' + signedBlock(st[o.id]) +
            '<div class="dochost" id="d-' + esc(o.id) + '">' + P.orderDoc(F, o) + '</div>' +
            (st[o.id].key === 'executed' ? P.printBtn('d-' + o.id, o.subject) : '') +
            signaturePreview(F, st[o.id]);
          return panelRow('ord-' + o.id, o.subject, o.msaFlavour + ' \u00b7 ' +
            o.startDate + ' to ' + o.endDate,
            (feeLabel(o)), body, pill(st[o.id]));
        }).join('') + '</div>';
      }
      var all = isFac() ? '' : signerOrdersHtml();

      /* ---- My Agreements -------------------------------------------------
         ⚠ Not even REQUESTED for a facilitator. An hours-only key cannot read
         agreements/ and the relay would refuse it; asking anyway would be this
         page disagreeing with the rule it is supposed to enforce. */
      var agreements = isFac()
        ? Promise.resolve([])
        : R.read(keyFor(who().slug), 'agreements/' + who().slug + '.json')
            .then(function (a) { return a.data.agreements || []; })
            .catch(function () { return []; });

      agreements.then(function (exec) {
        var byFlavour = {};
        exec.forEach(function (e) { byFlavour[e.msaFlavour] = e; });
        var ag = isFac() ? '' :
          '<p class="lede">Your Master Services Agreement extensions. MISMO sends each one ' +
          'through DocuSign; once it is executed the signed copy appears here and stays.</p>' +
          '<div class="hqrows">' + F.letters.map(function (l) {
            var e = byFlavour[l.msaFlavour];
            var body =
              '<div class="fields">' +
              fld('Agreement Signed', l.msaEffectiveDate) +
              fld('Expires Without This Letter', l.extendFrom) +
              fld('This Letter Extends It To', l.extendTo) +
              fld('Signed for ' + l.company + ' by', l.signer.name + ' \u2014 ' + l.signer.title) +
              fld('Signed for MISMO by', F.mismoSigner.name + ' \u2014 ' + F.mismoSigner.title) +
              (e ? fld('Executed On', e.executedOn) + fld('DocuSign Envelope', e.envelopeId) : '') +
              '</div>' +
              /* ⚠ A button, not a link, and it reads `file` — which is the field
                 the filing actually writes. The old anchor read `href`, a field
                 nothing has ever set, so it always fell back to "#" and did
                 nothing when clicked. Even with the right value it could not
                 have worked: these PDFs are in a private repository and only
                 the relay can fetch one. */
              (e && e.file
                ? '<div class="printrow"><button class="printbtn dlfile" type="button"' +
                  ' data-slug="' + esc(who().slug) + '" data-path="' + esc(e.file) +
                  '" data-name="' + esc(l.company + ' - ' + l.msaFlavour + ' MSA Extension (Executed).pdf') +
                  '"><svg viewBox="0 0 24 24" aria-hidden="true">' +
                  '<path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>Download the Signed PDF</button>' +
                  '<span class="fineprint">The executed copy, with its Certificate of Completion, ' +
                  'is the record.</span></div>'
                : e
                  ? '<p class="fineprint">Recorded as executed on ' + esc(e.executedOn) +
                    ', but no file is attached to it.</p>'
                  : '') +
              '<div class="dochost" id="l-' + esc(l.id) + '">' + P.letterDoc(F, l) + '</div>' +
              P.printBtn('l-' + l.id, l.company + ' \u2014 ' + l.msaFlavour + ' MSA Extension');
            return panelRow('agr-' + l.id, l.msaFlavour + ' Master Services Agreement',
              'Signed by ' + l.signer.name, 'Extends to ' + esc(l.extendTo), body,
              e ? '<span class="pill good">Executed</span>'
                : '<span class="pill">Awaiting Signature</span>');
          }).join('') + '</div>';

        whoEl.innerHTML = esc(who().name) + ' <i>·</i> ' + esc(F.company);
        /* ---- hours -------------------------------------------------------
           The person record is what says whether this account logs time and
           against which orders.  ⚠ An account with no record is NOT quietly
           attached to somebody else's hours — it simply sees no hours
           sections, and Help says who to ask. */
        var person = loggingPerson(F, who());
        var fy = F.fiscalYear || 'FY 2027';
        HCTX = person ? { C: C, person: person, fy: fy } : null;
        var hoursBits = Promise.resolve('');
        if (person) {
          hoursBits = loadHours(C.slug, F, fy).then(function (files) {
            var mine = null;
            files.forEach(function (f) { if (f && f.slug === person.slug) mine = f; });
            if (!mine) { mine = H.emptyFile(person, fy); files = files.concat([mine]); }
            HRS.files = files; HRS.mine = mine; HRS.person = person;
            /* ⚠ Somebody who logs no time does not get a personal hours screen.
               Four of the fourteen people manage their company's time without
               logging any of their own, and an empty My Hours reading "no
               service order is set up for you" was noise on every one of their
               screens — Jonna, 29 September.  What a time manager gets instead
               is the one screen that IS their job.
               (No names here: this file is served from a PUBLIC repository.) */
            var logs = logsTime(F, person);
            return (logs
              ? sect('My Hours', null, hoursSection(C, person, fy, mine, files), true) +
                sect('My Submitted Time', (mine.weeks || []).length,
                     submittedSection(C, person, fy, mine))
              : '') +
              (person.timeManager
                ? sect('The Company\u2019s Month', null, monthSection(C, fy, files), !logs) : '');
          }).catch(function (e) {
            if (window.console && console.warn) console.warn('hours', e);
            return sect('My Hours', null,
              '<div class="note"><b>Your hours could not be read just now.</b> Nothing has been lost ' +
              '\u2014 this is the page failing to fetch them, not your time going missing. Reload, and ' +
              'tell Jonna if it keeps happening.</div>');
          });
        }

        hoursBits.then(function (hb) {
          /* ⚠ A facilitator's screen DROPS To Review and My Agreements rather
             than showing them empty: they do not accept orders and they do not
             sign the MSA, and both of those screens carry fees. */
          say(isFac()
            ? hb +
              sect('My Service Orders', yearOrders.length, facListHtml()) +
              sect('Help', null, helpFor('facilitator', F))
            : sect('To Review', toReview.length, review) +
              hb +
              sect('My Service Orders', yearOrders.length, all) +
              sect('My Agreements', F.letters.length, ag) +
              sect('Help', null, helpFor('contractor', F))
          );
          if (!isFac()) wireReview(C, st, toReview);
          wireSigned(C, F);
          /* Both: the agreements sit in rows that open on the right, so the
             button does not exist until the panel does. */
          onPanelOpen(wireDownloads);
          wireDownloads(document);
          if (person) wireHours(C, person, fy);
          var fyEl2 = document.getElementById('fy-pick');
          if (fyEl2) fyEl2.addEventListener('change', function () {
            ISS_YEAR = fyEl2.value; contractorView();
          });
        });
      });
    }).catch(closed);
  }

  /* =========================================================================
   * HOURS — My Hours, My Submitted Time, and the company's month
   *
   * Storage: hours/<person>-fy2027.json inside the company's own private
   * repository, one file per person per fiscal year.  ⚠ Records go in
   * BUNDLES, never one document per record: a year of weeks is one file, read
   * in one request and saved in one commit.
   *
   * What a stored row carries: hours, the two notes, the health flag, and —
   * only where somebody covered for a colleague — the split.  It does NOT
   * carry the order's name, its weekly pace, a balance or any total.  Every
   * one of those is worked out in hours.js from the order itself.
   * ======================================================================= */
  var HRS = { files: null, mine: null, sha: null, person: null, month: null, week: null };
  /* Who the hours screens are for, kept so a save can redraw them without
     working the answer out a second time. */
  var HCTX = null;

  function fyKey(fy) { return 'fy' + String(fy).replace(/\D+/g, ''); }
  function hoursPath(person, fy) { return 'hours/' + person.slug + '-' + fyKey(fy) + '.json'; }

  /* Which person record belongs to the signed-in account.  Email is the key
     where MISMO has set one; where it has not, the name the relay returns at
     sign-in is matched exactly.  ⚠ Nothing is guessed from an address: an
     account with no matching record logs no time and is told so plainly,
     rather than being quietly attached to somebody else's hours. */
  function personFor(F, me) {
    var list = F.people || [];
    var email = String(me.email || '').toLowerCase();
    var i;
    for (i = 0; i < list.length; i++) {
      if (list[i].email && String(list[i].email).toLowerCase() === email) return list[i];
    }
    for (i = 0; i < list.length; i++) {
      if (String(list[i].name).toLowerCase() === String(me.name || '').toLowerCase()) return list[i];
    }
    return null;
  }
  /* ⚠ A matched record that has been retired is NOT treated as a live person.
     Their history stays readable; what stops is logging new time against it. */
  function loggingPerson(F, me) {
    var p = personFor(F, me);
    if (!p) return null;
    /* Judged against the week they would be logging, for the reason in
       colleagues() above — today can be before the fiscal year starts. */
    var wk = H.parse(H.weekFor(F.fiscalYear || 'FY 2027', new Date()));
    return active(p, wk) ? p : null;
  }

  /* Everybody's file for one company.  ⚠ Needed even by a person logging only
     their own time, because an order's REMAINING hours is everyone's total —
     and a contractor who sees only their own contribution cannot tell whether
     the order is close to its maximum.  That is how an overrun first shows up
     on an invoice instead of on this page. */
  function loadHours(slug, F, fy) {
    var people = (F.people || []).filter(function (p) { return logsTime(F, p); });
    return Promise.all(people.map(function (p) {
      return R.readOr(keyFor(slug), hoursPath(p, fy), null)
        .then(function (r) { return r.data || H.emptyFile(p, fy); });
    }));
  }

  /* Somebody who has left.  ⚠ Their record is RETIRED, never deleted — their
     name is on historic orders and weekly rows, and removing it would orphan
     every one of them.  What retiring does is take them out of the lists the
     page offers TODAY: they are not a colleague hours can be split to, and
     they are not expected to submit a week. */
  function active(p, on) {
    if (!p) return false;
    var when = on || new Date();
    var end = p.activeTo && H.parse(p.activeTo);
    if (end && when > end) return false;
    /* Somebody added mid-year does not become a colleague until they start —
       the same mechanism, run the other way. */
    var start = p.activeFrom && H.parse(p.activeFrom);
    if (start && when < start) return false;
    return true;
  }
  /* ⚠ Active is judged against the WEEK BEING LOGGED, never against today.
     Everybody's activeFrom is the first day of the fiscal year, so judging by
     today would make every person inactive for the whole of the run-up to
     1 October — the page would empty itself and look broken on exactly the
     days Jonna is handing the accounts out. */
  function colleagues(F, me, on) {
    return (F.people || []).filter(function (p) {
      return p.name !== me && active(p, on);
    });
  }

  /* The fiscal-year band on a facilitator's screen.  ⚠ Hours, never a fee —
     the signer's band says dollars and this one must not, or decision 26 leaks
     through the one line nobody thinks of as a figure. */
  function facHours(orders, files) {
    var tot = 0, used = 0, n = 0;
    (orders || []).forEach(function (o) {
      var t = Number(o.estimatedHours) || 0;
      if (!t) return;
      tot += t; used += H.usedOnOrder(files || [], o.id); n++;
    });
    if (!n) return 'No hours on these orders';
    return hrs(tot - used) + ' hours left of ' + hrs(tot) + ' across ' + n +
      ' order' + (n === 1 ? '' : 's');
  }

  /* One step of the pipeline on a company card.  ⚠ A step with nothing in it is
     shown greyed rather than hidden, so the five cards line up and the shape of
     the pipeline reads the same on every one of them. */
  /* Health as a colour, with the word beside it for anybody who cannot rely on
     one — a dot alone is not a label. */
  var HEALTH_TONE = { Green: 'g', Yellow: 'y', Red: 'r', 'N/A': 'na' };
  function healthDot(v) {
    if (!v) return '<span class="hdot none" aria-hidden="true"></span>';
    if (v === 'N/A') return '<span class="hdot na" title="N/A">N/A</span>';
    return '<span class="hdot ' + HEALTH_TONE[v] + '" title="' + esc(v) + '"></span>';
  }

  function stepChip(label, n) {
    return '<span class="stp' + (n ? '' : ' none') + '"><i>' + n + '</i>' + esc(label) + '</span>';
  }

  function orderById(F, id) {
    for (var i = 0; i < F.orders.length; i++) if (F.orders[i].id === id) return F.orders[i];
    return null;
  }
  function hrs(v) { return (Math.round((Number(v) || 0) * 100) / 100).toFixed(2); }

  /* ---- My Hours -----------------------------------------------------------
     The week you are in, as a LIST.  Each order opens on the right, where the
     notes have room and nothing has to be scrolled past.

     ⚠ The week is submitted as a whole, so the values cannot live in the panel:
     it shows one order at a time and closing it would take that order's entry
     with it.  HRS.draft is the working copy every screen reads and writes, and
     the panel edits into it.  Nothing closes over unsaved work without asking. */
  function seedDraft(mine, ending, wk, back) {
    var d = H.draftFor(mine, ending);
    var rows = wk ? H.rowsOf(wk)
      : back ? H.rowsOf(back)
      : (d ? (d.rows || {}) : {});
    HRS.draft = JSON.parse(JSON.stringify(rows));
    HRS.draftWeek = ending;
    HRS.dirty = false;
  }
  function dRow(id) {
    if (!HRS.draft[id]) HRS.draft[id] = { hours: 0 };
    return HRS.draft[id];
  }
  function draftClean() {
    /* What actually gets saved: rows with nothing in them are dropped, so an
       order somebody opened and closed again leaves no trace. */
    var out = {};
    Object.keys(HRS.draft || {}).forEach(function (id) {
      var r = HRS.draft[id];
      var has = Number(r.hours) || (r.thisWeek || '').trim() || (r.upcoming || '').trim() ||
        r.health || (r['for'] || []).length;
      if (has) out[id] = r;
    });
    return out;
  }

  function hoursSection(C, person, fy, mine, files) {
    var F = C.F;
    var today = new Date();
    var ending = HRS.week || H.weekFor(fy, today);
    var wk = H.weekIn(mine, ending);
    if (wk && wk.state === 'returned') wk = null;
    var back = H.weekIn(mine, ending);
    back = back && back.state === 'returned' ? back : null;
    var sent = !!wk;
    var st = wk ? H.stateOf(wk) : null;

    if (HRS.draftWeek !== ending || !HRS.draft) seedDraft(mine, ending, wk, back);

    /* ⚠ Own first, then the cover, each alphabetical. A person opening their
       week sees their own lines where they always are, with everything they
       may pick up underneath — rather than one merged list that reorders
       itself as soon as somebody else's order is added. */
    var split = ordersForPerson(F, person, fy);
    var showAll = HRS.showAll == null ? !split.own.length : HRS.showAll;
    if (!split.cover.length) showAll = false;
    var orders = showAll ? split.all : (split.own.length ? split.own : split.all);
    var OWN = {}; split.own.forEach(function (o) { OWN[o.id] = 1; });
    HRS.orders = orders; HRS.own = OWN; HRS.split = split; HRS.showAll = showAll;
    HRS.C = C; HRS.fy = fy; HRS.person = person;
    HRS.sent = sent; HRS.files = files;

    if (!orders.length) {
      return '<p class="empty"><b>No service order is set up for you to log time against.</b> ' +
        'If that is wrong, <b>email Jonna Critchley</b> at ' +
        '<a href="mailto:jcritchley@mismo.org">jcritchley@mismo.org</a>.</p>';
    }

    var total = orders.reduce(function (a, o) {
      return a + (Number((HRS.draft[o.id] || {}).hours) || 0); }, 0);
    var strad = H.straddle(fy, ending);

    /* ---- weeks still owed ------------------------------------------------
       ⚠ Decision 40, 5 October.  My Hours used to open the week you were in
       and nothing else, so a missed week was unreachable and the only thing a
       person could do was put those hours on the current week — landing them
       on the wrong month's invoice.  Any week whose month has not been
       invoiced can be opened from here. */
    var owed = H.openWeeks(fy, mine, files, function (d) { return active(person, d); }, today)
      .filter(function (e) { return e !== ending; });
    var shut = H.shutWeeks(fy, mine, files, function (d) { return active(person, d); }, today);

    var owedBand = '';
    if (owed.length) {
      owedBand = '<div class="owed"><div class="owed-h">' +
        '<span class="owed-n">' + owed.length + '</span>' +
        '<span>' + (owed.length === 1 ? 'An earlier week is still open'
                                      : owed.length + ' earlier weeks are still open') +
        '</span></div>' +
        '<div class="owedrows">' + owed.map(function (e) {
          var w = H.weekIn(mine, e);
          var sentBack = w && w.state === 'returned';
          return '<div class="owedrow">' +
            '<span class="owed-w">Week Ending ' + esc(e) + '</span>' +
            '<span class="owed-s">' + esc(H.weekSpan(fy, e)) + '</span>' +
            (sentBack ? '<span class="pill bad">Sent Back to You</span>'
                      : '<span class="pill warn">Not Submitted</span>') +
            '<button class="gobtn ghost" type="button" data-wkfix="' + esc(e) + '">' +
            (sentBack ? 'Correct This Week' : 'Log This Week') + '</button></div>';
        }).join('') + '</div>' +
        '<p class="fineprint">Opening one brings it up here with whatever you had already saved in ' +
        'it. <b>Hours go on the invoice for the month the week falls in</b>, not the month you ' +
        'type them \u2014 so a week logged late still lands in the right place.</p></div>';
    }
    if (shut.length) {
      var shutMonths = [];
      shut.forEach(function (w) {
        if (shutMonths.indexOf(w.month) < 0) shutMonths.push(w.month);
      });
      owedBand += '<div class="note"><b>' + shut.length + ' earlier ' +
        (shut.length === 1 ? 'week has' : 'weeks have') + ' closed.</b> ' +
        esc(shutMonths.join(' and ')) + ' ' + (shutMonths.length === 1 ? 'has' : 'have') +
        ' been invoiced, so ' + (shut.length === 1 ? 'that week does' : 'those weeks do') +
        ' not reopen \u2014 a correction goes on the next period. If something is missing, ' +
        '<b>email Jonna Critchley</b> at ' +
        '<a href="mailto:jcritchley@mismo.org">jcritchley@mismo.org</a>.</div>';
    }

    var head = owedBand +
      '<p class="lede">The week you are in. <b>Choose a service order to enter it</b> — ' +
      'it opens on the right, with room for the notes.</p>' +
      '<div class="tot"><span class="tot-l">Week Ending ' + esc(ending) + '</span>' +
      '<span class="tot-v">' + hrs(total) + ' hours</span></div>' +
      (HRS.week && HRS.week !== H.weekFor(fy, today)
        ? '<div class="note warn"><b>This is not the week you are in.</b> You are ' +
          (sent ? 'looking at' : back ? 'correcting' : 'logging') + ' an earlier week' +
          ' \u2014 anything you enter goes on the <b>' +
          esc(H.monthLabel(H.monthOf(ending))) + '</b> invoice, not this month\u2019s. ' +
          '<button class="lnk" type="button" id="h-now">Go back to this week</button></div>'
        : '') +
      /* ⚠ The date range and "weeks end on a Friday" are gone: the band directly
         above already says WEEK ENDING and the date, and the week endings are
         all Fridays, which is visible from the dates themselves. What is left
         here is the one thing that is NOT obvious — a week that straddles a
         month end and therefore splits across two invoices. */
      (strad
        ? '<p class="fineprint"><b>This one crosses a month end</b>, so it is split between two ' +
          'invoices — ' + esc(strad.firstDays) + ' goes on the ' + esc(strad.firstMonth) +
          ' invoice and ' + esc(strad.lastDays) + ' on the ' + esc(strad.lastMonth) +
          ' one. Each order asks how many of its hours fell in ' + esc(strad.firstMonth) + '.</p>'
        : '');

    var state = back
      ? '<div class="wkstate bad"><span class="wk-l">Sent Back to You</span>' +
        '<span class="wk-d">MISMO has sent this week back for you to correct.</span></div>' +
        '<div class="note"><b>Why it came back.</b> ' + esc(back.returnedWhy || 'No reason was given.') +
        '<br><span class="fineprint">Sent back ' + esc(stamp(back.returnedAt)) + '.</span></div>'
      : sent
      ? '<div class="wkstate ' + st.tone + '"><span class="wk-l">' + esc(st.label) + '</span>' +
        '<span class="wk-d">' + st.said + '</span></div>' +
        (wk.state === 'submitted'
          ? '<div class="issacts"><button class="tbtn" type="button" id="h-back">' +
            'Take It Back to Correct</button></div>'
          : '<p class="fineprint">This week has been ' + esc(st.label.toLowerCase()) +
            '. To change it, open <b>My Submitted Time</b> and ask for it to be returned.</p>')
      : '<div class="wkstate open"><span class="wk-l">Open</span>' +
        '<span class="wk-d">Not submitted yet. Nothing here has gone to MISMO.</span></div>';

    /* ⚠ Only offered when there IS cover to show. A company that does not
       cover for each other never sees this control at all. */
    var mineBar = split.cover.length
      ? '<div class="minebar">' +
        '<button class="mbtn' + (showAll ? '' : ' on') + '" type="button" data-mine="own">' +
        'Normally Mine <span class="mct">' + split.own.length + '</span></button>' +
        '<button class="mbtn' + (showAll ? ' on' : '') + '" type="button" data-mine="all">' +
        'Everything I Can Log <span class="mct">' + split.all.length + '</span></button>' +
        '<span class="fineprint">' +
        (showAll
          ? 'Your own orders are first; the rest are the ones you can cover.'
          : 'Showing only what is normally yours.') +
        '</span></div>'
      : '';

    var list = mineBar + '<div class="hqrows">' + orders.map(function (o) {
      var r = HRS.draft[o.id] || {};
      var logged = Number(r.hours) || 0;
      var tot = Number(o.estimatedHours) || 0;
      var used = H.usedOnOrder(files, o.id);
      var pct = tot ? Math.min(100, 100 * used / tot) : 0;
      var note = (r.thisWeek || '').trim();
      /* ⚠ Marked, not hidden. Somebody covering needs to see at a glance which
         lines are their own work and which are somebody else's. */
      var covering = split.cover.length && !OWN[o.id];
      return '<button class="hqrow hrow' + (covering ? ' covering' : '') +
        '" type="button" data-hrow="' + esc(o.id) + '">' +
        '<span class="t">' + esc(o.subject) +
        (covering ? ' <span class="pill cover">Cover</span>' : '') +
        (o.facilitator ? ' <span class="fac">' + esc(o.facilitator) + '</span>' : '') +
        '<small>' + (note ? esc(note.slice(0, 70)) + (note.length > 70 ? '…' : '')
                          : (logged ? 'No note yet' : 'Nothing entered')) +
        '</small></span>' +
        '<span class="r">' + (r.health ? healthDot(r.health) : '') +
        (pct > 90 ? '<span class="pill bad">' + pct.toFixed(0) + '% used</span>'
          : pct > 70 ? '<span class="pill warn">' + pct.toFixed(0) + '% used</span>' : '') +
        '<span class="d hnum-d">' + hrs(logged) + ' h</span>' +
        '<span class="arr">›</span></span></button>';
    }).join('') + '</div>';

    var acts = sent ? '' :
      '<div id="h-check"></div>' +
      '<div class="ackbar"><button class="gobtn ghost" type="button" id="h-save">' +
      'Save Without Sending</button>' +
      '<button class="gobtn" type="button" id="h-send">Submit This Week</button>' +
      '<span class="qc" id="h-msg"></span></div>' +
      '<p class="fineprint"><b>Saving keeps it here for you; submitting sends it to MISMO.</b> ' +
      'A week is never quietly edited — every submission, take-back and return is its own ' +
      'version, so what an invoice was raised against can always be shown.</p>';

    return head + state + list + acts;
  }

  /* One order's entry, as it appears in the panel. */
  function hoursPanel(o) {
    var C = HRS.C, fy = HRS.fy, person = HRS.person, sent = HRS.sent;
    var F = C.F;
    var ending = HRS.draftWeek;
    var r = HRS.draft[o.id] || {};
    var pace = H.perWeek(fy, o);
    var logged = Number(r.hours) || 0;
    var bal = pace - logged;
    var used = H.usedOnOrder(HRS.files || [], o.id);
    var tot = Number(o.estimatedHours) || 0;
    var pct = tot ? Math.min(100, 100 * used / tot) : 0;
    var cls = pct > 90 ? 'over' : pct > 70 ? 'hot' : '';
    var fors = r['for'] || [];
    var mates = colleagues(F, person.name, H.parse(ending));
    var strad = H.straddle(fy, ending);

    return '<div class="fields">' +
      '<div class="f narrow"><label for="ph-num">Hours This Week</label>' +
      '<input id="ph-num" class="phnum" type="number" min="0" step="0.25" value="' +
      (logged ? hrs(logged) : '') + '"' + (sent ? ' disabled' : '') + '></div>' +
      '<div class="f narrow"><label id="ph-hl">Health</label>' +
      '<div class="hpick" role="radiogroup" aria-labelledby="ph-hl">' +
      [['Green', 'g'], ['Yellow', 'y'], ['Red', 'r'], ['N/A', 'na']].map(function (v) {
        return '<button type="button" class="hbtn phhealth ' + v[1] +
          (r.health === v[0] ? ' on' : '') + '" data-health="' + esc(v[0]) + '" role="radio" ' +
          'aria-checked="' + (r.health === v[0] ? 'true' : 'false') + '"' +
          (sent ? ' disabled' : '') + '>' +
          /* N/A is a word, not a colour — it gets the word once, not twice. */
          (v[1] === 'na' ? '<span class="hna">N/A</span>'
            : '<span class="hd"></span><span class="hw">' + esc(v[0]) + '</span>') +
          '</button>';
      }).join('') + '</div></div>' +
      (strad
        ? '<div class="f narrow"><label for="ph-split">Of Those, in ' + esc(strad.firstMonth) +
          '</label><input id="ph-split" class="phsplit" type="number" min="0" step="0.25" value="' +
          (r.inFirstMonth != null ? hrs(r.inFirstMonth) : '') + '"' + (sent ? ' disabled' : '') +
          '></div>' : '') +
      '</div>' +
      (strad ? '<p class="fineprint">' + esc(strad.firstDays) + ' goes on the ' +
        esc(strad.firstMonth) + ' invoice; ' + esc(strad.lastDays) + ' on the ' +
        esc(strad.lastMonth) + ' one.</p>' : '') +
      '<div class="fields notes2">' +
      '<div class="f"><label for="ph-note">This Week</label>' +
      '<textarea id="ph-note" class="phnote" rows="6" placeholder="What you did"' +
      (sent ? ' disabled' : '') + '>' + esc(r.thisWeek || '') + '</textarea></div>' +
      '<div class="f"><label for="ph-up">Upcoming</label>' +
      '<textarea id="ph-up" class="phup" rows="6" placeholder="What is next"' +
      (sent ? ' disabled' : '') + '>' + esc(r.upcoming || '') + '</textarea></div>' +
      '</div>' +
      (mates.length && !sent
        ? '<div class="covwrap"><button class="lnk" type="button" id="ph-covtog">' +
          (fors.length ? 'Some of these hours were a colleague’s — edit the split'
                       : 'Did somebody else do some of these hours?') + '</button>' +
          '<div class="covbody' + (fors.length ? ' open' : '') + '">' +
          '<p class="fineprint">Name the colleague and how many of the hours were theirs. ' +
          'Whatever is left stays with you. Leave this alone on a normal week.</p>' +
          '<div class="covrows" data-covrows="' + esc(o.id) + '">' +
          (fors.length ? fors.map(function (f) { return covRow(o.id, mates, f); }).join('')
                       : covRow(o.id, mates, null)) +
          '</div><button class="lnk" type="button" data-covadd="' + esc(o.id) +
          '">Add Another Colleague</button></div></div>'
        : (fors.length
          ? '<div class="fields">' + fld('Hours Logged For',
              H.splitOf(r, person.name).map(function (x) {
                return x.person + ' ' + hrs(x.hours); }).join(' · ')) + '</div>'
          : '')) +
      '<div class="fields">' +
      fld('This Order’s Pace', pace ? hrs(pace) + ' hours a week' : 'No hours on this order', 1) +
      fld('Balance This Week', pace ? (bal >= 0 ? hrs(bal) + ' under' : hrs(-bal) + ' over') : '—', 1) +
      fld('Used by Everyone', tot ? hrs(used) + ' of ' + hrs(tot) + ' (' + pct.toFixed(0) + '%)' : '—', 1) +
      fld('Remaining on the Order', tot ? hrs(tot - used) + ' hours' : '—', 1) +
      '</div>' +
      '<div class="meterwrap"><span class="meter"><i class="' + cls +
      '" style="width:' + pct.toFixed(0) + '%"></i></span></div>' +
      '<p class="fineprint"><b>The bar is the whole order, not your share.</b> When several people ' +
      'cover the same order, each of you needs to see how much of it is left — that is what ' +
      'stops an overrun turning up on an invoice.</p>' +
      (sent ? '' :
        '<div class="rowacts"><span class="unsaved" id="ph-unsaved" hidden>Unsaved</span>' +
        '<button class="gobtn ghost" type="button" id="ph-cancel">Discard</button>' +
        /* "Keep This Time", not "Keep This Order" — what the button keeps is the
           hours, and an order is the thing they are logged against. */
        '<button class="gobtn" type="button" id="ph-keep">Keep This Time</button></div>');
  }

  function covRow(oid, mates, f) {
    return '<div class="covrow">' +

      '<option value="">Choose a colleague</option>' +
      mates.map(function (m) {
        return '<option value="' + esc(m.name) + '"' +
          (f && f.person === m.name ? ' selected' : '') + '>' + esc(m.name) + '</option>'; }).join('') +
      '</select>' +
      '<input class="covhrs" type="number" min="0" step="0.25" data-hid="' + esc(oid) + '" ' +
      'placeholder="Hours" value="' + (f && f.hours ? hrs(f.hours) : '') + '">' +
      '<button class="lnk covdel" type="button" aria-label="Remove this line">Remove</button>' +
      '</div>';
  }

  /* ---- My Submitted Time --------------------------------------------------
     A person's own record of what they actually sent, week by week, newest
     first.  ⚠ It carries what they TYPED — the notes and the health flag —
     because the weekly report is a status report, and a history that keeps the
     hours and drops the notes is a downgrade on what Smartsheet already does. */
  function submittedSection(C, person, fy, mine) {
    var F = C.F;
    var weeks = (mine.weeks || []).slice().sort(function (a, b) {
      return (H.parse(b.weekEnding) || 0) - (H.parse(a.weekEnding) || 0); });
    if (!weeks.length) {
      return '<p class="empty">Nothing submitted yet. Your weeks appear here the moment you send ' +
        'one, and they stay — this is your own record, not a summary of it.</p>';
    }
    return '<p class="lede">Every week you have submitted this fiscal year, newest first. ' +
      'Open one to see the orders, the hours and your notes exactly as they were sent.</p>' +
      '<div class="rows">' + weeks.map(function (wk) {
        var st = H.stateOf(wk);
        var rows = H.rowsOf(wk);
        var ids = Object.keys(rows);
        var ask = wk.returnRequest;
        return '<div class="row"><div class="row-h">' +
          '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>' +
          '<span class="rt">Week Ending ' + esc(wk.weekEnding) + '</span>' +
          '<span class="pill ' + st.tone + '">' + esc(st.label) + '</span>' +
          '<span class="rs num">' + hrs(H.hoursIn(wk)) + ' hours</span>' +
          '</div><div class="row-b">' +
          '<div class="tbl"><table><thead><tr><th>Service Order</th><th class="n">Hours</th>' +
          '<th class="hide-narrow">What You Wrote</th><th class="hide-narrow hcol">Health</th></tr></thead><tbody>' +
          ids.map(function (id) {
            var r = rows[id], o = orderById(F, id);
            var split = H.splitOf(r, person.name);
            return '<tr><td>' + esc(o ? o.subject : id) +
              (split.length > 1
                ? '<br><span class="fineprint">Logged for ' + esc(split.map(function (s) {
                    return s.person + ' ' + hrs(s.hours); }).join(' · ')) + '</span>' : '') +
              '</td><td class="n">' + hrs(r.hours) + '</td>' +
              '<td class="hide-narrow">' + (r.thisWeek ? esc(r.thisWeek) :
                '<span class="fineprint">No note written</span>') +
              (r.upcoming ? '<br><span class="fineprint">Upcoming: ' + esc(r.upcoming) + '</span>' : '') +
              '</td><td class="hide-narrow hcol">' + (r.health ? healthDot(r.health) : '—') + '</td></tr>';
          }).join('') + '</tbody></table></div>' +
          '<div class="wkstate ' + st.tone + '"><span class="wk-l">' + esc(st.label) + '</span>' +
          '<span class="wk-d">' + st.said + '</span></div>' +
          (ask
            ? '<div class="note"><b>You have asked for this week back.</b> ' + esc(ask.why) +
              '<br><span class="fineprint">Asked ' + esc(stamp(ask.at)) + '. MISMO decides, and the ' +
              'answer appears here.</span></div>'
            : wk.state === 'submitted'
            ? '<div class="issacts"><button class="tbtn" type="button" data-wkback="' +
                esc(wk.weekEnding) + '">Take It Back to Correct</button></div>' +
              '<p class="fineprint">It has not been approved yet, so it is still yours. Taking it back ' +
              'needs nobody’s permission — what you first sent is kept as its own version.</p>'
            : wk.state === 'returned'
            ? '<div class="note"><b>Why it came back.</b> ' + esc(wk.returnedWhy || 'No reason was given.') +
              '<br><span class="fineprint">Sent back ' + esc(stamp(wk.returnedAt)) + '.</span></div>' +
              '<div class="issacts"><button class="tbtn" type="button" data-wkfix="' +
                esc(wk.weekEnding) + '">Correct This Week</button></div>' +
              '<p class="fineprint">This opens the week in <b>My Hours</b> with what you sent still in ' +
              'it, so you correct it rather than type it out again. What you first submitted is kept.</p>'
            : wk.state === 'paid'
            ? '<p class="fineprint"><b>These hours have been invoiced and paid, so the week does not ' +
              'reopen — for anyone.</b> A correction goes on the next period, the same way a closed ' +
              'month works in the financial system. If something here is wrong, ' +
              '<b>email Jonna Critchley</b> at <a href="mailto:jcritchley@mismo.org">jcritchley@mismo.org</a>.</p>'
            : '<div class="fields"><div class="f wide">' +
              '<label for="wy-' + esc(wk.weekEnding).replace(/\//g, '') + '">What Is Wrong With This Week</label>' +
              '<input id="wy-' + esc(wk.weekEnding).replace(/\//g, '') + '" type="text" ' +
              'data-wkwhy="' + esc(wk.weekEnding) + '" placeholder="One line — what needs changing">' +
              '</div></div>' +
              '<div class="issacts"><button class="tbtn" type="button" data-wkask="' +
                esc(wk.weekEnding) + '">Ask for It to Be Returned</button></div>' +
              '<p class="fineprint">Once MISMO has approved a week you cannot take it back yourself, so ' +
              'the request goes to them. <b>A reason is required</b> — it is what they read before ' +
              'deciding.' +
              (wk.state === 'invoiced' ? ' These hours are already on an invoice that has gone out and ' +
                'has not been paid, so returning the week means crediting and reissuing it.' : '') + '</p>') +
          (wk.versions && wk.versions.length
            ? '<p class="fineprint"><b>' + wk.versions.length + ' earlier version' +
              (wk.versions.length === 1 ? '' : 's') + ' of this week ' +
              (wk.versions.length === 1 ? 'is' : 'are') + ' kept.</b> Nothing is overwritten, so what an ' +
              'invoice was raised against can always be shown.</p>' : '') +
          '</div></div>';
      }).join('') + '</div>';
  }

  /* ---- The Company's Month ------------------------------------------------
     For the company's time manager.  ⚠ The reconciliation is PER SERVICE ORDER
     PER MONTH, never per person: people at the same company cover for each
     other, and reconciling by person produced eleven differences in one proven
     month that all offset one another exactly.  Person figures sit beside it as attribution,
     labelled as such. */
  function monthSection(C, fy, files) {
    var F = C.F;
    var months = H.monthsIn(files);
    if (!months.length) {
      return '<p class="empty">Nothing has been submitted yet this fiscal year. Once your team starts ' +
        'logging time, the month appears here — by service order, with who it was for beside it.</p>';
    }
    var month = HRS.month && months.indexOf(HRS.month) >= 0 ? HRS.month : months[0];
    var rows = H.monthRows(files, month);
    /* ⚠ Alphabetical by the order's name, NOT by hours. Sorting by hours means
       the list reorders itself every time somebody logs time, so the order you
       looked at last week is somewhere else this week. A person reconciling an
       invoice is looking for a named order, not for the biggest one. Matches
       the way the service orders are listed everywhere else. */
    var ids = Object.keys(rows).sort(function (a, b) {
      var A = orderById(F, a), B = orderById(F, b);
      return String((A && A.subject) || a).localeCompare(String((B && B.subject) || b),
        undefined, { sensitivity: 'base', numeric: true });
    });
    var total = ids.reduce(function (a, id) { return a + rows[id].hours; }, 0);
    var missing = whoOwes(F, files, month);

    return '<p class="lede">Your whole company’s time for the month, by service order — ' +
      'the figures MISMO reconciles your invoice against. Check it here before you invoice and most ' +
      'differences never reach one.</p>' +
      '<div class="tot"><span class="tot-l">Month</span><span class="tot-v">' +
      '<select id="m-pick" aria-label="Which month">' + months.map(function (m) {
        return '<option value="' + esc(m) + '"' + (m === month ? ' selected' : '') + '>' +
          esc(H.monthLabel(m)) + '</option>'; }).join('') + '</select> ' +
      hrs(total) + ' hours</span></div>' +
      (missing.length
        ? '<div class="note"><b>' + missing.length + ' ' +
          (missing.length === 1 ? 'person has' : 'people have') + ' not submitted every week of this ' +
          'month.</b> ' + esc(missing.map(function (m) {
            return m.person + ' (' + m.weeks.join(', ') + ')'; }).join('; ')) +
          '<br><span class="fineprint">A week somebody covered for them is not missing — this ' +
          'counts weeks with nothing sent at all.</span></div>'
        : weeksToCome(files, month) > 0
          ? '<div class="note ok"><b>Every week that has ended has been submitted.</b> ' +
            weeksToCome(files, month) + ' more ' +
            (weeksToCome(files, month) === 1 ? 'week' : 'weeks') +
            ' still to come this month.</div>'
          : '<div class="note ok"><b>Every week of this month has been submitted.</b></div>') +
      '<div class="rows">' + ids.map(function (id) {
        var o = orderById(F, id);
        var rec = rows[id];
        var tot = o ? (Number(o.estimatedHours) || 0) : 0;
        var used = H.usedOnOrder(files, id);
        var pct = tot ? Math.min(100, 100 * used / tot) : 0;
        var cls = pct > 90 ? 'over' : pct > 70 ? 'hot' : '';
        /* Alphabetical, for the same reason as the orders above: a name is
           looked up, not ranked. */
        var by = Object.keys(rec.byPerson).sort(function (a, b) {
          return String(a).localeCompare(String(b), undefined, { sensitivity: 'base' }); });
        return '<div class="row"><div class="row-h">' +
          '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>' +
          '<span class="rt">' + esc(o ? o.subject : id) + '</span>' +
          (pct > 90 ? '<span class="pill bad">' + pct.toFixed(0) + '% used</span>' :
           pct > 70 ? '<span class="pill warn">' + pct.toFixed(0) + '% used</span>' : '') +
          '<span class="rs num">' + hrs(rec.hours) + ' hours</span>' +
          '</div><div class="row-b">' +
          '<div class="fields">' +
          fld('This Month', hrs(rec.hours) + ' hours', 1) +
          fld('This Fiscal Year', hrs(used) + ' of ' + (tot ? hrs(tot) : '—'), 1) +
          fld('Remaining', tot ? hrs(tot - used) + ' hours' : 'No hours on this order', 1) +
          /* ⚠ Decision 26 reaches into the month view too.  A time manager sees
             the fee; a facilitator never does, on any screen. */
          (isFac() ? '' :
            fld('Maximum Fee', feeLabel(o), 1)) +
          '</div>' +
          '<div class="meterwrap"><span class="meter"><i class="' + cls +
          '" style="width:' + pct.toFixed(0) + '%"></i></span></div>' +
          '<h4 class="subh">Who the Hours Were For</h4>' +
          '<div class="tbl"><table><thead><tr><th>Person</th><th class="n">Hours</th>' +
          '</tr></thead><tbody>' + by.map(function (p) {
            return '<tr><td>' + esc(p) + '</td><td class="n">' + hrs(rec.byPerson[p]) + '</td></tr>';
          }).join('') + '</tbody></table></div>' +
          '<p class="fineprint"><b>This is attribution, not a difference.</b> Hours book under whoever ' +
          'submits the week; the split says who actually did the work. The order’s total above is ' +
          'what MISMO reconciles your invoice against.</p>' +
          '</div></div>';
      }).join('') + '</div>' +
      /* ⚠ This used to cite another company's August invoice by name. The
         time manager reading this page is not that company, and how well
         somebody else's invoice reconciles is none of their business. The
         point stands without it. */
      '<p class="fineprint"><b>Reconcile per service order, never per person.</b> Where people cover ' +
      'for each other, the order totals tie exactly while the same month checked person by person ' +
      'throws up differences that all offset one another — that is the cover, not an error.</p>';
  }

  /* Who has a week of this month with nothing sent at all.  ⚠ A person whose
     work was covered by a colleague's split entry is NOT missing — that was
     what made the Smartsheet alert fire every month and train everyone to
     ignore it. */
  /* ⚠ How many weeks of this month have NOT ended yet.
     whoOwes only counts a week once it is over — it cannot ask for time that
     has not happened. But the message beside it said "every week of this month
     has been submitted", which on the 5th of October claimed the whole month
     was in when exactly one week had ended. The claim has to match the test:
     every week THAT HAS ENDED, and how many are still to come. */
  function weeksToCome(files, month) {
    var today = new Date();
    var fy = 'FY 2027';
    (files || []).forEach(function (f) { if (f && f.fiscalYear) fy = f.fiscalYear; });
    var n = 0;
    H.weekEndings(fy).forEach(function (d) {
      if (H.monthOf(H.print(d)) !== month) return;
      if (d > today) n++;
    });
    return n;
  }

  function whoOwes(F, files, month) {
    var today = new Date();
    var out = [];
    (F.people || []).forEach(function (p) {
      if (!logsTime(F, p)) return;
      var f = null;
      files.forEach(function (x) { if (x && x.slug === p.slug) f = x; });
      var sentWeeks = {};
      ((f && f.weeks) || []).forEach(function (w) { sentWeeks[w.weekEnding] = 1; });
      var covered = {};
      files.forEach(function (x) {
        ((x && x.weeks) || []).forEach(function (w) {
          var r = H.rowsOf(w);
          for (var id in r) {
            if (!r.hasOwnProperty(id)) continue;
            (r[id]['for'] || []).forEach(function (s) {
              if (s.person === p.name && Number(s.hours)) covered[w.weekEnding] = 1;
            });
          }
        });
      });
      var owed = [];
      H.weekEndings(f && f.fiscalYear ? f.fiscalYear : 'FY 2027').forEach(function (d) {
        var s = H.print(d);
        if (H.monthOf(s) !== month) return;
        if (d > today) return;
        if (!active(p, d)) return;     // not yet started, or already left
        if (!sentWeeks[s] && !covered[s]) owed.push(s);
      });
      if (owed.length) out.push({ person: p.name, weeks: owed });
    });
    return out;
  }

  /* ---- reading the panel back into the working copy ----------------------
     ⚠ Nothing is read from the page any more.  The week lives in HRS.draft and
     the panel is a view onto one order of it, so closing the panel can never
     take an entry with it. */
  function readPanel(o) {
    var r = {};
    var n = $('#panel-body .phnum');
    r.hours = n && n.value !== '' ? Math.round(Number(n.value) * 100) / 100 : 0;
    var note = $('#panel-body .phnote'), up = $('#panel-body .phup');
    if (note && note.value.trim()) r.thisWeek = note.value.trim();
    if (up && up.value.trim()) r.upcoming = up.value.trim();
    var on = $('#panel-body .phhealth.on');
    if (on) r.health = on.dataset.health;
    var sp = $('#panel-body .phsplit');
    if (sp && sp.value !== '') r.inFirstMonth = Math.round(Number(sp.value) * 100) / 100;
    var host = $('#panel-body .covrows');
    if (host) {
      var list = [];
      $$('.covrow', host).forEach(function (row) {
        var pick = $('.covwho', row), h = $('.covhrs', row);
        var v = Number(h && h.value);
        if (pick && pick.value && v) list.push({ person: pick.value, hours: Math.round(v * 100) / 100 });
      });
      if (list.length) r['for'] = list;
    }
    return r;
  }
  /* ⚠ Comparing two rows with JSON.stringify compares their SHAPE, not what
     they say.  An order nobody has touched is stored as nothing at all, while
     the panel reads back {hours:0} — so every untouched order looked changed
     the moment it opened, and closing it asked a question with no answer worth
     giving.  Key order counts too, so the same data written twice could differ.
     This reduces a row to what it actually says before comparing. */
  function normRow(r) {
    r = r || {};
    var out = {};
    if (Number(r.hours)) out.hours = Math.round(Number(r.hours) * 100) / 100;
    if ((r.thisWeek || '').trim()) out.thisWeek = r.thisWeek.trim();
    if ((r.upcoming || '').trim()) out.upcoming = r.upcoming.trim();
    if (r.health) out.health = r.health;
    if (r.inFirstMonth != null && r.inFirstMonth !== '') {
      out.inFirstMonth = Math.round(Number(r.inFirstMonth) * 100) / 100;
    }
    var f = (r['for'] || []).filter(function (x) { return x && x.person && Number(x.hours); })
      .map(function (x) { return x.person + ':' + (Math.round(Number(x.hours) * 100) / 100); })
      .sort();
    if (f.length) out['for'] = f;
    return Object.keys(out).sort().map(function (k) {
      return k + '=' + JSON.stringify(out[k]);
    }).join('|');
  }
  function sameRow(a, b) { return normRow(a) === normRow(b); }

  /* Everything that must be true before a week can go to MISMO.  ⚠ Each of
     these is a thing that is cheap to fix now and expensive to fix once it is
     on an invoice. */
  function weekProblems(F, person, rows, fy) {
    var out = [];
    var ending = HRS.week || H.weekFor(fy || F.fiscalYear || 'FY 2027', new Date());
    var ids = Object.keys(rows).filter(function (id) { return Number(rows[id].hours); });
    if (!ids.length) out.push('Nothing is entered yet — put hours against at least one service order.');
    ids.forEach(function (id) {
      var o = orderById(F, id);
      var name = o ? o.subject : id;
      var over = H.splitOver(rows[id]);
      if (over) {
        out.push('On <b>' + esc(name) + '</b> you have given away ' + hrs(over) +
          ' more hours than you logged. Raise the hours or lower the split.');
      }
      if (!rows[id].thisWeek) {
        out.push('<b>' + esc(name) + '</b> has hours but no <i>This Week</i> note. ' +
          'The weekly report is a status report — the note is the part MISMO reads.');
      }
      /* ⚠ A week that crosses a month end has to say how it splits, or real
         cost quietly moves between two months — which is the thing the monthly
         reconciliation exists to catch. */
      var sp = H.splitMonths(rows[id], fy || F.fiscalYear || 'FY 2027', ending);
      if (sp && sp.first == null) {
        out.push('<b>' + esc(name) + '</b> — this week crosses a month end and nothing says how it ' +
          'splits. Put the ' + esc(sp.firstMonth) + ' hours in <i>Of Those, in ' +
          esc(sp.firstMonth) + '</i>, or all of them go on the ' + esc(sp.lastMonth) + ' invoice.');
      }
      if (sp && sp.over) {
        out.push('<b>' + esc(name) + '</b> — more hours are marked as ' + esc(sp.firstMonth) +
          ' than were logged for the whole week.');
      }
    });
    return out;
  }

  function saveHours(C, person, fy, rows, submit) {
    var ending = HRS.week || H.weekFor(fy, new Date());
    var path = hoursPath(person, fy);
    var key = keyFor(C.slug);
    return R.update(key, path, function (cur) {
      var next = cur ? JSON.parse(JSON.stringify(cur)) : H.emptyFile(person, fy);
      next.person = person.name; next.slug = person.slug; next.fiscalYear = fy;
      if (!submit) {
        /* Saving a draft must not drop what a take-back put there, or saving
           once between taking a week back and resending it would lose the
           earlier submission. */
        /* ⚠ One draft PER WEEK.  This was a single slot, so saving a draft for
           a second week silently overwrote the first — somebody who saved
           Friday's week without sending it and then typed anything the
           following week lost what they had written, notes and all. */
        var prev = H.draftFor(next, ending);
        var held = (prev && prev.tookBack) || null;
        next.drafts = next.drafts || {};
        /* carry an old single-slot draft over the first time we write */
        if (next.draft && next.draft.weekEnding && !next.drafts[next.draft.weekEnding]) {
          next.drafts[next.draft.weekEnding] = next.draft;
        }
        next.drafts[ending] = { weekEnding: ending, rows: rows, savedAt: new Date().toISOString() };
        if (held) next.drafts[ending].tookBack = held;
        next.draft = null;
        return next;
      }
      next.weeks = next.weeks || [];
      var at = new Date().toISOString();
      var found = null;
      next.weeks.forEach(function (w) { if (w.weekEnding === ending) found = w; });
      if (found) {
        /* ⚠ Never overwritten.  What was there becomes a version, so what an
           invoice was raised against can always be shown. */
        found.versions = (found.versions || []).concat([{
          at: found.submittedAt, rows: found.rows, state: found.state }]);
        found.rows = rows; found.state = 'submitted'; found.submittedAt = at;
        found.returnRequest = null;
        found.history = (found.history || []).concat([{ at: at, what: 'resubmitted', by: person.name }]);
      } else {
        /* ⚠ A week that was taken back left the weeks list, and the versions it
           had carried went into the draft.  They come back here, or a
           take-back-and-resubmit would quietly erase the submission it
           replaced — and "every submission is its own version" would be a
           promise this page does not keep. */
        var prevD = H.draftFor(next, ending);
        var carried = (prevD && prevD.tookBack) || [];
        next.weeks.push({ weekEnding: ending, state: 'submitted', submittedAt: at, rows: rows,
          versions: carried, returnRequest: null,
          history: (carried.length
            ? [{ at: at, what: 'resubmitted after taking it back', by: person.name }]
            : [{ at: at, what: 'submitted', by: person.name }]) });
      }
      /* ⚠ Clear only THIS week's draft.  Clearing the lot would throw away a
         draft the person is part-way through for another week. */
      if (next.drafts) delete next.drafts[ending];
      if (next.draft && next.draft.weekEnding === ending) next.draft = null;
      return next;
    }, (submit ? 'hours submitted' : 'hours saved') + ': ' + person.name + ' week ending ' + ending);
  }

  /* Taking a week back before MISMO has approved it.  The submission is KEPT
     as a version and the rows return to the draft, so nothing is lost and the
     record still shows a week was sent and withdrawn. */
  function takeBack(C, person, fy, ending) {
    return R.update(keyFor(C.slug), hoursPath(person, fy), function (cur) {
      var next = JSON.parse(JSON.stringify(cur));
      var keep = null;
      next.weeks = (next.weeks || []).filter(function (w) {
        if (w.weekEnding !== ending) return true;
        keep = w; return false;
      });
      if (keep) {
        next.drafts = next.drafts || {};
        next.drafts[ending] = { weekEnding: ending, rows: keep.rows,
          savedAt: new Date().toISOString(),
          tookBack: (keep.versions || []).concat([{ at: keep.submittedAt, rows: keep.rows,
            state: keep.state }]) };
        if (next.draft && next.draft.weekEnding === ending) next.draft = null;
      }
      return next;
    }, 'week taken back: ' + person.name + ' ' + ending);
  }

  function askReturn(C, person, fy, ending, why) {
    var at = new Date().toISOString();
    return R.update(keyFor(C.slug), hoursPath(person, fy), function (cur) {
      var next = JSON.parse(JSON.stringify(cur));
      (next.weeks || []).forEach(function (w) {
        if (w.weekEnding !== ending) return;
        w.returnRequest = { why: why, at: at, by: person.name };
        w.history = (w.history || []).concat([{ at: at, what: 'return requested', by: person.name, why: why }]);
      });
      return next;
    }, 'return requested: ' + person.name + ' ' + ending)
    .then(function () {
      /* The nudge outbox is the only thing on this page that reaches anybody.
         A return request is exactly the kind of stop that belongs in it. */
      return notify(C.slug, { kind: 'hours-return-requested', orderId: null,
        order: 'Week ending ' + ending, company: C.F.company, who: person.name,
        said: why, raisedOn: at, forAttentionOf: 'jcritchley@mismo.org', sent: false, sentOn: null });
    });
  }

  /* ---- wiring ------------------------------------------------------------- */
  function wireHours(C, person, fy) {
    function refresh() { HRS.draft = null; HRS.files = null; hoursHome(); }

    var save = document.getElementById('h-save');
    var send = document.getElementById('h-send');
    var msg = document.getElementById('h-msg');

    function count() {
      if (!msg) return;
      var rows = draftClean();
      var ids = Object.keys(rows).filter(function (id) { return Number(rows[id].hours); });
      var t = ids.reduce(function (a, id) { return a + (Number(rows[id].hours) || 0); }, 0);
      msg.textContent = ids.length
        ? hrs(t) + ' hours on ' + ids.length + ' order' + (ids.length === 1 ? '' : 's') +
          (HRS.dirty ? ' \u00b7 not saved' : '')
        : 'Nothing entered yet';
    }
    count();

    /* ---- Normally Mine / Everything I Can Log ---------------------------
       ⚠ A view switch, never a save. Anything typed into the week is already
       in the working copy keyed by order id, so switching the list cannot
       lose an entry — including an entry on a line the switch hides. */
    $$('#view [data-mine]').forEach(function (b) {
      b.addEventListener('click', function () {
        HRS.showAll = b.dataset.mine === 'all';
        hoursHome();
      });
    });

    /* ---- one order opens on the right ---------------------------------- */
    $$('#view [data-hrow]').forEach(function (b) {
      b.addEventListener('click', function () {
        var o = orderById(C.F, b.dataset.hrow);
        if (!o) return;
        HRS.open = o.id;
        HRS.openWas = JSON.parse(JSON.stringify(HRS.draft[o.id] || {}));
        openPanel(o.subject, hoursPanel(o));
        wireHoursPanel(o);
      });
    });

    /* Keeping an order's entry means writing it into the working copy — it is
       NOT a save to MISMO, and the page says so. */
    function keepOpen(o) {
      var next = readPanel(o);
      var had = HRS.draft[o.id];
      HRS.draft[o.id] = next;
      if (!sameRow(had, next)) HRS.dirty = true;
      HRS.open = null;
      hoursHome();
    }
    function panelDirty(o) {
      return !sameRow(HRS.openWas, readPanel(o));
    }

    function wireHoursPanel(o) {
      var unsaved = document.getElementById('ph-unsaved');
      function mark() { if (unsaved) unsaved.hidden = !panelDirty(o); }
      $$('#panel-body input, #panel-body textarea, #panel-body select').forEach(function (el) {
        el.addEventListener('input', mark);
        el.addEventListener('change', mark);
      });
      $$('#panel-body .phhealth').forEach(function (b) {
        b.addEventListener('click', function () {
          var was = b.classList.contains('on');
          $$('#panel-body .phhealth').forEach(function (x) {
            x.classList.remove('on'); x.setAttribute('aria-checked', 'false'); });
          if (!was) { b.classList.add('on'); b.setAttribute('aria-checked', 'true'); }
          mark();
        });
      });
      var tog = document.getElementById('ph-covtog');
      if (tog) tog.addEventListener('click', function () {
        var body = tog.parentElement.querySelector('.covbody');
        if (body) body.classList.toggle('open');
      });
      $$('#panel-body [data-covadd]').forEach(function (b) {
        b.addEventListener('click', function () {
          var host = $('#panel-body .covrows');
          if (!host) return;
          var mates = colleagues(C.F, person.name, H.parse(HRS.draftWeek));
          var w = document.createElement('div');
          w.innerHTML = covRow(o.id, mates, null);
          host.appendChild(w.firstChild);
          wireCovDel(host.lastChild); mark();
        });
      });
      $$('#panel-body .covrow').forEach(wireCovDel);
      function wireCovDel(row) {
        var d = $('.covdel', row);
        if (d) d.addEventListener('click', function () {
          var host = row.parentElement;
          host.removeChild(row);
          if (!host.children.length) {
            var mates = colleagues(C.F, person.name, H.parse(HRS.draftWeek));
            var w = document.createElement('div');
            w.innerHTML = covRow(o.id, mates, null);
            host.appendChild(w.firstChild);
            wireCovDel(host.lastChild);
          }
          mark();
        });
      }
      var keep = document.getElementById('ph-keep');
      if (keep) keep.addEventListener('click', function () { keepOpen(o); });
      var can = document.getElementById('ph-cancel');
      if (can) can.addEventListener('click', function () {
        HRS.open = null; closePanel(true);
      });
      mark();
    }

    /* ⚠ The guard.  A panel can be dismissed by the scrim, the × or Escape,
       and hours typed into it would go with it.  Nothing closes over unsaved
       work without asking. */
    PANEL_GUARD = function () {
      if (!HRS.open) return null;
      var o = orderById(C.F, HRS.open);
      if (!o || !panelDirty(o)) return null;
      return {
        save: function () { keepOpen(o); },
        discard: function () { HRS.open = null; }
      };
    };

    if (save) save.addEventListener('click', function () {
      save.disabled = true;
      saveHours(C, person, fy, draftClean(), false)
        .then(function () {
          HRS.dirty = false;
          toast('Saved. It has not gone to MISMO.', 'ok');
          save.disabled = false; count();
        })
        .catch(function (e) { save.disabled = false; failed(e); });
    });

    if (send) send.addEventListener('click', function () {
      var rows = draftClean();
      var bad = weekProblems(C.F, person, rows, fy);
      if (bad.length) { openCheck(bad, function () { doSend(rows); }); return; }
      doSend(rows);
    });
    function doSend(rows) {
      if (send) send.disabled = true;
      saveHours(C, person, fy, rows, true)
        .then(function () { HRS.week = null; HRS.draft = null; toast('Sent to MISMO.', 'ok'); refresh(); })
        .catch(function (e) { if (send) send.disabled = false; failed(e); });
    }

    var back = document.getElementById('h-back');
    if (back) back.addEventListener('click', function () {
      back.disabled = true;
      takeBack(C, person, fy, HRS.draftWeek)
        .then(function () { HRS.draft = null; toast('Taken back. It is yours again.', 'ok'); refresh(); })
        .catch(function (e) { back.disabled = false; failed(e); });
    });

    $$('#view [data-wkback]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation(); b.disabled = true;
        takeBack(C, person, fy, b.dataset.wkback)
          .then(function () { toast('Taken back. It is yours again.', 'ok'); refresh(); })
          .catch(function (er) { b.disabled = false; failed(er); });
      });
    });

    $$('#view [data-wkask]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var wk = b.dataset.wkask;
        var box = $('#view [data-wkwhy="' + wk + '"]');
        var why = box ? String(box.value || '').trim() : '';
        if (!why) {
          toast('A reason is required — it is what MISMO reads before deciding.', 'bad');
          if (box) box.focus();
          return;
        }
        b.disabled = true;
        askReturn(C, person, fy, wk, why)
          .then(function () { toast('Asked. MISMO decides, and the answer appears here.', 'ok'); refresh(); })
          .catch(function (er) { b.disabled = false; failed(er); });
      });
    });

    /* the cover split: show, hide, add and remove */
    $$('#view [data-covtog]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var body = b.parentElement.querySelector('.covbody');
        if (body) body.classList.toggle('open');
      });
    });
    $$('#view [data-covadd]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var id = b.dataset.covadd;
        var host = $('#view [data-covrows="' + id + '"]');
        if (!host) return;
        var mates = colleagues(C.F, person.name, H.parse(HRS.week || H.weekFor(fy, new Date())));
        var wrap = document.createElement('div');
        wrap.innerHTML = covRow(id, mates, null);
        var row = wrap.firstChild;
        host.appendChild(row);
        wireCovDel(row);
        $('.covhrs', row).addEventListener('input', count);
      });
    });
    $$('#view .covrow').forEach(wireCovDel);
    function wireCovDel(row) {
      var d = $('.covdel', row);
      if (d) d.addEventListener('click', function (e) {
        e.stopPropagation();
        var host = row.parentElement;
        row.parentElement.removeChild(row);
        if (host && !host.children.length) {
          var mates = colleagues(C.F, person.name, H.parse(HRS.week || H.weekFor(fy, new Date())));
          var w = document.createElement('div');
          w.innerHTML = covRow(host.dataset.covrows, mates, null);
          host.appendChild(w.firstChild);
          wireCovDel(host.firstChild);
        }
        count();
      });
    }

    $$('#view [data-wkfix]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        HRS.week = b.dataset.wkfix;
        hoursHome();
      });
    });
    var now = document.getElementById('h-now');
    if (now) now.addEventListener('click', function () { HRS.week = null; hoursHome(); });

    /* the health dots */
    $$('#view .hbtn').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var host = b.parentElement;
        var hid = b.dataset.hid;
        var hidden = $('.hsel[data-hid="' + hid + '"]', host);
        var already = b.classList.contains('on');
        $$('.hbtn', host).forEach(function (x) {
          x.classList.remove('on'); x.setAttribute('aria-checked', 'false');
        });
        /* Pressing the one already chosen clears it — otherwise a health flag
           set by accident could never be unset. */
        if (!already) {
          b.classList.add('on'); b.setAttribute('aria-checked', 'true');
          if (hidden) hidden.value = b.dataset.health;
        } else if (hidden) { hidden.value = ''; }
        var head = b.closest('.row');
        if (head) {
          var dot = $('.row-h .hdot', head);
          var mk = healthDot(hidden ? hidden.value : '');
          if (dot) dot.outerHTML = mk;
          else {
            var rt = $('.row-h .rt', head);
            if (rt && mk) rt.insertAdjacentHTML('afterend', mk);
          }
        }
      });
    });

    var mp = document.getElementById('m-pick');
    if (mp) mp.addEventListener('change', function () { HRS.month = mp.value; hoursHome(); });
  }

  /* A week with something worth a second look is not blocked — it is shown,
     and the person decides.  ⚠ A missing note is a real omission but it is
     not a reason to stop somebody sending their time on a Friday afternoon. */
  function openCheck(problems, go) {
    var host = document.getElementById('h-check');
    if (!host) { go(); return; }
    host.innerHTML =
      '<div class="note"><b>Before you send this week.</b> Nothing here stops you \u2014 each one is ' +
      'cheap to fix now and expensive to fix once these hours are on an invoice.' +
      '<ul class="checks">' + problems.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>' +
      '<div class="issacts"><button class="tbtn ghost" type="button" id="ck-back">Go Back and Fix It</button>' +
      '<button class="tbtn" type="button" id="ck-go">Send It Anyway</button></div></div>';
    host.scrollIntoView({ block: 'nearest' });
    var a = document.getElementById('ck-back'), b = document.getElementById('ck-go');
    if (a) a.addEventListener('click', function () { host.innerHTML = ''; });
    if (b) b.addEventListener('click', function () { host.innerHTML = ''; go(); });
  }

  /* ---- one page, one redraw ----------------------------------------------
     My Hours sits in the contracting company's own view rather than a page of
     its own, because the week and the orders it is logged against are the same
     screen's business.  Everything that changes hours redraws that one view,
     so a save, a take-back and a month change can never leave the page showing
     two different answers for the same week. */
  function hoursHome() { contractorView(); }


  /* =========================================================================
   * TIME TO APPROVE — the MISMO side of hours
   *
   * ⚠ Approving is a decision about a WEEK, not about a person: a week is the
   * unit an invoice is eventually raised against, so it is the unit that gets
   * locked.  Returning one sends it back whole, with the reason attached, and
   * keeps what was submitted as its own version — nothing is edited on
   * somebody else's behalf.
   * ======================================================================= */
  function everyWeek(list, filesByslug) {
    var out = [];
    list.forEach(function (C) {
      (filesByslug[C.slug] || []).forEach(function (f) {
        ((f && f.weeks) || []).forEach(function (wk) {
          out.push({ C: C, file: f, wk: wk });
        });
      });
    });
    return out;
  }

  function loadAllHours(list) {
    return Promise.all(list.map(function (C) {
      var fy = C.F.fiscalYear || 'FY 2027';
      return loadHours(C.slug, C.F, fy).then(function (files) { return { slug: C.slug, files: files }; });
    })).then(function (rs) {
      var by = {};
      rs.forEach(function (r) { by[r.slug] = r.files; });
      return by;
    });
  }

  function approveSection(list, by) {
    var all = everyWeek(list, by);
    var waiting = all.filter(function (x) { return x.wk.state === 'submitted'; });
    var asked = all.filter(function (x) { return x.wk.returnRequest; });

    if (!waiting.length && !asked.length) {
      return '<p class="empty">No time is waiting on you. Weeks appear here the moment somebody ' +
        'submits one, and a request to reopen an approved week appears here too.</p>';
    }

    var body = '';
    if (asked.length) {
      body += '<h3 class="subh">Asked to Be Reopened</h3>' +
        '<p class="lede">Somebody wants a week back that is already approved or invoiced. ' +
        '<b>Read the reason before deciding</b> — a week on an unpaid invoice can be reopened, but ' +
        'it means crediting and reissuing that invoice.</p>' +
        '<div class="rows">' + asked.map(function (x) { return weekRow(x, true); }).join('') + '</div>';
    }
    if (waiting.length) {
      var hoursWaiting = waiting.reduce(function (a, x) { return a + H.hoursIn(x.wk); }, 0);
      body += (asked.length ? '<h3 class="subh">Waiting for Approval</h3>' : '') +
        '<p class="lede">Each one is a week somebody has submitted. Approving locks it; returning it ' +
        'sends it back with your reason and keeps what they sent.</p>' +
        '<div class="tot"><span class="tot-l">Waiting for You</span>' +
        '<span class="tot-v">' + hrs(hoursWaiting) + ' hours across ' + waiting.length + ' week' +
        (waiting.length === 1 ? '' : 's') + '</span></div>' +
        '<div class="rows">' + waiting.map(function (x) { return weekRow(x, false); }).join('') + '</div>';
    }
    return body;
  }

  function weekRow(x, isAsk) {
    var F = x.C.F, wk = x.wk, f = x.file;
    var rows = H.rowsOf(wk);
    var ids = Object.keys(rows);
    var st = H.stateOf(wk);
    var tag = f.slug + '|' + wk.weekEnding;
    var ask = wk.returnRequest;
    /* Anything on this week worth Jonna's eye before she locks it. */
    var flags = [];
    ids.forEach(function (id) {
      var o = orderById(F, id);
      if (!o) { flags.push('Hours against something with no service order behind it'); return; }
      var used = H.usedOnOrder(x.C.__files || [], id);
      var tot = Number(o.estimatedHours) || 0;
      if (tot && used > tot) flags.push(esc(o.subject) + ' is over its hours');
      if (!rows[id].thisWeek) flags.push(esc(o.subject) + ' has no note');
      if (H.splitOver(rows[id])) flags.push(esc(o.subject) + ' splits away more hours than were logged');
    });

    return '<div class="row"><div class="row-h">' +
      '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>' +
      '<span class="rt">' + esc(f.person) + ' · week ending ' + esc(wk.weekEnding) + '</span>' +
      (flags.length ? '<span class="pill warn">' + flags.length + ' to check</span>'
                    : '<span class="pill ' + st.tone + '">' + esc(st.label) + '</span>') +
      '<span class="rs num">' + hrs(H.hoursIn(wk)) + ' hours</span>' +
      '</div><div class="row-b">' +
      '<div class="fields">' +
      fld('Company', F.company) +
      fld('Person', f.person) +
      fld('Week', H.weekSpan(x.C.F.fiscalYear || 'FY 2027', wk.weekEnding)) +
      fld('Submitted', stamp(wk.submittedAt)) +
      '</div>' +
      (ask ? '<div class="note"><b>They have asked for this week back.</b> ' + esc(ask.why) +
        '<br><span class="fineprint">Asked ' + esc(stamp(ask.at)) + ' by ' + esc(ask.by) + '. ' +
        'The week is ' + esc(st.label.toLowerCase()) + '.</span></div>' : '') +
      (flags.length ? '<div class="note"><b>Worth a look before you approve.</b><ul class="checks">' +
        flags.map(function (fl) { return '<li>' + fl + '</li>'; }).join('') + '</ul></div>' : '') +
      '<div class="tbl"><table><thead><tr><th>Service Order</th><th class="n">Hours</th>' +
      '<th class="hide-narrow">What They Wrote</th><th class="hide-narrow hcol">Health</th></tr></thead><tbody>' +
      ids.map(function (id) {
        var r = rows[id], o = orderById(F, id);
        var split = H.splitOf(r, f.person);
        return '<tr><td>' + esc(o ? o.subject : id) +
          (split.length > 1 ? '<br><span class="fineprint">For ' + esc(split.map(function (s) {
            return s.person + ' ' + hrs(s.hours); }).join(' · ')) + '</span>' : '') +
          '</td><td class="n">' + hrs(r.hours) + '</td>' +
          '<td class="hide-narrow">' + (r.thisWeek ? esc(r.thisWeek) :
            '<span class="fineprint">No note written</span>') +
          (r.upcoming ? '<br><span class="fineprint">Upcoming: ' + esc(r.upcoming) + '</span>' : '') +

      }).join('') + '</tbody></table></div>' +
      '<div class="fields"><div class="f wide">' +
      '<label>Why You Are Sending It Back</label>' +
      '<input type="text" data-apwhy="' + esc(tag) + '" placeholder="One line — what they need to change">' +
      '</div></div>' +

        (isAsk ? 'Reopen This Week' : 'Approve This Week') + '</button>' +
      '<button class="tbtn ghost" type="button" data-apno="' + esc(tag) + '">' +
        (isAsk ? 'Leave It Locked' : 'Send It Back') + '</button>' +

        ? 'Reopening returns the week to them to correct and resubmit. <b>A reason is required to ' +
          'refuse</b> — it is what they read. What they submitted is kept either way.'
        : 'Approving locks the week. Sending it back returns it to them with your reason, and keeps ' +
          'what they sent as its own version — nothing is edited on their behalf. ' +
          '<b>A reason is required to send one back.</b>') + '</p>' +

  }

  /* ---- the two decisions -------------------------------------------------- */
  function setWeek(C, personSlug, ending, change, msg) {
    var fy = C.F.fiscalYear || 'FY 2027';
    return R.update(keyFor(C.slug), 'hours/' + personSlug + '-' + fyKey(fy) + '.json', function (cur) {
      var next = JSON.parse(JSON.stringify(cur));
      (next.weeks || []).forEach(function (w) { if (w.weekEnding === ending) change(w); });
      return next;
    }, msg);
  }

  function wireApprove(list, by, redraw) {
    function ctx(tag) {
      var p = String(tag).split('|');
      var slug = p[0], ending = p[1];
      var found = null;
      list.forEach(function (C) {
        (by[C.slug] || []).forEach(function (f) { if (f && f.slug === slug) found = { C: C, f: f }; });
      });
      return found ? { C: found.C, slug: slug, ending: ending } : null;
    }

    $$('#view [data-apok]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var c = ctx(b.dataset.apok); if (!c) return;
        b.disabled = true;
        var at = new Date().toISOString();
        setWeek(c.C, c.slug, c.ending, function (w) {
          if (w.returnRequest) {
            /* Reopening: the week goes back to them, and what they submitted
               is kept as a version so the invoice trail survives. */
            w.versions = (w.versions || []).concat([{ at: w.submittedAt, rows: w.rows, state: w.state }]);
            w.state = 'submitted'; w.returnRequest = null;
            w.history = (w.history || []).concat([{ at: at, what: 'reopened by MISMO', by: ME.name }]);
          } else {
            w.state = 'approved'; w.approvedAt = at; w.approvedBy = ME.name;
            w.history = (w.history || []).concat([{ at: at, what: 'approved', by: ME.name }]);
          }
        }, 'hours decision: ' + c.slug + ' ' + c.ending)
          .then(function () { toast('Done.', 'ok'); redraw(); })
          .catch(function (er) { b.disabled = false; failed(er); });
      });
    });

    $$('#view [data-apno]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var c = ctx(b.dataset.apno); if (!c) return;
        var box = $('#view [data-apwhy="' + b.dataset.apno + '"]');
        var why = box ? String(box.value || '').trim() : '';
        if (!why) {
          toast('A reason is required — it is what they read.', 'bad');
          if (box) box.focus();
          return;
        }
        b.disabled = true;
        var at = new Date().toISOString();
        setWeek(c.C, c.slug, c.ending, function (w) {
          if (w.returnRequest) {
            w.returnRequest = null;
            w.history = (w.history || []).concat([
              { at: at, what: 'reopening refused', by: ME.name, why: why }]);
            w.refused = { why: why, at: at, by: ME.name };
          } else {
            w.versions = (w.versions || []).concat([{ at: w.submittedAt, rows: w.rows, state: w.state }]);
            w.state = 'returned'; w.returnedWhy = why; w.returnedAt = at;
            w.history = (w.history || []).concat([
              { at: at, what: 'sent back', by: ME.name, why: why }]);
          }
        }, 'hours sent back: ' + c.slug + ' ' + c.ending)
          .then(function () {
            return notify(c.C.slug, { kind: 'hours-sent-back', orderId: null,
              order: 'Week ending ' + c.ending, company: c.C.F.company, who: c.slug,
              said: why, raisedOn: at, forAttentionOf: null, sent: false, sentOn: null });
          })
          .then(function () { toast('Sent back with your reason.', 'ok'); redraw(); })
          .catch(function (er) { b.disabled = false; failed(er); });
      });
    });
  }


  /* ---- the banner --------------------------------------------------------

  function canViewAs() {

    var acc = ME.access || {};
