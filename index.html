<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MISMO Service Orders and Agreements</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>:root{
 --navy:#0d314c; --sky:#74bfeb; --navy-deep:#06202f; --navy-mid:#14486e;
 --sky-soft:#a9d8f3; --sky-wash:#e4f2fb;
 --ground:#f1f6fa; --surface:#ffffff; --surface-2:#f6fafd; --surface-3:#e9f1f8;
 --border:#d5e2ed; --border-strong:#adc4d6; --rule:#e5eef5; --line:#e5eef5; --sunk:#f6fafd;
 --ink:#0d314c; --ink-2:#456179; --ink-3:#7794aa;
 --good:#0f7b5c; --bad:#b3372c; --warn:#a2701a;
 --accent-soft:#e4f2fb;
 --display:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
 --ui:var(--display); --mono:'IBM Plex Mono',ui-monospace,monospace;
 --hq-h:64px; --rail-w:240px; --rail-mini:62px;
 color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
 --ground:#061722; --surface:#0d2837; --surface-2:#123143; --surface-3:#173c52;
 --border:#1f4a63; --border-strong:#2f6688; --rule:#173547; --line:#173547; --sunk:#123143;
 --ink:#e9f4fb; --ink-2:#a6c5d9; --ink-3:#7a9db4;
 --good:#4fc79b; --bad:#f08579; --warn:#e0a83c; --accent-soft:#173c52;
 color-scheme:dark; } }
:root[data-theme="dark"]{
 --ground:#061722; --surface:#0d2837; --surface-2:#123143; --surface-3:#173c52;
 --border:#1f4a63; --border-strong:#2f6688; --rule:#173547; --line:#173547; --sunk:#123143;
 --ink:#e9f4fb; --ink-2:#a6c5d9; --ink-3:#7a9db4;
 --good:#4fc79b; --bad:#f08579; --warn:#e0a83c; --accent-soft:#173c52;
 color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--display);font-size:14px;line-height:1.55;
 padding-left:var(--rail-w);transition:padding-left .2s cubic-bezier(.4,0,.2,1);-webkit-text-size-adjust:100%}
h1,h2,h3,h4{letter-spacing:-.012em;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.wrap{padding:26px 30px 90px;max-width:none}
@media(max-width:640px){ .wrap{padding:18px 16px 70px} }
.lede{color:var(--ink-2);font-size:14.5px;margin:0 0 22px}

/* ── cards in a grid ─────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-bottom:28px}
@media(max-width:1180px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media(max-width:760px){ .grid{grid-template-columns:1fr} }
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:15px 16px;
 text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:7px;
 box-shadow:0 1px 2px rgba(6,32,47,.05)}
.card:hover{border-color:var(--border-strong);box-shadow:0 4px 14px rgba(6,32,47,.10)}
.card:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.card h3{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.card .cnt{font-family:var(--mono);font-size:10px;letter-spacing:.06em;font-weight:600;color:var(--ink-3);
 background:var(--surface-3);border-radius:20px;padding:2px 8px;margin-left:auto;flex:0 0 auto}
.card p{margin:0;color:var(--ink-2);font-size:12.7px}
.card .figs{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:2px}
.card .fig{display:flex;flex-direction:column}
.card .fig b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;color:var(--ink)}
.card .fig i{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.09em;
 text-transform:uppercase;color:var(--ink-3);font-weight:600}

/* ── the right panel ─────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(6,32,47,.44);z-index:120;border:0;padding:0;display:none}
.scrim.on{display:block}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(680px,calc(100vw - 56px));z-index:121;
 background:var(--ground);border-left:1px solid var(--border-strong);
 box-shadow:-10px 0 34px rgba(6,32,47,.28);display:none;flex-direction:column}
.panel.on{display:flex}
@media(max-width:820px){ .panel{width:100vw;max-width:none} }
.panel-h{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--surface);
 border-bottom:1px solid var(--border);flex:0 0 auto}
.panel-h h2{font-size:16px;font-weight:600}
.panel-x{margin-left:auto;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;
 color:var(--ink-2);width:30px;height:30px;font-size:17px;line-height:1;cursor:pointer;flex:0 0 auto}
.panel-x:hover{background:var(--surface-3);color:var(--ink)}
.panel-b{overflow:auto;padding:18px 20px 60px;flex:1 1 auto}

/* ── rows that open on a click ───────────────────────────────── */
.rows{border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--surface)}
.row{border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row-h{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;
 padding:11px 14px;font:inherit;color:inherit;cursor:pointer}
.row-h:hover{background:var(--surface-2)}
.row-h:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.row.open .row-h{background:var(--sky-wash);}
:root[data-theme="dark"] .row.open .row-h{background:var(--surface-3)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .row.open .row-h{background:var(--surface-3)} }
.row-h .rt{font-weight:600;font-size:13.4px;flex:1 1 auto;min-width:0}
.row-h .rs{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink-2);flex:0 0 auto}
.row-h .chev{width:15px;height:15px;flex:0 0 auto;stroke:var(--ink-3);fill:none;stroke-width:2;
 stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.row.open .chev{transform:rotate(90deg)}
.row-b{display:none;padding:4px 16px 18px;background:var(--surface-2);border-top:1px solid var(--rule)}
.row.open .row-b{display:block}

/* ── fields, separate not blobs ──────────────────────────────── */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 20px;margin:14px 0 4px}
.f{display:flex;flex-direction:column;gap:2px;min-width:0}
.f label{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
 color:var(--ink-3);font-weight:600}
.f .v{font-size:13.2px;color:var(--ink);overflow-wrap:anywhere}
.f .v.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.blk{margin-top:16px}
.blk h4{font-size:11px;font-family:var(--mono);letter-spacing:.09em;text-transform:uppercase;
 color:var(--ink-3);font-weight:700;margin-bottom:5px}
.blk ul{margin:0;padding-left:19px}
.blk li{margin-bottom:4px}
.blk p{margin:0 0 7px;white-space:pre-wrap}

/* the order as it will read */
.doc{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:20px 24px;margin-top:16px}
.doc .dt{font-weight:700;font-size:14px;margin-bottom:12px}
.doc .sec{margin-top:15px}
.doc .sn{font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--navy-mid);margin-bottom:4px}
:root[data-theme="dark"] .doc .sn{color:var(--sky)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .doc .sn{color:var(--sky)} }
.doc p{margin:0 0 6px;white-space:pre-wrap}
.doc .sig{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:24px;
 border-top:1px solid var(--rule);padding-top:14px}
@media(max-width:620px){ .doc .sig{grid-template-columns:1fr} }
.doc .sig div b{display:block;font-size:11px;font-family:var(--mono);letter-spacing:.08em;
 text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.doc .sig div span{display:block;font-size:13px}

/* tables */
table{border-collapse:collapse;width:100%;font-size:12.8px}
th,td{padding:7px 11px;text-align:left;border-bottom:1px solid var(--rule)}
th{background:var(--surface-3);font-size:10px;font-family:var(--mono);letter-spacing:.08em;
 text-transform:uppercase;color:var(--ink-2);font-weight:700;border-bottom:2px solid var(--navy-mid)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--surface-2);border-top:2px solid var(--border-strong)}
.tbl{border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--surface)}

/* chips + callouts */
.chip{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Sans',sans-serif;font-size:10.5px;
 letter-spacing:.05em;text-transform:uppercase;font-weight:600;padding:2px 8px;border-radius:20px;
 background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.chip.warn{background:rgba(162,112,26,.14);color:var(--warn)}
.chip.good{background:rgba(15,123,92,.13);color:var(--good)}
.note{border-left:3px solid var(--warn);background:rgba(162,112,26,.08);padding:10px 14px;
 border-radius:0 7px 7px 0;margin:14px 0;font-size:13px}
.note b{color:var(--warn)}
.ok{border-left-color:var(--good);background:rgba(15,123,92,.08)}
.ok b{color:var(--good)}

/* ── editing ─────────────────────────────────────────────────── */
.f input, .f select{font:inherit;font-size:13.2px;font-family:var(--display);color:var(--ink);
 background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 8px;width:100%;min-width:0}
.f input.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.f input:hover,.f select:hover{border-color:var(--border-strong)}
.f input:focus,.f select:focus{outline:2px solid var(--sky);outline-offset:-1px;background:var(--surface-2)}
.f.edited label{color:var(--warn)}
.f.edited input,.f.edited select{border-color:var(--warn);background:rgba(162,112,26,.07)}
.row.edited .row-h .rt::after{content:"Edited";font-family:var(--mono);font-size:9px;letter-spacing:.06em;
 font-weight:600;color:var(--warn);background:rgba(162,112,26,.14);border-radius:20px;padding:2px 7px;margin-left:8px}
.editnote{font-size:12.3px;color:var(--ink-3);margin:2px 0 10px}

/* the floating changes button */
.chgbtn{position:fixed;right:22px;bottom:22px;z-index:130;background:var(--navy);color:#fff;
 border:1px solid var(--navy-mid);border-radius:24px;padding:11px 19px;font:inherit;font-family:var(--display);
 font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(6,32,47,.32);display:none;align-items:center;gap:9px}
.chgbtn.on{display:flex}
.chgbtn:hover{background:var(--navy-mid)}
.chgbtn .n{font-family:var(--mono);background:var(--sky);color:var(--navy-deep);border-radius:20px;padding:1px 8px;font-size:11.5px}
:root[data-theme="dark"] .chgbtn{background:var(--sky);color:var(--navy-deep);border-color:var(--sky)}
:root[data-theme="dark"] .chgbtn .n{background:var(--navy-deep);color:var(--sky)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .chgbtn{background:var(--sky);color:var(--navy-deep);border-color:var(--sky)}
  :root:not([data-theme="light"]) .chgbtn .n{background:var(--navy-deep);color:var(--sky)} }
.copybtn{background:var(--surface-3);border:1px solid var(--border-strong);border-radius:6px;color:var(--ink);
 font:inherit;font-size:12.5px;font-weight:600;padding:7px 14px;cursor:pointer;margin-bottom:14px}
.copybtn:hover{background:var(--sky-wash)}
:root[data-theme="dark"] .copybtn:hover{background:var(--surface-2)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .copybtn:hover{background:var(--surface-2)} }

/* the signing box, as the contractor will see it */
.signbox{border:2px dashed var(--border-strong);border-radius:9px;padding:16px 18px;margin-top:20px;background:var(--surface-2)}
.signbox h4{font-size:11px;font-family:var(--mono);letter-spacing:.09em;text-transform:uppercase;
 color:var(--ink-3);font-weight:700;margin-bottom:9px}
.signbox .stamp{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);margin-top:11px;
 border-top:1px solid var(--rule);padding-top:9px}
.signbox .ack{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13px}
.signbox .ack input[type=checkbox]{width:17px;height:17px;accent-color:var(--navy-mid)}
.fakebtn{background:var(--navy);color:#fff;border:0;border-radius:7px;padding:9px 18px;font:inherit;
 font-family:var(--display);font-size:13px;font-weight:600;margin-top:13px;opacity:.55;cursor:not-allowed}
:root[data-theme="dark"] .fakebtn{background:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .fakebtn{background:var(--sky);color:var(--navy-deep)} }

/* clickable overview figures */
.fig.click{cursor:pointer;border-radius:6px;padding:3px 7px;margin:-3px -7px}
.fig.click:hover{background:var(--sky-wash)}
:root[data-theme="dark"] .fig.click:hover{background:var(--surface-3)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .fig.click:hover{background:var(--surface-3)} }
.fig.click b{text-decoration:underline;text-decoration-color:var(--border-strong);text-underline-offset:3px}

/* ── stat tiles ──────────────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:0 0 26px}
@media(max-width:980px){ .stats{grid-template-columns:repeat(3,1fr)} }
@media(max-width:640px){ .stats{grid-template-columns:1fr 1fr} }
.stat{display:block;width:100%;text-align:left;background:var(--surface);
 border:1px solid var(--border);border-radius:8px;padding:15px 16px;
 font-family:inherit;color:inherit;cursor:pointer;transition:border-color .12s, background .12s}
.stat:hover{border-color:var(--border-strong);background:var(--surface-2)}
.stat:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.stat .lab{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;
 color:var(--ink-3);line-height:1.35;font-weight:600;font-family:var(--mono)}
.stat .val{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;
 font-size:25px;font-weight:600;margin-top:6px;letter-spacing:-.02em;line-height:1.1}
.stat .sub{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px}
.stat.warn{border-left:3px solid var(--warn)} .stat.warn .val{color:var(--warn)}
.stat.good{border-left:3px solid var(--good)} .stat.good .val{color:var(--good)}

/* clickable table rows */
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--sky-wash)}
:root[data-theme="dark"] tr.clk:hover td{background:var(--surface-3)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) tr.clk:hover td{background:var(--surface-3)} }
tr.clk td:first-child::after{content:"›";color:var(--ink-3);font-size:15px;margin-left:8px}

/* who may change what */
.lockbar{display:flex;align-items:center;gap:9px;background:var(--surface-3);border:1px solid var(--border);
 border-radius:7px;padding:8px 12px;margin:2px 0 12px;font-size:12.3px;color:var(--ink-2)}
.lockbar svg{width:15px;height:15px;flex:0 0 auto;stroke:var(--ink-3);fill:none;stroke-width:1.8}
.lockbar b{color:var(--ink)}

/* print / save as PDF */
.printbtn{background:var(--surface-3);border:1px solid var(--border-strong);border-radius:6px;color:var(--ink);
 font:inherit;font-family:var(--display);font-size:12.3px;font-weight:600;padding:6px 13px;cursor:pointer;
 display:inline-flex;align-items:center;gap:7px;margin:14px 0 0}
.printbtn:hover{background:var(--sky-wash)}
:root[data-theme="dark"] .printbtn:hover{background:var(--surface-2)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .printbtn:hover{background:var(--surface-2)} }
.printbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#printhost{display:none}

@media print{
  body.printing{padding:0 !important;background:#fff !important}
  body.printing > *{display:none !important}
  body.printing > #printhost{display:block !important}
  #printhost .doc{border:0;padding:0;margin:0;background:#fff;color:#000;
    font-family:Georgia,'Times New Roman',serif;font-size:11pt;line-height:1.5}
  #printhost .doc .sn{color:#000}
  #printhost .signbox,#printhost .printbtn,#printhost .note{display:none !important}
  @page{margin:1in 1.1in}
}

/* ── the contracting company's own view, previewed ───────────── */
.cvframe{border:1px solid var(--border-strong);border-radius:12px;overflow:hidden;background:var(--surface);
 box-shadow:0 6px 24px rgba(6,32,47,.10);margin-bottom:26px}
.cvbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:11px 18px}
.cvbar .nm{font-weight:600;font-size:14px;color:var(--sky)}
.cvbar .who{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;
 text-transform:uppercase;color:rgba(255,255,255,.62);font-weight:600}
.cvurl{background:var(--surface-3);border-bottom:1px solid var(--border);padding:7px 18px;
 font-family:var(--mono);font-size:11px;color:var(--ink-3);overflow-wrap:anywhere}
.cvbody{padding:18px}
.cvsec{margin-bottom:24px}
.cvsec:last-child{margin-bottom:0}
.cvsec h3{font-size:13.5px;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:9px}
.cvsec .cvsub{font-size:12.3px;color:var(--ink-3);margin-bottom:10px}
.meter{height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden;min-width:70px;flex:1 1 auto}
.meter i{display:block;height:100%;background:var(--sky)}
.meter i.hot{background:var(--warn)}
.meter i.over{background:var(--bad)}
.cvnote{font-size:12.3px;color:var(--ink-2);background:var(--surface-3);border-radius:7px;padding:9px 13px;margin-top:10px}

/* ── figures in the sans face, still aligned ─────────────────── */
.num, .f .v.num, .f input.num, td.n, th.n, .stat .val, .card .fig b, .row-h .rs,
table .n, .doc .num{ font-family:var(--display) !important; font-variant-numeric:tabular-nums;
  letter-spacing:-.004em }
.stat .val{ font-weight:650 }

/* ── services and deliverables, one field per line ───────────── */
.sdlist{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.sdrow{display:flex;gap:8px;align-items:flex-start}
.sdrow input{flex:1 1 auto;min-width:0;font:inherit;font-size:13.2px;font-family:var(--display);
 color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 9px}
.sdrow input:hover{border-color:var(--border-strong)}
.sdrow input:focus{outline:2px solid var(--sky);outline-offset:-1px;background:var(--surface-2)}
.sdrow.edited input{border-color:var(--warn);background:rgba(162,112,26,.07)}
.sdx{flex:0 0 auto;width:28px;height:30px;border:1px solid var(--border);border-radius:6px;
 background:var(--surface-2);color:var(--ink-3);cursor:pointer;font-size:15px;line-height:1;padding:0}
.sdx:hover{background:var(--surface-3);color:var(--bad)}
.sdadd{align-self:flex-start;background:var(--surface-3);border:1px solid var(--border);border-radius:6px;
 color:var(--ink-2);font:inherit;font-family:var(--display);font-size:12.2px;font-weight:600;padding:5px 12px;cursor:pointer;margin-top:2px}
.sdadd:hover{background:var(--sky-wash);color:var(--ink)}
.srcline{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.srcline b{color:var(--ink-2)}

/* ── the review queue in the company view ────────────────────── */
.q td:first-child{width:34px}
.q input[type=checkbox]{width:17px;height:17px;accent-color:var(--navy-mid);cursor:pointer}
.qask{background:none;border:1px solid var(--border);border-radius:6px;color:var(--ink-2);
 font:inherit;font-family:var(--display);font-size:11.8px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.qask:hover{background:var(--surface-3);color:var(--ink)}
.qask.on{background:rgba(162,112,26,.14);border-color:var(--warn);color:var(--warn);font-weight:600}
.qbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}
.qcount{font-size:12.5px;color:var(--ink-2)}
.qcount b{color:var(--ink)}
.qbox{margin-top:8px}
.qbox input{width:100%;font:inherit;font-size:12.8px;font-family:var(--display);color:var(--ink);
 background:var(--surface);border:1px solid var(--warn);border-radius:6px;padding:6px 9px}

/* ── their shell: the same masthead and rail, their own sections ── */
.cvsplit{display:flex;min-height:420px}
.cvrail{flex:0 0 182px;background:var(--navy);color:#fff;padding:10px 8px;display:flex;flex-direction:column;gap:1px}
.cvrail .lbl{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
 font-weight:700;color:rgba(255,255,255,.5);padding:4px 9px 7px}
.cvrail a{display:flex;align-items:center;gap:9px;border-radius:6px;color:rgba(255,255,255,.78);
 padding:7px 9px;font-size:12.5px;font-weight:500;text-decoration:none;cursor:default}
.cvrail a.on{color:#fff;font-weight:600;background:var(--navy-mid);box-shadow:inset 3px 0 0 var(--sky)}
.cvrail a svg{width:15px;height:15px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;
 stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.cvrail a.on svg{stroke:var(--sky);opacity:1}
.cvrail .foot{margin-top:auto;border-top:1px solid rgba(80,164,219,.2);padding-top:7px}
.cvsplit > .cvbody{flex:1 1 auto;min-width:0}
@media(max-width:820px){ .cvsplit{flex-direction:column} .cvrail{flex:0 0 auto;flex-direction:row;flex-wrap:wrap;gap:4px}
  .cvrail .lbl,.cvrail .foot{display:none} }
.cvopen{cursor:pointer}
.cvopen:hover td{background:var(--sky-wash)}
:root[data-theme="dark"] .cvopen:hover td{background:var(--surface-3)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .cvopen:hover td{background:var(--surface-3)} }

/* ── pick the company from inside the preview, where the eye is ── */
.cvpick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.cvpick .cvlab{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
 font-weight:700;color:var(--ink-3);margin-right:2px}
.cvpick button{background:var(--surface);border:1px solid var(--border);border-radius:20px;
 color:var(--ink-2);font:inherit;font-family:var(--display);font-size:12.5px;font-weight:600;
 padding:6px 14px;cursor:pointer}
.cvpick button:hover{border-color:var(--border-strong);color:var(--ink)}
.cvpick button.on{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .cvpick button.on{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .cvpick button.on{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)} }
.cvpick button:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

/* ── the company record ──────────────────────────────────────── */
/* rows share the header's grid so every column starts in the same place */
.crow{display:grid;gap:8px;align-items:center;margin-bottom:7px}
.crow input,.crow select{min-width:0;width:100%;font:inherit;font-size:13.2px;font-family:var(--display);
 color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 9px}
.crow input.num{font-variant-numeric:tabular-nums}
.crow input:hover,.crow select:hover{border-color:var(--border-strong)}
.crow input:focus,.crow select:focus{outline:2px solid var(--sky);outline-offset:-1px;background:var(--surface-2)}
.crow .cx{width:28px;justify-self:start;height:30px;border:1px solid var(--border);border-radius:6px;
 background:var(--surface-2);color:var(--ink-3);cursor:pointer;font-size:15px;line-height:1;padding:0}
.crow .cx:hover{background:var(--surface-3);color:var(--bad)}
.crow .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--ink-3);
 background:var(--surface-3);border-radius:4px;padding:4px 8px;white-space:nowrap;
 text-align:center;justify-self:stretch;overflow:hidden;text-overflow:ellipsis}
.chead{display:grid;gap:8px;margin-bottom:5px;padding:0 0 1px}
.chead span{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
 color:var(--ink-3);font-weight:600}
.addbtn{background:var(--surface-3);border:1px solid var(--border);border-radius:6px;color:var(--ink-2);
 font:inherit;font-family:var(--display);font-size:12.2px;font-weight:600;padding:5px 12px;cursor:pointer;margin-top:4px}
.addbtn:hover{background:var(--sky-wash);color:var(--ink)}
.card.newco{border-style:dashed;align-items:center;justify-content:center;text-align:center;min-height:132px}
.card.newco h3{justify-content:center}
.card.newco .plus{font-size:26px;line-height:1;color:var(--ink-3);font-weight:300}

/* ── no pills: squared tags and tabs throughout ──────────────── */
.chip{border-radius:4px;padding:2px 7px}
.card .cnt{border-radius:4px}
.crow .tag{border-radius:4px}
.railhits .rh-g{border-radius:0}
.cvpick button{border-radius:5px;padding:6px 13px}
.chgbtn{border-radius:7px}
.meter,.meter i{border-radius:2px}
.stat{border-radius:7px}
.card{border-radius:8px}

/* one column spec per section, used by the header and its rows alike */
.cgrid-rate{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 28px}
.cgrid-msa{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr) 28px}
.cgrid-sign{grid-template-columns:118px minmax(0,1fr) minmax(0,1fr) minmax(0,1.25fr)}
.cgrid-people{grid-template-columns:minmax(0,1.2fr) minmax(0,1.3fr) minmax(0,1fr) 28px}
@media(max-width:820px){
  .cgrid-rate,.cgrid-msa,.cgrid-sign,.cgrid-people{grid-template-columns:1fr}
  .crow .cx{justify-self:end}
  .chead{display:none}
  .crow{padding-bottom:9px;border-bottom:1px solid var(--rule)}
}
.cvrail a[data-cvs],.cvrail #cv-theme{cursor:pointer}
.cvrail a[data-cvs]:hover,.cvrail #cv-theme:hover{color:#fff;background:rgba(255,255,255,.09)}

/* ── time reporting ──────────────────────────────────────────── */
.tstate{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--surface-3);
 border:1px solid var(--border);border-radius:7px;padding:9px 13px;margin-bottom:12px}
.tstate .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--ink-3)}
.tstate.open .dot{background:var(--sky)}
.tstate.sub .dot{background:var(--warn)}
.tstate.appr .dot{background:var(--good)}
.tstate .st{font-weight:600;font-size:13px}
.tstate .sd{font-size:12.4px;color:var(--ink-2)}
.tstate .acts{margin-left:auto;display:flex;gap:8px}
.tbtn{background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:6px;
 font:inherit;font-family:var(--display);font-size:12.5px;font-weight:600;padding:6px 14px;cursor:pointer}
.tbtn:hover{background:var(--navy-mid)}
.tbtn.ghost{background:var(--surface);color:var(--ink-2);border-color:var(--border-strong)}
.tbtn.ghost:hover{background:var(--surface-2);color:var(--ink)}
:root[data-theme="dark"] .tbtn{background:var(--sky);color:var(--navy-deep);border-color:var(--sky)}
:root[data-theme="dark"] .tbtn.ghost{background:var(--surface-2);color:var(--ink);border-color:var(--border-strong)}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]) .tbtn{background:var(--sky);color:var(--navy-deep);border-color:var(--sky)}
 :root:not([data-theme="light"]) .tbtn.ghost{background:var(--surface-2);color:var(--ink);border-color:var(--border-strong)} }
.tw input,.tw select{width:100%;min-width:0;font:inherit;font-size:12.8px;font-family:var(--display);color:var(--ink);
 background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:4px 7px}
.tw input.h{font-variant-numeric:tabular-nums;text-align:right}
.tw input:focus,.tw select:focus{outline:2px solid var(--sky);outline-offset:-1px}
.tw input:disabled,.tw select:disabled{background:var(--surface-2);color:var(--ink-2);cursor:not-allowed;border-style:dashed}
.tw td{vertical-align:top;padding:6px 8px}
.tw .neg{color:var(--bad);font-weight:600}
.hdot{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.hdot i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:0 0 auto}
.hdot.g i{background:var(--good)} .hdot.y i{background:var(--warn)} .hdot.r i{background:var(--bad)}
.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding-left:32px;margin-bottom:11px}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:5px;
 background:var(--navy);color:#fff;font-family:var(--display);font-size:11.5px;font-weight:700;
 display:flex;align-items:center;justify-content:center}
:root[data-theme="dark"] .steps li::before{background:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .steps li::before{background:var(--sky);color:var(--navy-deep)} }

/* ── one timesheet entry, in the panel ───────────────────────── */
.tnote label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
 color:var(--ink-3);font-weight:600;margin-bottom:4px}
.tnote textarea{width:100%;min-height:104px;resize:vertical;font:inherit;font-size:13.4px;line-height:1.55;
 font-family:var(--display);color:var(--ink);background:var(--surface);border:1px solid var(--border);
 border-radius:7px;padding:10px 12px}
.tnote textarea:hover{border-color:var(--border-strong)}
.tnote textarea:focus{outline:2px solid var(--sky);outline-offset:-1px;background:var(--surface-2)}
.tnote textarea:disabled{background:var(--surface-2);color:var(--ink-2);border-style:dashed;cursor:not-allowed}
.tnote{margin-top:16px}
.tnote .cnt2{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.tbar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:9px;align-items:center;
 background:var(--surface);border-top:1px solid var(--border);margin:22px -20px -60px;padding:13px 20px 16px}
.tbar .sp{margin-left:auto;font-size:12.3px;color:var(--ink-3)}
.tbar .sp b{color:var(--warn)}
.tw tr.trow{cursor:pointer}
.tw tr.trow:hover td{background:var(--sky-wash)}
:root[data-theme="dark"] .tw tr.trow:hover td{background:var(--surface-3)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .tw tr.trow:hover td{background:var(--surface-3)} }
.tw td.notecell{color:var(--ink-2);font-size:12.4px}
.tw td.notecell.empty{color:var(--ink-3);font-style:italic}

/* ── fiscal year picker inside their sections ────────────────── */
.fypick{display:flex;align-items:center;gap:9px;margin:0 0 10px}
.fypick label{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
 color:var(--ink-3);font-weight:600}
.fypick select{font:inherit;font-size:12.6px;font-family:var(--display);font-weight:600;color:var(--ink);
 background:var(--surface);border:1px solid var(--border-strong);border-radius:5px;padding:5px 10px;cursor:pointer}
.fypick select:hover{background:var(--surface-2)}
.fypick select:focus{outline:2px solid var(--sky);outline-offset:1px}
.fypick .hint{font-size:11.8px;color:var(--ink-3)}

/* ---------- wording library ---------- */
.wsec{margin:14px 0 0}
.wsec h4{margin:0 0 6px;font:600 .78rem/1.3 'IBM Plex Sans',sans-serif;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted)}
.wsec ul{margin:0;padding-left:18px}
.wsec li{margin:0 0 5px;font-size:.92rem;line-height:1.5}
.wsec p{margin:0;font-size:.92rem;line-height:1.55}
.wfind{margin:0 0 12px}
.wfind input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:5px;
  background:var(--card);color:var(--ink);font:400 .95rem/1.3 'IBM Plex Sans',sans-serif}
.wfind input:focus{outline:2px solid var(--sky);outline-offset:1px;border-color:var(--sky)}
h3.sech{margin:26px 0 10px;font:600 1rem/1.3 'IBM Plex Sans',sans-serif;color:var(--ink)}

.crow.isnew input,.crow.isnew select{border-color:var(--sky);background:rgba(116,191,235,.08)}
.addbtn{margin-top:10px}

.printwarn{margin:12px 0 4px;background:var(--card);border:1px solid var(--warn);
  border-left:4px solid var(--warn);border-radius:6px;padding:14px 16px;font-size:13px;
  line-height:1.55;color:var(--ink)}
.printwarn b{color:var(--ink)}
.printwarn>b:first-child{color:var(--warn);display:block;margin-bottom:6px;font-size:13.5px}
.printwarn p{margin:0 0 6px}
.printwarn ol{margin:0;padding-left:20px}
.printwarn li{margin-bottom:6px}
.printwarn .pw-x{margin-top:10px;background:var(--surface-3);border:1px solid var(--border);
  border-radius:5px;color:var(--ink-2);font:inherit;font-size:12.2px;font-weight:600;
  padding:5px 12px;cursor:pointer}
.printwarn .pw-x:hover{background:var(--sky-wash);color:var(--ink)}
@media print{.printwarn{display:none}}

/* ---------- health: the colour is the value ---------- */
.hmark{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;
  background:var(--ink-3);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.hmark.g{background:var(--good)} .hmark.y{background:var(--warn)} .hmark.r{background:var(--bad)}
.hmark.na,.hmark.none{width:auto;height:auto;border-radius:4px;background:none;box-shadow:none;
  font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--ink-3)}
.hpick{display:flex;gap:6px;align-items:center}
.hp{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;padding:0;
  background:var(--card);border:1px solid var(--line);border-radius:5px;cursor:pointer}
.hp:hover:not(:disabled){border-color:var(--sky)}
.hp:disabled{cursor:default;opacity:.55}
.hp:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
.hp .hpdot{width:13px;height:13px;border-radius:50%;background:var(--ink-3);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.hp.g .hpdot{background:var(--good)} .hp.y .hpdot{background:var(--warn)} .hp.r .hpdot{background:var(--bad)}
.hp .hpna{font-family:'IBM Plex Sans',sans-serif;font-size:10.5px;font-weight:700;
  letter-spacing:.03em;color:var(--ink-3)}
.hp.na{width:42px}
.hp.on{border-color:var(--navy);box-shadow:0 0 0 2px var(--sky-wash)}
.hp.on .hpna{color:var(--ink)}
:root[data-theme="dark"] .hp.on{border-color:var(--sky)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .hp.on{border-color:var(--sky)} }
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.tw th.hcol,.tw td.hcol{text-align:center}

/* A contracting company's block inside the VP's and the President's views. */
.cvco{border:1px solid var(--border); border-radius:8px; margin:0 0 16px; overflow:hidden}
.cvco-h{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 12px;
  padding:10px 14px; background:var(--surface-3); border-bottom:1px solid var(--border)}
.cvco-h b{font-size:13.5px}
.cvco-t{margin-left:auto; font-size:12.5px; color:var(--ink-2)}
.cvco .tbl{border:0}
.cvaccept{font-size:12px; color:var(--ink-2); white-space:nowrap}
@media (max-width:620px){ .cvco-t{margin-left:0; width:100%} }

/* The order name is a sentence, not a label, so it gets the width — otherwise
   it wraps one word per line and the table becomes unreadable. */
.cvq{table-layout:auto; width:100%}
.cvq th.so, .cvq td:first-child{width:46%; min-width:300px; white-space:normal;
  overflow-wrap:break-word; line-height:1.35}
.cvq th.n, .cvq td.n{white-space:nowrap; width:1%}
.cvq td, .cvq th{vertical-align:middle}
@media (max-width:900px){ .cvq th.so, .cvq td:first-child{min-width:180px} }

/* A Help page inside a framed screen. */
.cvhelp{padding:4px 0 0}
.cvhelp h4{font-size:13px; font-weight:600; margin:18px 0 6px; color:var(--ink)}
.cvhelp h4:first-child{margin-top:4px}
.cvhelp ol{margin:0 0 4px; padding-left:22px}
.cvhelp li{margin:0 0 6px; line-height:1.5; color:var(--ink-2)}
.cvhelp li b{color:var(--ink)}

/* The totals band — the same one the real portal carries, so the preview and
   the page agree about what a company sees. */
.tot{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px;
  margin:0 0 14px; padding:11px 14px; border-radius:8px;
  background:var(--surface-3); border:1px solid var(--border)}
.tot-l{font-family:var(--mono); font-size:9.5px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-3); font-weight:700; white-space:nowrap}
.tot-v{font-size:14px; color:var(--ink)}
.tot-v b{font-size:17px; font-weight:600; font-variant-numeric:tabular-nums}
@media (max-width:620px){ .tot{gap:2px 10px} .tot-l{width:100%} }

/* Review table: keep the order name readable in a narrow scroller */
.cvbody .tbl{overflow-x:auto}
.cvbody table.q{min-width:640px}
.cvbody table.q td:nth-child(2){min-width:280px; white-space:normal; overflow-wrap:normal; word-break:normal}
@media (max-width:620px){
  .cvbody table.q{min-width:560px}
  .cvbody table.q td:nth-child(2){min-width:240px}
}

/* The role switch on the company preview */
.cvrolenote{font-size:12px; color:var(--ink-3); margin-left:10px; flex:1 1 220px; min-width:0}
.cvnote.warnnote{border-left:3px solid var(--warn); background:var(--surface-3)}
@media (max-width:620px){ .cvrolenote{margin-left:0; flex-basis:100%} }

/* Issues & Activity */
.issacts{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.resbox{margin-top:12px; padding:12px; border-radius:8px;
  background:var(--surface-3); border:1px solid var(--border)}
.resbox .fields{margin:0 0 10px}
.chip.bad{background:rgba(179,55,44,.14); color:var(--bad); font-weight:600}
.chip.good{background:rgba(15,123,92,.14); color:var(--good); font-weight:600}
.row-b textarea{width:100%; box-sizing:border-box; font:inherit; font-size:13px;
  padding:8px 10px; border-radius:6px; border:1px solid var(--border);
  background:var(--surface); color:var(--ink); resize:vertical}
.row-b .f > textarea{margin-top:2px}
.row-sub .sp.long, .row-b p.long{overflow-wrap:anywhere}

/* The state band inside a submitted week */
.wkstate{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px;
  margin:12px 0 0; padding:10px 12px; border-radius:8px;
  background:var(--surface-3); border-left:3px solid var(--border)}
.wkstate.good{border-left-color:var(--good)}
.wkstate.warn{border-left-color:var(--warn)}
.wk-l{font-family:var(--mono); font-size:9.5px; letter-spacing:.11em;
  text-transform:uppercase; font-weight:700; color:var(--ink-2); white-space:nowrap}
.wk-d{font-size:12.5px; color:var(--ink-3); flex:1 1 260px; min-width:0}
@media (max-width:620px){ .wk-l{width:100%} }
.nonote{color:var(--ink-3); opacity:.75; font-style:italic; font-size:12px}

/* Invoices */
.cvh4{font-family:var(--display); font-size:13px; font-weight:700; color:var(--ink);
  margin:26px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--border)}
.cvh4:first-of-type{margin-top:4px}
.totrow td{border-top:2px solid var(--border); background:var(--surface-3)}
.upbox{margin:14px 0; border:1px solid var(--border); border-radius:9px; background:var(--surface)}
.upl{font-family:var(--mono); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase;
  font-weight:700; color:var(--ink-3); padding:10px 14px 0}
.updrop{padding:6px 14px 14px}
.updrop > p{margin:6px 0 10px; font-size:13px; color:var(--ink-2)}
.upnote{font-size:12px; color:var(--ink-3); margin:10px 0 0; line-height:1.55}
.upfile{display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; padding:8px 14px 14px}
.upfile .fn{font-weight:600; font-size:13.5px; color:var(--ink)}
.upfile .fm{font-family:var(--mono); font-size:11.5px; color:var(--ink-3)}
.upfile .tbtn{margin-left:auto}
.invchk{margin:12px 0}
.invtrail{display:flex; flex-wrap:wrap; gap:6px 22px; margin:14px 0 0; padding:12px 14px;
  border-radius:8px; background:var(--surface-3)}
.invtrail .ts{display:flex; align-items:baseline; gap:7px; font-size:12px; color:var(--ink-3)}
.invtrail .tsd{width:7px; height:7px; border-radius:50%; background:var(--border); flex:0 0 auto}
.invtrail .ts.on .tsd{background:var(--good)}
.invtrail .ts.on .tsl{color:var(--ink); font-weight:600}
.invtrail .tsw{font-family:var(--mono); font-size:11px; opacity:.85}
.mailcard{border:1px solid var(--border); border-radius:8px; background:var(--surface); margin:10px 0}
.mailcard .mrow{display:flex; gap:10px; padding:7px 12px; border-bottom:1px solid var(--border); font-size:13px}
.mailcard .ml{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;

/* the navy headline block with its tiles */

  display:flex;flex-direction:column;gap:14px;margin:0 0 22px}

  color:var(--sky-soft);margin-bottom:-6px}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

.tile{background:rgba(255,255,255,.07);border:1px solid rgba(116,191,235,.28);
  border-radius:6px;padding:12px 14px;text-align:left;color:inherit;font:inherit;cursor:pointer}

/* cards */

.hqcard{background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:16px 18px;text-align:left;color:var(--ink);cursor:pointer;display:flex;
  flex-direction:column;gap:10px;font:inherit;
  box-shadow:0 1px 2px rgba(13,49,76,.06),0 6px 18px rgba(13,49,76,.06)}

  box-shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)} }

/* rows that open in the panel */

@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .callout{border-color:var(--sky)} }
/* Cards line their numbers and footers up across the row, the way the HQ does. */
.cards > .hqcard{display:grid;grid-row:span 3;grid-template-rows:subgrid;row-gap:10px;align-content:start}
.hqcard .cfoot{display:flex;flex-direction:column;gap:10px;align-self:start;min-width:0}

.hqtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:97;height:var(--hq-h);

.logoplate{background:#fff;border-radius:7px;padding:8px 14px;display:flex;align-items:center;line-height:0;flex:0 0 auto;position:relative}

.hq.rail{position:fixed;left:0;top:calc(var(--hq-h) + env(safe-area-inset-top,0px));bottom:0;width:var(--rail-w);z-index:95;

  overscroll-behavior:contain;box-shadow:1px 0 0 rgba(80,164,219,.22), 4px 0 18px rgba(6,32,47,.14);
  transition:width .2s cubic-bezier(.4,0,.2,1)}
@media (prefers-reduced-motion:reduce){ .hq.rail,body{transition:none} }
body.railmini{padding-left:var(--rail-mini)}

body.railmini .railfind{padding:9px 0 2px;display:flex;justify-content:center}

body.railmini .railfind-b{display:flex}

body.railmini .hq .mast-right .theme-btn .ti{width:19px;height:19px}
body.railmini .hq .mast-right .theme-btn span{display:none}
.railfind-b{display:none;width:34px;height:30px;border:1px solid rgba(255,255,255,.18);border-radius:7px;
  background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);align-items:center;justify-content:center;padding:0;cursor:pointer}

.rail-top{display:flex;align-items:center;gap:8px;padding:11px 10px 9px;border-bottom:1px solid rgba(80,164,219,.2);flex:0 0 auto}
.rail-lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.55);padding-left:3px}
.railhide{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.18);border-radius:5px;

.railhide svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.railhide:hover{background:rgba(255,255,255,.14);color:#fff}
.railfind{position:relative;padding:11px 12px 3px;flex:0 0 auto}

.railfind input::placeholder{color:rgba(255,255,255,.5)}

.railq-x{position:absolute;right:17px;top:16px;width:20px;height:20px;border:0;border-radius:4px;background:transparent;
  color:rgba(255,255,255,.6);font-size:15px;line-height:1;padding:0;cursor:pointer}

.hq nav{display:flex;flex-direction:column;gap:1px;padding:8px 8px 4px;flex:0 0 auto}
.hq nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;

  border-top:1px solid rgba(80,164,219,.2);flex:0 0 auto}

  color:rgba(255,255,255,.76);padding:8px 10px;font:inherit;font-family:var(--display);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}

  color:var(--side-dim,rgba(255,255,255,.55)); padding-left:8px}

/* Counts in the rail, the same shape and colours as Website Migration HQ.
   GOLD is the default — it arrived and it is waiting on you.  RED (.late)
   means nothing arrived and somebody is past a deadline.  Both are written out
   rather than taken from --warn/--bad, which follow the theme; the rail is
   navy in BOTH themes, so a badge that follows the theme changes colour
   against a background that never did. */
.hq nav button{position:relative}
.hq nav button .railbadge{margin-left:auto; box-sizing:border-box; flex:0 0 auto;
  width:20px; height:20px; padding:0; border-radius:10px;
  display:inline-flex; align-items:center; justify-content:center; text-align:center;
  background:#e0a83c; color:#0d314c;
  font-family:var(--display); font-size:11.5px; font-weight:700; line-height:1;
  font-variant-numeric:tabular-nums}
.hq nav button .railbadge.w2{width:26px}
.hq nav button .railbadge.w3{width:32px}
.hq nav button .railbadge.late{background:#d8453a; color:#fff}
.hq nav button .railbadge.slot1{margin-left:3px}
body.railmini .hq nav button .railbadge{display:inline-flex; position:absolute; top:2px; right:0;
  width:17px; height:17px; padding:0; font-size:10px; margin:0;
  box-shadow:0 0 0 2px var(--navy,#0d314c)}
body.railmini .hq nav button .railbadge.w2{width:22px; right:-3px}
body.railmini .hq nav button .railbadge.w3{width:27px; right:-6px}
body.railmini .hq nav button .railbadge.slot1{top:22px; margin-left:0}

/* The platform page — resources.mismo.org/service-orders/
   Sits on top of style.css so the portal, the Sponsorship Portal and Summit HQ
   read as the same family. Only what is different lives here. */

/* the portal has no rail — undo the offsets the shared masthead stylesheet
   applies for one, and make sure nothing in the masthead can swallow a click */
/* The rail's offset comes back.  These two lines zeroed it, from when this page
   had no rail — it now carries the same one as Summit HQ and the review page,
   so style.css's padding-left:var(--rail-w) is what should win. */
/* The masthead spans the full width ABOVE the rail, which is what railcss.css
   already arranges — so the override that used to flatten it is gone too. */
/* the sticky masthead holds one control; nothing else in it takes a click, so it
   can never sit on top of a button lower down the page */
.hqtop{pointer-events:none}
.hqtop .theme-btn{pointer-events:auto}
/* and leave room under it when something is scrolled into view */
.psec,.psec-h,.row,.row-h,.gobtn,.ghost{scroll-margin-top:84px}
.wrap{padding:22px 30px 90px;max-width:1500px;margin:0 auto}
@media(max-width:640px){ .wrap{padding:16px 16px 70px} }

/* ── masthead ─────────────────────────────────────────────── */
.hqtop{position:sticky;top:0;z-index:40}
.hqtop .who{font-size:12.5px;color:var(--sky-soft);white-space:nowrap;overflow:hidden;
 text-overflow:ellipsis;max-width:46vw;flex:0 0 auto}
.hqtop .hqname{flex:0 1 auto;min-width:0}
@media(max-width:1000px){ .hqtop .who{max-width:34vw} }
.hqtop .who i{font-style:normal;opacity:.55;padding:0 4px}
@media(max-width:640px){ .hqtop .who{display:none} }

/* ── collapsible sections, Title Case, closed by default ──── */
.psec{background:var(--surface);border:1px solid var(--border);border-radius:11px;
 margin:0 0 18px;overflow:hidden;box-shadow:0 1px 2px rgba(6,32,47,.05)}
.psec-h{display:flex;align-items:center;gap:11px;margin:0;padding:15px 18px;cursor:pointer;
 font-size:15px;font-weight:600;background:var(--surface);user-select:none}
.psec-h:hover{background:var(--surface-2)}
.psec-h:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.psec.open .psec-h{background:var(--sky-wash);border-bottom:1px solid var(--rule)}
:root[data-theme="dark"] .psec.open .psec-h{background:var(--surface-3)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .psec.open .psec-h{background:var(--surface-3)} }
.psec-h .chev{width:16px;height:16px;flex:0 0 auto;stroke:var(--ink-3);fill:none;stroke-width:2;
 stroke-linecap:round;stroke-linejoin:round;transition:transform .16s}
.psec.open .psec-h .chev{transform:rotate(90deg)}
.psec-h .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
 font-weight:600;color:var(--ink-3);background:var(--surface-3);border-radius:20px;padding:3px 10px}
.psec-b{display:none;padding:16px 18px 20px}
.psec.open .psec-b{display:block}
.subh{font-size:12.5px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;
 color:var(--ink-3);margin:22px 0 9px;font-weight:600}

/* ── rows behave as they do everywhere else ───────────────── */
.row-h{cursor:pointer}
.docstack{margin-top:16px}
.dochost{overflow-wrap:anywhere}

/* ── status pills ─────────────────────────────────────────── */
.pill{display:inline-flex;align-items:center;font-family:var(--mono);font-size:10px;
 letter-spacing:.07em;text-transform:uppercase;font-weight:600;border-radius:20px;
 padding:3px 9px;background:var(--surface-3);color:var(--ink-2);flex:0 0 auto;white-space:nowrap}
.pill.good{background:rgba(15,123,92,.14);color:var(--good)}
.pill.warn{background:rgba(162,112,26,.16);color:var(--warn)}
.pill.quiet{background:transparent;border:1px solid var(--border);color:var(--ink-3)}
:root[data-theme="dark"] .pill.good{background:rgba(79,199,155,.16)}
:root[data-theme="dark"] .pill.warn{background:rgba(224,168,60,.18)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .pill.good{background:rgba(79,199,155,.16)}
 :root:not([data-theme="light"]) .pill.warn{background:rgba(224,168,60,.18)} }

/* ── tables ───────────────────────────────────────────────── */
.tbl{margin:12px 0}
.tbl table{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;
 text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:9px 12px;
 background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.bad{color:var(--bad);font-weight:600}
.tbl td.tick,.tbl th.tick{width:34px;text-align:center;padding-right:0}
.tbl input[type=checkbox]{width:16px;height:16px;accent-color:var(--navy-mid);cursor:pointer}
.tbl tr.openrow{cursor:default}
/* On a phone a table either side-scrolls or crushes its columns. Neither is
   good, so the columns that are read rather than compared step out of the way
   and the detail stays one tap below, on the order itself. */
@media(max-width:700px){
  .tbl .hide-narrow{display:none}
  .tbl td,.tbl th{padding:9px 10px}
}

/* ── the acceptance bar ───────────────────────────────────── */
.ackbar,.batchbar,.onebar,.askbox{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;
 margin:16px 0 6px;padding:14px 16px;background:var(--surface-2);border:1px solid var(--border);
 border-radius:9px}
.ackbar .f,.onebar .f,.askbox .f{min-width:200px;flex:1 1 220px}
.gobtn{font:inherit;font-size:13px;font-weight:600;padding:9px 18px;border-radius:7px;
 background:var(--navy);color:#fff;border:1px solid var(--navy);cursor:pointer;white-space:nowrap}
.gobtn:hover:not(:disabled){background:var(--navy-mid);border-color:var(--navy-mid)}
.gobtn:disabled{opacity:.45;cursor:not-allowed}
.gobtn:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
:root[data-theme="dark"] .gobtn{background:var(--sky);color:var(--navy-deep);border-color:var(--sky)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .gobtn{background:var(--sky);color:var(--navy-deep);border-color:var(--sky)} }
.ghost{font:inherit;font-size:12.6px;padding:8px 14px;border-radius:7px;background:var(--surface);
 color:var(--ink);border:1px solid var(--border-strong);cursor:pointer;white-space:nowrap}
.ghost:hover{background:var(--surface-3)}
.qc{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);align-self:center}
.fineprint{font-size:12.3px;color:var(--ink-3);margin:8px 0 0;max-width:none}
.dl{color:var(--navy-mid);font-weight:600}
:root[data-theme="dark"] .dl{color:var(--sky)}

/* ── what was signed ──────────────────────────────────────── */
.signed{border-left:3px solid var(--good);background:rgba(15,123,92,.07);padding:10px 14px;
 border-radius:0 7px 7px 0;margin:14px 0 0;font-size:13px}
.signed .what{display:block;font-family:var(--mono);font-size:11.3px;color:var(--ink-3);margin-top:4px}
.note.warn{border-left-color:var(--warn)}
.upl{border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin:12px 0;background:var(--surface)}
.upl input[type=file]{font:inherit;font-size:12.4px;color:var(--ink-2)}

/* ── the board ────────────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 20px}
@media(max-width:900px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr))} }
.stat{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:11px 13px}
.stat.warn{border-color:var(--warn)}
.stat .lab{display:block;font-size:9.5px;font-family:var(--mono);letter-spacing:.09em;
 text-transform:uppercase;color:var(--ink-3);font-weight:600}
.stat .val{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;
 font-size:22px;font-weight:600;color:var(--ink);margin-top:2px}

/* ── states ───────────────────────────────────────────────── */
.loading{display:flex;align-items:center;gap:12px;color:var(--ink-2);padding:50px 0;font-size:14px}
.spin{width:16px;height:16px;border:2px solid var(--border-strong);border-top-color:var(--navy-mid);
 border-radius:50%;animation:sp .8s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.shut{max-width:620px;margin:60px auto;text-align:center;background:var(--surface);
 border:1px solid var(--border);border-radius:12px;padding:34px 30px}
.shut h2{font-size:19px;margin-bottom:10px}
.shut p{color:var(--ink-2);font-size:14px;margin:0}
.empty{color:var(--ink-3);font-size:13.4px;margin:4px 0}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);opacity:0;z-index:300;
 background:var(--navy);color:#fff;font-size:13.2px;padding:11px 20px;border-radius:9px;
 box-shadow:0 8px 26px rgba(6,32,47,.28);transition:opacity .2s,transform .2s;max-width:88vw}
.toast.go{opacity:1;transform:translate(-50%,0)}
.toast.good{background:var(--good)} .toast.warn{background:var(--bad)}

/* ── print / save as PDF ──────────────────────────────────── */
#printhost{display:none}
@media print{
  body{background:#fff;padding:0}
  body.printing > *{display:none !important}
  body.printing #printhost{display:block !important;padding:0}
  body.printing .doc{border:0;margin:0;padding:0;background:#fff;color:#000;box-shadow:none}
  body.printing .doc .sn{color:#000}
  .psec,.tbl,.row{box-shadow:none}
}

/* ── narrow ───────────────────────────────────────────────── */
@media(max-width:640px){
  .psec-h{font-size:14px;padding:13px 14px}
  .psec-b{padding:13px 14px 16px}
  .ackbar,.batchbar,.onebar,.askbox{padding:12px}
  .gobtn,.ghost{width:100%}
  .row-h{flex-wrap:wrap;gap:7px 10px}
  .row-h .rt{flex:1 1 100%}
  .doc{padding:15px 16px}
  .doc .sig{grid-template-columns:1fr;gap:16px}
}

/* ── Help ─────────────────────────────────────────────────── */
.hblk{border-top:1px solid var(--rule);padding:14px 0 2px}
.hblk:first-child{border-top:0;padding-top:0}
.hblk h4{font-size:13px;font-weight:600;margin:0 0 6px}
.hblk p{margin:0 0 8px;color:var(--ink-2);font-size:13.2px;max-width:none}
/* .steps already has its numbered badges in the shared stylesheet — only the
   colour and size of the text belong here, or the badges land on the words */
ol.steps{color:var(--ink-2);font-size:13.2px;margin:0 0 10px}
.hblk b{color:var(--ink)}
.why{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:3px;white-space:normal}
.note code{font-family:var(--mono);font-size:11.8px;background:var(--surface-3);
 border-radius:4px;padding:1px 5px}

/* ---- fee totals (decision 31) -------------------------------------------
   One band, used by To Review and by My Service Orders, so the two read as the
   same thing said about two different sets of orders. */
.tot{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px;
  margin:0 0 14px; padding:11px 14px; border-radius:8px;
  background:var(--surface-3); border:1px solid var(--border)}
.tot-l{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-3); font-weight:700; white-space:nowrap}
.tot-v{font-size:14px; color:var(--ink)}
.tot-v .num{font-size:17px; font-weight:600; font-variant-numeric:tabular-nums}
@media (max-width:560px){ .tot{gap:2px 10px} .tot-l{width:100%} }

/* The fiscal-year picker sits INSIDE the totals band, so it takes the band's
   own type and weight rather than arriving as raw browser chrome. */
.tot select{font:inherit; font-size:14px; font-weight:600; color:var(--ink);
  background:var(--surface); border:1px solid var(--border-strong); border-radius:6px;
  padding:3px 26px 3px 9px; margin-right:4px; cursor:pointer; line-height:1.3;
  -webkit-appearance:none; appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237794aa' stroke-width='2.2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat; background-position:right 7px center; background-size:12px}
.tot select:hover{border-color:var(--accent)}
.tot select:focus-visible{outline:2px solid var(--sky); outline-offset:1px}
:root[data-theme="dark"] .tot select,
:root:not([data-theme="light"]) .tot select{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237a9db4' stroke-width='2.2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>")}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .tot select{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237794aa' stroke-width='2.2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>")} }

/* ---------- signing in ----------------------------------------------------
   The first screen anybody sees. Signed out there is nothing to navigate, so
   the rail goes entirely and the card sits centred in the page on its own. */
body.signedout{padding-left:0}
body.signedout .hq.rail{display:none}
body.signedout .railscrim{display:none}
body.signedout .hqtop{margin-left:0;width:100%}
body.signedout main,body.signedout #view{padding:0}

.signwrap{min-height:calc(100vh - var(--hq-h, 64px));display:flex;align-items:center;
  justify-content:center;padding:32px 20px 64px}
.signcard{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:38px 36px 30px;
  box-shadow:0 1px 2px rgba(13,49,76,.06),0 12px 34px rgba(13,49,76,.10)}
:root[data-theme="dark"] .signcard{box-shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.34)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .signcard{
  box-shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.34)} }

/* The wordmark's body is navy by design, so on a navy plate it has to be
   inverted or it vanishes and only the sky S shows. */
.signmark{background:var(--navy);border-radius:8px;padding:12px 18px;display:flex;
  align-items:center;justify-content:center;margin:0 0 24px;
  --logo-body:#ffffff; --logo-s:var(--sky)}
.signmark .wordmark{height:22px;width:auto;display:block}
.signcard h2{font-size:19px;font-weight:700;letter-spacing:-.012em;margin:0 0 6px;color:var(--ink)}
.signsub{margin:0 0 22px;font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.signnote:empty{display:none}
.signnote{margin:0 0 18px}
.signnote .note{margin:0}

.signfields{display:flex;flex-direction:column;gap:15px;margin:0 0 20px}
.signfields .f{display:flex;flex-direction:column;gap:6px}
.signfields label{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.signfields input{width:100%;box-sizing:border-box;font:inherit;font-size:14.5px;
  padding:11px 13px;border:1px solid var(--border-strong);border-radius:7px;
  background:var(--surface-2);color:var(--ink)}
.signfields input::placeholder{color:var(--ink-3);opacity:.85}
.signfields input:focus{outline:none;border-color:var(--navy-mid);
  background:var(--surface);box-shadow:0 0 0 3px rgba(20,72,110,.16)}
:root[data-theme="dark"] .signfields input:focus{border-color:var(--sky);
  box-shadow:0 0 0 3px rgba(116,191,235,.22)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .signfields input:focus{
  border-color:var(--sky);box-shadow:0 0 0 3px rgba(116,191,235,.22)} }

.signgo{display:block;width:100%;background:var(--navy);color:#fff;border:1px solid var(--navy);
  border-radius:7px;padding:12px 16px;font:inherit;font-family:var(--display);font-size:14.5px;
  font-weight:600;cursor:pointer}
.signgo:hover:not(:disabled){background:var(--navy-mid)}
.signgo:disabled{opacity:.6;cursor:wait}
.signgo:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
:root[data-theme="dark"] .signgo{background:var(--sky);color:var(--navy-deep);border-color:var(--sky)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .signgo{
  background:var(--sky);color:var(--navy-deep);border-color:var(--sky)} }

.signfine{margin:18px 0 0;font-size:12px;line-height:1.6;color:var(--ink-3);text-align:center}
.signfine a{color:var(--navy-mid);font-weight:600}
:root[data-theme="dark"] .signfine a{color:var(--sky)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .signfine a{color:var(--sky)} }
.signerr{display:block;margin-top:6px;font-family:var(--mono);font-size:11px;opacity:.8}

@media(max-width:480px){
  .signwrap{padding:18px 14px 48px;align-items:flex-start}
  .signcard{padding:28px 22px 24px;border-radius:10px}
}

/* sign out, at the foot of the rail */
.railout{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;
  border:0;border-top:1px solid rgba(80,164,219,.2);border-radius:0;margin-top:8px;padding:11px 10px 8px;
  color:rgba(255,255,255,.62);font:inherit;font-family:var(--display);font-size:12.5px;
  font-weight:500;cursor:pointer;white-space:nowrap}
.railout svg{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.railout:hover{color:#fff;background:rgba(255,255,255,.07)}
.railout:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
body.railmini .railout span{display:none}
body.railmini .railout{justify-content:center;padding:11px 0 8px}
</style>
</head>
