  color:rgba(255,255,255,.76);padding:8px 10px;font:inherit;font-family:var(--display);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.theme-btn .ti{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.theme-btn .ti-sun{display:none}
:root[data-theme="dark"] .theme-btn .ti-moon{display:none}
:root[data-theme="dark"] .theme-btn .ti-sun{display:block}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .theme-btn .ti-moon{display:none}
  :root:not([data-theme="light"]) .theme-btn .ti-sun{display:block} }
.theme-btn:hover{color:#fff;background:rgba(255,255,255,.09)}
.theme-btn:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.railscrim{position:fixed;inset:0;z-index:94;background:rgba(6,32,47,.42);border:0;padding:0;display:none}
@media(max-width:900px){
  body:not(.railmini){padding-left:var(--rail-mini)}
  body:not(.railmini) .hqtop{margin-left:calc(0px - var(--rail-mini));width:calc(100% + var(--rail-mini))}
  body:not(.railmini) .hq.rail{box-shadow:4px 0 26px rgba(6,32,47,.4)}
  body:not(.railmini) .railscrim{display:block} }

/* the page name is longer than Summit HQ's — let it shrink rather than push the bar wide */
.hqtop .hqname{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media(max-width:700px){
  .hqtop{padding:0 14px}
  .hqtop .mastrule{margin-inline:12px}
  .hqtop .hqname{font-size:14px}
}

/* The count beside a rail item — the same number the section header carries. */
.hq nav button .railn{margin-left:auto; font-style:normal;
  font-family:var(--mono); font-size:10.5px; font-weight:600;
  color:var(--side-dim,rgba(255,255,255,.55)); padding-left:8px}
.hq nav button[aria-current="page"] .railn{color:rgba(255,255,255,.85)}
body.railmini .hq nav button .railn{display:none}

/* Counts in the rail, the same shape and colours as Website Migration HQ.
   GOLD is the default — it arrived and it is waiting on you.  RED (.late)
   means nothing arrived and somebody is past a deadline.  Both are written out
   rather than taken from --warn/--bad, which follow the theme; the rail is
   navy in BOTH themes, so a badge that follows the theme changes colour
   against a background that never did. */
.hq nav button{position:relative}
.hq nav button .railbadge{margin-left:auto; box-sizing:border-box; flex:0 0 auto;
  width:20px; height:20px; padding:0; border-radius:10px;
  display:inline-flex; align-items:center; justify-content:center; text-align:center;
  background:#e0a83c; color:#0d314c;
  font-family:var(--display); font-size:11.5px; font-weight:700; line-height:1;
  font-variant-numeric:tabular-nums}
.hq nav button .railbadge.w2{width:26px}
.hq nav button .railbadge.w3{width:32px}
.hq nav button .railbadge.late{background:#d8453a; color:#fff}
.hq nav button .railbadge.slot1{margin-left:3px}
body.railmini .hq nav button .railbadge{display:inline-flex; position:absolute; top:2px; right:0;
  width:17px; height:17px; padding:0; font-size:10.5px; margin:0;
  box-shadow:0 0 0 2px var(--navy,#0d314c)}
body.railmini .hq nav button .railbadge.w2{width:22px; right:-3px}
body.railmini .hq nav button .railbadge.w3{width:27px; right:-6px}
body.railmini .hq nav button .railbadge.slot1{top:22px; margin-left:0}

/* =========================================================================
 * ONE TYPEFACE.
 *
 * ⚠ The portal was using IBM Plex Mono for labels, totals, table headers,
 * chips and status pills, and IBM Plex Sans for everything else — two families
 * interleaved line by line, which is what "the font looks all over the place"
 * was.  Every other MISMO artifact (Website Migration HQ, Summit HQ) maps
 * --mono straight onto the display face and carries the whole hierarchy on
 * SIZE, WEIGHT and LETTER-SPACING instead.  This does the same.
 *
 * Tabular figures came free with the monospace; they are put back explicitly
 * on the body so columns of numbers still line up.
 * ======================================================================= */
:root{ --mono:var(--display); }
body{ font-variant-numeric:tabular-nums; }
/* A button, input or select does NOT inherit the page font by default — the
   browser gives it its own. The two close crosses (the rail search and the
   panel) were the last two things on the page set in something else. */
button,input,select,textarea,optgroup{font-family:inherit}

/* The platform page — resources.mismo.org/service-orders/
   Sits on top of style.css so the portal, the Sponsorship Portal and Summit HQ
   read as the same family. Only what is different lives here. */

/* the portal has no rail — undo the offsets the shared masthead stylesheet
   applies for one, and make sure nothing in the masthead can swallow a click */
/* The rail's offset comes back.  These two lines zeroed it, from when this page
   had no rail — it now carries the same one as Summit HQ and the review page,
   so style.css's padding-left:var(--rail-w) is what should win. */
/* The masthead spans the full width ABOVE the rail, which is what railcss.css
   already arranges — so the override that used to flatten it is gone too. */
/* the sticky masthead holds one control; nothing else in it takes a click, so it
   can never sit on top of a button lower down the page */
.hqtop{pointer-events:none}
.hqtop .theme-btn{pointer-events:auto}
/* and leave room under it when something is scrolled into view */
.psec,.psec-h,.row,.row-h,.gobtn,.ghost{scroll-margin-top:84px}
.wrap{padding:22px 30px 90px;max-width:1500px;margin:0 auto}
@media(max-width:640px){ .wrap{padding:16px 16px 70px} }

/* ── masthead ─────────────────────────────────────────────── */
.hqtop{position:sticky;top:0;z-index:40}
.hqtop .who{font-size:12.5px;color:var(--sky-soft);white-space:nowrap;overflow:hidden;
 text-overflow:ellipsis;max-width:46vw;flex:0 0 auto}
.hqtop .hqname{flex:0 1 auto;min-width:0}
@media(max-width:1000px){ .hqtop .who{max-width:34vw} }
.hqtop .who i{font-style:normal;opacity:.55;padding:0 4px}
@media(max-width:640px){ .hqtop .who{display:none} }

/* ── collapsible sections, Title Case, closed by default ──── */
/* ── a section is a PAGE ──────────────────────────────────────────────
   One is shown at a time; the rail chooses which. There is no fold, so the
   heading is a title and not a control: no pointer, no hover, no chevron,
   nothing to press. The card border goes with the fold — a page is the page,
   not a box sitting on one. */
.psec{display:none;margin:0}
.psec.current{display:block}
.psec-h{display:flex;align-items:baseline;gap:11px;margin:0 0 4px;padding:0;
 font-size:21px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.psec-h .cnt{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
 font-weight:600;color:var(--ink-3);background:var(--surface-3);border-radius:4px;padding:3px 10px;
 position:relative;top:-2px}
.psec-b{display:block;padding:0}
/* The page title and the first thing under it need air between them, but a
   lede immediately after the title should not be pushed away from it. */
.psec-b > .lede:first-child{margin-top:10px}
.subh{font-size:12.5px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;
 color:var(--ink-3);margin:22px 0 9px;font-weight:600}

/* ── rows behave as they do everywhere else ───────────────── */
.row-h{cursor:pointer}
.docstack{margin-top:16px}
.dochost{overflow-wrap:anywhere}

/* ── status pills ─────────────────────────────────────────── */
.pill{display:inline-flex;align-items:center;font-family:var(--mono);font-size:10.5px;
 letter-spacing:.07em;text-transform:uppercase;font-weight:600;border-radius:20px;
 padding:3px 9px;background:var(--surface-3);color:var(--ink-2);flex:0 0 auto;white-space:nowrap}
.pill.good{background:rgba(15,123,92,.14);color:var(--good)}
.pill.warn{background:rgba(162,112,26,.16);color:var(--warn)}
.pill.quiet{background:transparent;border:1px solid var(--border);color:var(--ink-3)}
:root[data-theme="dark"] .pill.good{background:rgba(79,199,155,.16)}
:root[data-theme="dark"] .pill.warn{background:rgba(224,168,60,.18)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .pill.good{background:rgba(79,199,155,.16)}
 :root:not([data-theme="light"]) .pill.warn{background:rgba(224,168,60,.18)} }

/* ── tables ───────────────────────────────────────────────── */
.tbl{margin:12px 0}
.tbl table{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;
 text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:9px 12px;
 background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:right;font-family:inherit;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.bad{color:var(--bad);font-weight:600}
.tbl td.tick,.tbl th.tick{width:34px;text-align:center;padding-right:0}
.tbl input[type=checkbox]{width:16px;height:16px;accent-color:var(--navy-mid);cursor:pointer}
.tbl tr.openrow{cursor:default}
/* On a phone a table either side-scrolls or crushes its columns. Neither is
   good, so the columns that are read rather than compared step out of the way
   and the detail stays one tap below, on the order itself. */
@media(max-width:700px){
  .tbl .hide-narrow{display:none}
  .tbl td,.tbl th{padding:9px 10px}
}

/* ── the acceptance bar ───────────────────────────────────── */
.ackbar,.batchbar,.onebar,.askbox{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;
 margin:16px 0 6px;padding:14px 16px;background:var(--surface-2);border:1px solid var(--border);
 border-radius:9px}
.ackbar .f,.onebar .f,.askbox .f{min-width:200px;flex:1 1 220px}
.gobtn{font:inherit;font-size:13px;font-weight:600;padding:9px 18px;border-radius:7px;
 background:var(--navy);color:#fff;border:1px solid var(--navy);cursor:pointer;white-space:nowrap}
.gobtn:hover:not(:disabled){background:var(--navy-mid);border-color:var(--navy-mid)}
.gobtn:disabled{opacity:.45;cursor:not-allowed}
.gobtn:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
:root[data-theme="dark"] .gobtn{background:var(--sky);color:var(--navy-deep);border-color:var(--sky)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .gobtn{background:var(--sky);color:var(--navy-deep);border-color:var(--sky)} }
.ghost{font:inherit;font-size:12.5px;padding:8px 14px;border-radius:7px;background:var(--surface);
 color:var(--ink);border:1px solid var(--border-strong);cursor:pointer;white-space:nowrap}
.ghost:hover{background:var(--surface-3)}

/* ⚠ Two faults lived here, both on Save Without Sending.
   SIZE: .ghost set its own font-size and padding, so a .gobtn.ghost came out
   smaller than the .gobtn beside it and the pair never lined up.
   HOVER: .gobtn:hover:not(:disabled) is more specific than .ghost:hover, so it
   won — painting a navy background behind .ghost's dark text and making the
   label vanish on the way to clicking it.
   Both fixed by making the ghost a real variant of the button rather than a
   second button that happens to share a class. */
.gobtn.ghost{font-size:13px;font-weight:600;padding:9px 18px;border-radius:7px;
  background:var(--surface);color:var(--ink);border:1px solid var(--border-strong)}
.gobtn.ghost:hover:not(:disabled){background:var(--surface-3);color:var(--ink);
  border-color:var(--navy-mid)}
:root[data-theme="dark"] .gobtn.ghost{background:var(--surface-2);color:var(--ink);
  border-color:var(--border-strong)}
:root[data-theme="dark"] .gobtn.ghost:hover:not(:disabled){background:var(--surface-3);
  color:var(--ink);border-color:var(--sky)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .gobtn.ghost{background:var(--surface-2);color:var(--ink);
    border-color:var(--border-strong)}
  :root:not([data-theme="light"]) .gobtn.ghost:hover:not(:disabled){background:var(--surface-3);
    color:var(--ink);border-color:var(--sky)}
}
/* the same pairing on the smaller buttons */
.tbtn.ghost{background:var(--surface);color:var(--ink);border-color:var(--border-strong)}
.tbtn.ghost:hover:not(:disabled){background:var(--surface-3);color:var(--ink);
  border-color:var(--navy-mid)}
:root[data-theme="dark"] .tbtn.ghost{background:var(--surface-2);color:var(--ink)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .tbtn.ghost{background:var(--surface-2);color:var(--ink)}
}
.qc{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);align-self:center}
.fineprint{font-size:12.5px;color:var(--ink-3);margin:8px 0 0;max-width:none}
/* A note under a totals band explains THAT band, so it hugs it and the air
   goes below the pair instead — it was floating midway between the band and
   the rows and reading as a caption for the wrong thing. */
.tot + .fineprint{margin:-6px 0 20px}
.dl{color:var(--navy-mid);font-weight:600}
:root[data-theme="dark"] .dl{color:var(--sky)}

/* ── what was signed ──────────────────────────────────────── */
.signed{border-left:3px solid var(--good);background:rgba(15,123,92,.07);padding:10px 14px;
 border-radius:0 7px 7px 0;margin:14px 0 0;font-size:13px}
.signed .what{display:block;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:4px}
.note.warn{border-left-color:var(--warn)}
/* ⚠ This was called .upl, which the SHARED sheet already uses for a tiny
   uppercase monospace LABEL.  The portal used the same name for a whole
   container, so every value and every sentence inside it inherited mono,
   uppercase and 9.5px — which is what made Executed Documents look broken.
   Renamed rather than overridden: two different things must not share a name. */
.execbox{border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin:12px 0;
  background:var(--surface)}
.execbox input[type=file]{font:inherit;font-size:12.5px;color:var(--ink-2)}

/* ── the board ────────────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 20px}
@media(max-width:900px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr))} }
.stat{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:11px 13px}
.stat.warn{border-color:var(--warn)}
.stat .lab{display:block;font-size:10.5px;font-family:var(--mono);letter-spacing:.09em;
 text-transform:uppercase;color:var(--ink-3);font-weight:600}
.stat .val{display:block;font-family:inherit;font-variant-numeric:tabular-nums;
 font-size:22px;font-weight:600;color:var(--ink);margin-top:2px}

/* ── states ───────────────────────────────────────────────── */
.loading{display:flex;align-items:center;gap:12px;color:var(--ink-2);padding:50px 0;font-size:14px}
.spin{width:16px;height:16px;border:2px solid var(--border-strong);border-top-color:var(--navy-mid);
 border-radius:50%;animation:sp .8s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.shut{max-width:620px;margin:60px auto;text-align:center;background:var(--surface);
 border:1px solid var(--border);border-radius:12px;padding:34px 30px}
.shut h2{font-size:19px;margin-bottom:10px}
.shut p{color:var(--ink-2);font-size:14px;margin:0}
.empty{color:var(--ink-3);font-size:13.5px;margin:4px 0}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);opacity:0;z-index:300;
 background:var(--navy);color:#fff;font-size:13.5px;padding:11px 20px;border-radius:9px;
 box-shadow:0 8px 26px rgba(6,32,47,.28);transition:opacity .2s,transform .2s;max-width:88vw}
.toast.go{opacity:1;transform:translate(-50%,0)}
.toast.good{background:var(--good)} .toast.warn{background:var(--bad)}

/* ── print / save as PDF ──────────────────────────────────── */
#printhost{display:none}
@media print{
  body{background:#fff;padding:0}
  body.printing > *{display:none !important}
  body.printing #printhost{display:block !important;padding:0}
  body.printing .doc{border:0;margin:0;padding:0;background:#fff;color:#000;box-shadow:none}
  body.printing .doc .sn{color:#000}
  .psec,.tbl,.row{box-shadow:none}
}

/* ── narrow ───────────────────────────────────────────────── */
@media(max-width:640px){
  .psec-h{font-size:14px;padding:13px 14px}
  .psec-b{padding:13px 14px 16px}
  .ackbar,.batchbar,.onebar,.askbox{padding:12px}
  .gobtn,.ghost{width:100%}
  .row-h{flex-wrap:wrap;gap:7px 10px}
  .row-h .rt{flex:1 1 100%}
  .doc{padding:15px 16px}
  .doc .sig{grid-template-columns:1fr;gap:16px}
}

/* ── Help ─────────────────────────────────────────────────── */
.hblk{border-top:1px solid var(--rule);padding:14px 0 2px}
.hblk:first-child{border-top:0;padding-top:0}
.hblk h4{font-size:13px;font-weight:600;margin:0 0 6px}
.hblk p{margin:0 0 8px;color:var(--ink-2);font-size:13.5px;max-width:none}
/* .steps already has its numbered badges in the shared stylesheet — only the
   colour and size of the text belong here, or the badges land on the words */
ol.steps{color:var(--ink-2);font-size:13.5px;margin:0 0 10px}
.hblk b{color:var(--ink)}
.why{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:3px;white-space:normal}
.note code{font-family:var(--mono);font-size:11.5px;background:var(--surface-3);
 border-radius:4px;padding:1px 5px}

/* ---- fee totals (decision 31) -------------------------------------------
   One band, used by To Review and by My Service Orders, so the two read as the
   same thing said about two different sets of orders. */

/* The fiscal-year picker sits INSIDE the totals band, so it takes the band's
   own type and weight rather than arriving as raw browser chrome. */
.tot select{font:inherit; font-size:14px; font-weight:600; color:var(--ink);
  background:var(--surface); border:1px solid var(--border-strong); border-radius:6px;
  padding:3px 26px 3px 9px; margin-right:4px; cursor:pointer; line-height:1.3;
  -webkit-appearance:none; appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237794aa' stroke-width='2.2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat; background-position:right 7px center; background-size:12px}
.tot select:hover{border-color:var(--accent)}
.tot select:focus-visible{outline:2px solid var(--sky); outline-offset:1px}
:root[data-theme="dark"] .tot select,
:root:not([data-theme="light"]) .tot select{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237a9db4' stroke-width='2.2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>")}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .tot select{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237794aa' stroke-width='2.2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>")} }

/* ---------- signing in ----------------------------------------------------
   The first screen anybody sees. Signed out there is nothing to navigate, so
   the rail goes entirely and the card sits centred in the page on its own. */
body.signedout{padding-left:0}
body.signedout .hq.rail{display:none}
body.signedout .railscrim{display:none}
body.signedout .hqtop{margin-left:0;width:100%}
body.signedout main,body.signedout #view{padding:0}

.signwrap{min-height:calc(100vh - var(--hq-h, 64px));display:flex;align-items:center;
  justify-content:center;padding:32px 20px 64px}
.signcard{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:38px 36px 30px;
  box-shadow:0 1px 2px rgba(13,49,76,.06),0 12px 34px rgba(13,49,76,.10)}
:root[data-theme="dark"] .signcard{box-shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.34)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .signcard{
  box-shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.34)} }

/* The wordmark's body is navy by design, so on a navy plate it has to be
   inverted or it vanishes and only the sky S shows. */
.signmark{background:var(--navy);border-radius:8px;padding:12px 18px;display:flex;
  align-items:center;justify-content:center;margin:0 0 24px;
  --logo-body:#ffffff; --logo-s:var(--sky)}
.signmark .wordmark{height:22px;width:auto;display:block}
.signcard h2{font-size:19px;font-weight:700;letter-spacing:-.012em;margin:0 0 6px;color:var(--ink)}
.signsub{margin:0 0 22px;font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.signnote:empty{display:none}
.signnote{margin:0 0 18px}
.signnote .note{margin:0}

.signfields{display:flex;flex-direction:column;gap:15px;margin:0 0 20px}
.signfields .f{display:flex;flex-direction:column;gap:6px}
.signfields label{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;
  text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.signfields input{width:100%;box-sizing:border-box;font:inherit;font-size:14px;
  padding:11px 13px;border:1px solid var(--border-strong);border-radius:7px;
  background:var(--surface-2);color:var(--ink)}
.signfields input::placeholder{color:var(--ink-3);opacity:.85}
.signfields input:focus{outline:none;border-color:var(--navy-mid);
  background:var(--surface);box-shadow:0 0 0 3px rgba(20,72,110,.16)}
:root[data-theme="dark"] .signfields input:focus{border-color:var(--sky);
  box-shadow:0 0 0 3px rgba(116,191,235,.22)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .signfields input:focus{
  border-color:var(--sky);box-shadow:0 0 0 3px rgba(116,191,235,.22)} }

.signgo{display:block;width:100%;background:var(--navy);color:#fff;border:1px solid var(--navy);
  border-radius:7px;padding:12px 16px;font:inherit;font-family:var(--display);font-size:14px;
  font-weight:600;cursor:pointer}
.signgo:hover:not(:disabled){background:var(--navy-mid)}
.signgo:disabled{opacity:.6;cursor:wait}
.signgo:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
:root[data-theme="dark"] .signgo{background:var(--sky);color:var(--navy-deep);border-color:var(--sky)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .signgo{
  background:var(--sky);color:var(--navy-deep);border-color:var(--sky)} }

.signfine{margin:18px 0 0;font-size:12.5px;line-height:1.6;color:var(--ink-3);text-align:center}
.signfine a{color:var(--navy-mid);font-weight:600}
.subh5{margin:14px 0 4px;font-size:13px;font-weight:700;color:var(--ink-2)}
.ticks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 16px;margin:6px 0 2px}
.tick1{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;line-height:1.45;
  padding:3px 0;cursor:pointer}
.tick1 input{margin-top:3px;flex:none}
.minebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.mbtn{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:4px;
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);cursor:pointer}
.mbtn:hover{border-color:var(--navy-mid)}
.mbtn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.mct{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:3px;
  background:rgba(0,0,0,.08);font-size:12px}
.mbtn.on .mct{background:rgba(255,255,255,.22)}
.pill.cover{background:var(--sky-soft,rgba(116,191,235,.22));color:var(--navy);border-radius:3px}
.hqrow.covering .t{opacity:.92}
.fac{display:inline-block;margin-left:8px;font-size:12px;color:var(--ink-3);font-weight:500}
:root[data-theme="dark"] .mct{background:rgba(255,255,255,.12)}
:root[data-theme="dark"] .pill.cover{background:rgba(116,191,235,.18);color:var(--sky)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .mct{background:rgba(255,255,255,.12)}
  :root:not([data-theme="light"]) .pill.cover{background:rgba(116,191,235,.18);color:var(--sky)}
}
/* ⚠ Deliberately quiet and deliberately NOT in IBM Plex Mono — it is a label,
   not a figure. It only has to be legible when somebody is asked to read it
   out, so it sits below the fold of attention. */
.buildline{margin-top:10px;font-size:11px;letter-spacing:.02em;color:var(--ink-4,var(--ink-3));opacity:.7}
:root[data-theme="dark"] .signfine a{color:var(--sky)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .signfine a{color:var(--sky)} }
.signerr{display:block;margin-top:6px;font-family:var(--mono);font-size:11.5px;opacity:.8}

@media(max-width:480px){
  .signwrap{padding:18px 14px 48px;align-items:flex-start}
  .signcard{padding:28px 22px 24px;border-radius:10px}
}

/* sign out, at the foot of the rail */
.railout{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;
  border:0;border-top:1px solid rgba(80,164,219,.2);border-radius:0;margin-top:8px;padding:11px 10px 8px;
  color:rgba(255,255,255,.62);font:inherit;font-family:var(--display);font-size:12.5px;
  font-weight:500;cursor:pointer;white-space:nowrap}
.railout svg{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.railout:hover{color:#fff;background:rgba(255,255,255,.07)}
.railout:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
body.railmini .railout span{display:none}
body.railmini .railout{justify-content:center;padding:11px 0 8px}

/* ===== Hours ==============================================================
   My Hours, the cover split and the month view.  Everything here builds on
   the shared .fields / .f / .note / .meter rules in style.css rather than
   restating them, so the hours screens read as the same page as the rest. */

/* A note that is saying nothing is wrong, rather than warning. */
.note.ok{border-left-color:var(--good);background:rgba(30,110,70,.07)}
.note.ok b{color:var(--good)}

/* A field that wants the whole row — the two note lines, which are sentences
   rather than values and look wrong squeezed into a 190px column. */
.fields .f.wide{grid-column:1/-1}

/* The hours box itself: narrow, monospaced, and lined up with the figures it
   is compared against. */
.f input.hnum,.f input.covhrs{font-family:inherit;font-variant-numeric:tabular-nums;max-width:120px}

.meterwrap{display:flex;align-items:center;gap:8px;margin:10px 0 2px}

/* ---- the cover split ----------------------------------------------------
   Folded away by default and opened by a plain text link, because on a normal
   week there is nothing to say here and it must not read like a required
   field. */
.covwrap{margin:12px 0 4px;padding:10px 0 0;border-top:1px dashed var(--border)}
.covbody{display:none;margin-top:8px}
.covbody.open{display:block}
.covrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0}
.covrow select.covwho{font:inherit;font-size:13.5px;font-family:var(--display);color:var(--ink);
  background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 8px;
  min-width:190px;flex:1 1 190px}
.covrow input.covhrs{font-size:13.5px;font-family:inherit;font-variant-numeric:tabular-nums;
  color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:6px;
  padding:6px 8px;width:100px}
.covrow select.covwho:focus,.covrow input.covhrs:focus{outline:2px solid var(--sky);outline-offset:-1px}

/* A text link that does something on the page, as distinct from a button that
   sends something to MISMO. */
.lnk{background:none;border:0;padding:0;font:inherit;font-size:12.5px;color:var(--navy-mid);
  text-decoration:underline;text-underline-offset:2px;cursor:pointer;text-align:left}
.lnk:hover{color:var(--navy)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .lnk{color:var(--sky)}
  :root:not([data-theme="light"]) .lnk:hover{color:var(--sky-soft)}
}
:root[data-theme="dark"] .lnk{color:var(--sky)}
:root[data-theme="dark"] .lnk:hover{color:var(--sky-soft)}
.covdel{font-size:11.5px;color:var(--ink-3)}

/* The pre-send check. */
.checks{margin:8px 0 10px;padding-left:18px}
.checks li{margin:4px 0;font-size:13px;line-height:1.5}

@media(max-width:560px){
  .covrow select.covwho,.covrow input.covhrs{flex:1 1 100%;width:100%;max-width:none}
}

/* ===== View As ============================================================
   ⚠ Sticky, not repeated per section: it has to be impossible to forget whose
   screen you are on, and a banner that scrolls away fails at exactly the
   moment somebody is deep in a training session. */
/* ⚠ It stuck at top:0 — which is exactly where the masthead already is, so on
   a phone it sat on top of the MISMO logo.  It sticks BELOW the masthead. */
.vabar{position:sticky;top:calc(var(--hq-h,64px) + env(safe-area-inset-top,0px));z-index:40;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  padding:10px 16px;margin:0 0 14px;border-radius:0 0 10px 10px;
  background:var(--navy);color:#fff;box-shadow:0 2px 10px rgba(6,32,47,.22)}
.vabar .va-l{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--sky);white-space:nowrap}
.vabar .va-c{font-weight:700;font-size:14px;white-space:nowrap}
.vabar .va-r{font-size:12.5px;color:var(--sky-soft);min-width:0;overflow-wrap:anywhere}
.vabar .va-ro{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;background:var(--warn);color:#2a1d05;border-radius:999px;
  padding:3px 10px;white-space:nowrap}
.vabar .va-out{font:inherit;font-size:12.5px;background:transparent;color:#fff;cursor:pointer;
  border:1px solid rgba(255,255,255,.45);border-radius:6px;padding:5px 11px;white-space:nowrap}
.vabar .va-out:hover{background:rgba(255,255,255,.12);border-color:#fff}
.vabar .va-out:focus-visible{outline:2px solid var(--sky);outline-offset:1px}

/* ⚠ On a phone the banner was five lines deep and ate the screen before the
   page began.  It keeps every piece of information and gives up the space. */
@media(max-width:700px){
  .vabar{gap:4px 8px;padding:8px 12px;margin-bottom:10px}
  .vabar .va-l{font-size:9px;letter-spacing:.09em}
  .vabar .va-c{font-size:13px;flex:1 1 auto;min-width:0}
  .vabar .va-r{flex:1 1 100%;font-size:11.5px;line-height:1.35}
  .vabar .va-ro{margin-left:0;order:3;font-size:9px;padding:2px 8px}
  .vabar .va-out{order:4;margin-left:auto;padding:4px 10px;font-size:11.5px}
}

/* ===== The Status Board, in the HQ shape ==================================
   Built on the shared .headline / .tiles / .cards / .hqcard rules in
   style.css.  Only the two things the portal adds are here. */

/* A company card is not a link — nothing opens from it — so it loses the
   pointer and the hover lift the clickable HQ cards carry. */
.hqcard.flat{cursor:default}
.hqcard.flat:hover{border-color:var(--border)}

/* The pipeline along the bottom of a company card.  ⚠ A stage with nothing in
   it is greyed rather than dropped, so all five cards line up and the shape of
   the pipeline reads the same on every one. */
.stepline{display:flex;flex-wrap:wrap;gap:4px}
.stp{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:2px 6px;
  font-size:11.5px;font-weight:600;background:var(--sky-wash);color:var(--navy-mid);
  border:1px solid transparent;white-space:nowrap}
.stp i{font-style:normal;font-variant-numeric:tabular-nums;font-weight:700}
.stp.none{background:transparent;border-color:var(--border);color:var(--ink-3);font-weight:500}
.stp.none i{color:var(--ink-3)}
:root[data-theme="dark"] .stp{background:var(--surface-3);color:var(--sky-soft)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .stp{background:var(--surface-3);color:var(--sky-soft)}
}

/* Four tiles across is right at 1400px and wrong on a phone. */
@media(max-width:900px){ .tiles{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media(max-width:560px){ .tiles{grid-template-columns:1fr} }
@media(max-width:1100px){ .cards{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media(max-width:700px){ .cards{grid-template-columns:1fr} }

/* ⚠ In dark mode the navy headline sits on a navy ground and all but
   disappears.  The tiles inside carry their own borders so it never looked
   broken — it just stopped reading as a block. */
:root[data-theme="dark"] .headline{border:1px solid var(--border-strong)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .headline{border:1px solid var(--border-strong)}
}

/* ===== Hours, second pass =================================================
   Health as a colour, the two notes side by side, and the month split. */

/* ⚠ Health is a colour. A dropdown as wide as the hours box gave four words
   the same weight as the figure, and the point of a health flag is being able
   to see it without reading. The select stays for choosing; the dot is what
   you read. */
.healthpick{display:flex;align-items:center;gap:8px}
.healthpick select{flex:1 1 auto;min-width:0}
.hdot{flex:0 0 auto;width:13px;height:13px;border-radius:50%;display:inline-block;
  border:1px solid rgba(13,49,76,.22)}
.hdot.g{background:var(--good)}
.hdot.y{background:var(--warn)}
.hdot.r{background:var(--bad)}
.hdot.none{background:transparent;border-style:dashed;border-color:var(--border-strong)}
.hdot.na{width:auto;height:auto;border:0;border-radius:3px;padding:1px 6px;background:var(--surface-3);
  color:var(--ink-3);font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;font-weight:600}
.row-h .hdot{margin-left:2px}
/* the Health column in a table wants to be narrow, not a third of the width */
th.hcol,td.hcol{width:62px;text-align:center}
td.hcol .hdot{margin:0 auto}

/* A field that only ever holds a small number should not stretch to 220px. */
.fields .f.narrow{max-width:210px}

/* ⚠ The two notes are what MISMO actually reads. Side by side, five rows deep,
   and draggable further — a one-line box that scrolls sideways is where a
   status report goes to die. */
.fields.notes2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.f textarea{font:inherit;font-size:13.5px;font-family:var(--display);color:var(--ink);
  background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 10px;
  width:100%;min-width:0;resize:vertical;line-height:1.5}
.f textarea:hover{border-color:var(--border-strong)}
.f textarea:focus{outline:2px solid var(--sky);outline-offset:-1px;background:var(--surface-2)}
.f textarea:disabled{background:var(--sunk);color:var(--ink-3)}

/* A block of quoted words in the panel — what somebody actually said. */
.saidbox{margin:6px 0 14px;padding:10px 14px;border-left:3px solid var(--sky);
  background:var(--sky-wash);border-radius:0 6px 6px 0;font-size:13.5px;line-height:1.55}
:root[data-theme="dark"] .saidbox{background:var(--surface-2)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .saidbox{background:var(--surface-2)}
}
/* the panel's own content needs the same spacing the page has */
.panel-b .fields{margin-top:0}
.panel-b .subh{margin:16px 0 6px}

/* ===== Health, as colour ==================================================
   ⚠ Radio buttons wearing dots. A dropdown of the words Green, Yellow and Red
   is not a health flag: the point is being able to take it in without reading.
   The word stays on every one of them, because colour alone is not a label. */
.hpick{display:flex;flex-wrap:wrap;gap:4px}
.hbtn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;
  background:var(--surface);border:1px solid var(--border);border-radius:6px;
  padding:5px 9px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.hbtn:hover:not(:disabled){border-color:var(--border-strong);color:var(--ink)}
.hbtn:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
.hbtn:disabled{opacity:.5;cursor:not-allowed}
.hbtn .hd{width:11px;height:11px;border-radius:50%;flex:0 0 auto;
  border:1px solid rgba(13,49,76,.22);background:var(--surface-3)}
.hbtn.g .hd{background:var(--good)}
.hbtn.y .hd{background:var(--warn)}
.hbtn.r .hd{background:var(--bad)}
.hbtn .hna{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-3)}
.hbtn.on{border-color:var(--navy);background:var(--sky-wash);color:var(--ink);font-weight:600}
.hbtn.on .hd{box-shadow:0 0 0 2px var(--surface),0 0 0 3px currentColor}
:root[data-theme="dark"] .hbtn.on{background:var(--surface-3);border-color:var(--sky)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .hbtn.on{background:var(--surface-3);border-color:var(--sky)}
}
/* at the narrowest, the words would wrap the row onto four lines */
@media(max-width:480px){ .hbtn .hw{display:none} .hbtn{padding:6px 10px} }

/* The Status Board sits on the page rather than inside a collapsible section,
   so it needs the card the section used to give it. */
.board{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:20px 22px;margin:0 0 18px;box-shadow:var(--shadow,0 1px 2px rgba(13,49,76,.06))}
@media(max-width:700px){ .board{padding:16px 14px} }

/* The signature block as it will look, before it can be used. */
.sigprev{margin:16px 0 4px;border:1px dashed var(--border-strong);border-radius:9px;
  padding:12px 14px;background:var(--sunk,var(--surface-2))}
.sigprev-h{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:8px}
.sigprev .onebar{margin:0}
.sigprev input:disabled{background:var(--surface);color:var(--ink-3);cursor:not-allowed}
.sigprev .gobtn:disabled{opacity:.4}

/* ===== Grouped lists, the HQ's shape =====================================
   A group header inside a row list, with the batch action on it. */
.rgrp{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface-3);
  border-bottom:1px solid var(--rule);font-size:11.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-2)}
.rgrp > span{background:var(--surface);border:1px solid var(--border);border-radius:3px;
  padding:0 6px;font-size:11.5px;letter-spacing:0;color:var(--ink)}
.rgrp-go{margin-left:auto;font:inherit;font-size:11.5px;font-weight:600;letter-spacing:0;
  text-transform:none;background:var(--navy);color:#fff;border:1px solid var(--navy);
  border-radius:5px;padding:4px 11px;cursor:pointer;white-space:nowrap}
.rgrp-go:hover{background:var(--navy-mid);border-color:var(--navy-mid)}
:root[data-theme="dark"] .rgrp-go{background:var(--sky);color:var(--navy-deep);border-color:var(--sky)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .rgrp-go{background:var(--sky);color:var(--navy-deep);border-color:var(--sky)}
}
/* the decide action inside the panel */
.decidebar{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px}

/* ===== The unsaved-changes question ======================================
   ⚠ Hours are entered in the panel now, and a panel can be dismissed with a
   stray click on the scrim or the Escape key.  Nothing is allowed to close
   over unsaved work without asking — the same three-way question the Website
   Migration HQ asks. */
.modal{position:fixed;inset:0;z-index:150;background:rgba(6,32,47,.5);display:flex;
  align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none!important}
.modal-box{background:var(--surface);color:var(--ink);border:1px solid var(--border-strong);
  border-radius:9px;box-shadow:0 18px 48px rgba(6,32,47,.35);padding:20px 22px;max-width:480px;width:100%}
.modal-box h2{font-size:17px;font-weight:700;margin:0}
.modal-box p{margin:6px 0 16px;color:var(--ink-2)}
.modal-acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.gobtn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.gobtn.danger:hover:not(:disabled){background:var(--bad-soft,var(--surface-3));color:var(--bad)}

/* ===== The actions at the foot of a panel ================================
   ⚠ This markup was carried over from the HQ without its styling, so the
   buttons and the Unsaved label sat jammed together with nothing above them. */
.rowacts{display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  margin:20px 0 4px;padding-top:16px;border-top:1px solid var(--rule,var(--border))}
.rowacts .unsaved{margin-right:auto;display:inline-flex;align-items:center;gap:7px;
  font-size:12.5px;font-weight:600;color:var(--warn)}
.rowacts .unsaved::before{content:"";width:7px;height:7px;border-radius:50%;
  background:var(--warn);flex:0 0 auto}
.rowacts .unsaved[hidden]{display:none}
/* with nothing unsaved, the buttons still sit to the right */
.rowacts .unsaved[hidden] + .gobtn{margin-left:auto}
@media(max-width:480px){
  .rowacts{gap:8px}
  .rowacts .gobtn{flex:1 1 auto}
}

/* ===== The signed service orders =========================================
   ⚠ Only on a signer's screen, and only for orders both parties have signed.
   A facilitator's list is built separately and carries no document at all,
   because the order has the rate written on it. */
.signedbox{border:1px solid var(--border);border-radius:9px;padding:14px 16px 6px;
  margin:0 0 20px;background:var(--surface-2)}
.signedbox .subh{margin:0 0 4px}
.signedbox .tbl{margin-top:10px}
.signedbox .ackbar{margin-top:12px}

/* ⚠ Even and aligned: the tick column is a fixed width, centred, and the row
   height does not change when a box is ticked. The download column is fixed
   too, so every button sits on the same edge. */
.signtbl th.tick,.signtbl td.tick{width:38px;text-align:center;padding-left:10px;padding-right:0}
.signtbl th.tick input,.signtbl td.tick input{width:16px;height:16px;margin:0;vertical-align:middle;
  accent-color:var(--navy-mid);cursor:pointer;display:inline-block}
.signtbl th.dl-col,.signtbl td.dl-col{width:1%;white-space:nowrap;text-align:right;
  padding-right:12px}
.signtbl td,.signtbl th{vertical-align:middle}
.signtbl td{padding-top:9px;padding-bottom:9px}
.signtbl .gobtn.ghost{padding:5px 12px;font-size:12.5px;font-weight:600}
#signhost{display:none}

/* every order starts a new sheet */
@media print{ .pagebreak{break-before:page;page-break-before:always} }

@media(max-width:560px){
  .signedbox{padding:12px 12px 6px}
  .signtbl th.dl-col,.signtbl td.dl-col{padding-right:8px}
  .signtbl .gobtn.ghost{padding:5px 9px}
}


/* ── weeks still owed ───────────────────────────────────────────────────────
   Decision 40. A missed week used to be unreachable, so this band is the only
   thing standing between somebody and putting last week's hours on this
   month's invoice. It sits ABOVE everything else in My Hours on purpose. */
.owed{background:var(--surface);border:1px solid var(--warn);border-left:3px solid var(--warn);
  border-radius:8px;padding:13px 16px;margin:0 0 18px}
.owed-h{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;color:var(--ink)}
.owed-n{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;
  padding:0 6px;border-radius:11px;background:var(--warn);color:#fff;font-size:11.5px;font-weight:700}
:root[data-theme="dark"] .owed-n{color:var(--navy-deep)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .owed-n{color:var(--navy-deep)} }
